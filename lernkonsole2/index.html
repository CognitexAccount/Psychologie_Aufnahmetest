ng der sekundären Merkmale – bei Buben Testosteron, bei Mädchen Östrogen und Progesteron.", "<b>Pubertätsbeginn</b>: Buben zwischen dem 10. und 17., Mädchen zwischen dem 9. und 14. Lebensjahr; der Zeitpunkt variiert individuell stark.", "<b>Marksteine</b>: <b>Menarche</b> (erste Menstruation, im Durchschnitt mit ca. 12 Jahren) und <b>Spermarche</b> (Beginn der Spermienproduktion).", "<b>Merkregel</b>: primär = zur Fortpflanzung nötig; sekundär = von außen sichtbares Signal der Reife."]}}, {"id": "k6-62e5076fb6", "kap": 6, "sec": "6.2.1 Pränatale Entwicklung", "stem": "Welche Aussagen zu den drei Phasen der pränatalen Entwicklung treffen zu?", "opts": [{"t": "Das germinale Stadium reicht von der Befruchtung bis zur achten Schwangerschaftswoche.", "c": false, "fb": "Es reicht bis zur 2. Schwangerschaftswoche und umfasst die ersten etwa 10 bis 14 Tage nach Bildung der Zygote; bis zur 8. Woche dauert das embryonale Stadium."}, {"t": "Im embryonalen Stadium beginnen sich die zuvor neutralen, untereinander austauschbaren Stammzellen zu spezialisieren und Organe auszubilden.", "c": true, "fb": "In dieser Phase wird auch der erste Herzschlag messbar – mit 120 bis 160 Schlägen pro Minute fast doppelt so schnell wie bei einer erwachsenen Person."}, {"t": "Sobald die Einnistung in der Gebärmutter abgeschlossen ist, wird aus der Zygote ein Embryo.", "c": true, "fb": "Die Einnistung beginnt ungefähr eine Woche nach der Befruchtung; der Übergang zum Fötus folgt erst ab der 9. Schwangerschaftswoche."}, {"t": "Das fötale Stadium ist vor allem durch die beginnende Zellspezialisierung gekennzeichnet, während das Wachstum erst nach der Geburt in den Vordergrund tritt.", "c": false, "fb": "Die Zuordnung ist vertauscht: Im fötalen Stadium liegt der Fokus auf Wachstum und Ausreifung, die Spezialisierung kennzeichnet das embryonale Stadium."}], "concept": {"title": "Phasen der pränatalen Entwicklung (Tabelle 6.2)", "points": ["<b>Germinales Stadium</b> (Befruchtung bis 2. SSW): Entstehung der Zygote, Wanderung durch den Eileiter, Einnistung in der Gebärmutter, schnelle Zellteilung – Verdopplung der Zellzahl ca. zweimal pro Tag.", "<b>Embryonales Stadium</b> (3. bis 8. SSW): weitere Zellteilung, Spezialisierung der Stammzellen, Organbildung, erster Herzschlag messbar (120–160/min), erste spontane Bewegungen ab ca. der 7. SSW.", "<b>Fötales Stadium</b> (9. SSW bis Geburt): Wachstum und Ausreifung; Gewicht von unter 15 Gramm auf durchschnittlich 3,3 Kilogramm, Größe bei Geburt ca. 50 Zentimeter.", "<b>Zygote</b>: befruchtete Eizelle mit dem gesamten Genmaterial – 46 Chromosomen, je 23 von Mutter und Vater.", "<b>Hirnreifung</b>: Wachstum von Axonen und Dendriten beginnt vorgeburtlich, bis zu 250.000 Nervenzellen pro Minute; in den ersten beiden Lebensjahren Überproduktion und paralleler Abbau durch Zelltod und <b>synaptic pruning</b>.", "<b>Merkregel</b>: Zygote → Embryo (nach abgeschlossener Einnistung) → Fötus (ab der 9. SSW)."]}}, {"id": "k6-4b64131d08", "kap": 6, "sec": "6.4.2 Erikson", "stem": "Welche Aussagen zu Eriksons Stufenmodell der psychosozialen Entwicklung treffen zu?", "opts": [{"t": "Im frühen Erwachsenenalter steht die Krise „Intimität vs. Isolation“ im Vordergrund.", "c": true, "fb": "Beziehungen einzugehen und Bindungen aufzubauen ist dabei genauso wichtig wie Zeit für sich zu haben."}, {"t": "Die Adoleszenz ist von der Krise „Identität vs. Rollenkonfusion“ geprägt – der Entwicklung eines kohärenten Selbstbildes.", "c": true, "fb": "Gerade diese Phase hatte große Bedeutung für die sozialwissenschaftliche Forschung und diente als Grundlage vieler Untersuchungen im Jugendalter."}, {"t": "Mit erfolgreicher Bewältigung einer Krise verschwindet der zugehörige Konflikt vollständig.", "c": false, "fb": "Die Bewältigung ermöglicht den Aufstieg in die nächste Phase, allerdings verschwindet keiner dieser Konflikte vollständig."}, {"t": "Im mittleren Erwachsenenalter geht es um „Generativität vs. Stagnation“, unter anderem um Fürsorge für zukünftige Generationen.", "c": true, "fb": "Sinnfindung und Integration in die Gemeinschaft gehören zu dieser Herausforderung; im hohen Erwachsenenalter folgt „Ich-Integrität vs. Verzweiflung“."}], "concept": {"title": "Stufenmodell der psychosozialen Entwicklung nach Erikson (Tabelle 6.5)", "points": ["<b>0–1 Jahr</b> Urvertrauen vs. Misstrauen · <b>1–3 Jahre</b> Autonomie vs. Selbstzweifel · <b>3–6 Jahre</b> Initiative vs. Schuldgefühl.", "<b>6 Jahre bis Pubertät</b> Kompetenz vs. Minderwertigkeit · <b>Adoleszenz</b> Identität vs. Rollenkonfusion.", "<b>Frühes Erwachsenenalter</b> Intimität vs. Isolation · <b>Mittleres</b> Generativität vs. Stagnation · <b>Hohes</b> Ich-Integrität vs. Verzweiflung.", "<b>Mechanismus</b>: Jede Phase hat eine Thematik, die sich zu einer Krise steigert; erfolgreiche Bewältigung ist Voraussetzung für die Bewältigung der folgenden Krisen.", "<b>Wichtige Einschränkung</b>: Kein Konflikt verschwindet vollständig.", "<b>Bewertung</b>: In der ursprünglichen Form kaum empirisch überprüfbar, da teils zu ungenau formuliert; modifizierte Konzepte wurden zuletzt wieder aufgegriffen."]}}, {"id": "k6-a5e8691207", "kap": 6, "sec": "6.2.2 Frühe Kindheit", "stem": "Welche Aussage zum Experiment der visuellen Klippe ist korrekt?", "opts": [{"t": "Gibson und Walk (1960) untersuchten damit die Tiefenwahrnehmung von Kindern im Alter von sechs bis 14 Monaten.", "c": true, "fb": "Sie schlossen daraus, dass bereits in der frühen Kindheit ein grundlegendes Verständnis von Tiefenwahrnehmung vorhanden ist."}, {"t": "Der Versuchsaufbau geht auf Mary Ainsworth zurück, die damit erstmals frühe Wahrnehmungsleistungen systematisch erfasste.", "c": false, "fb": "Personenverwechslung: Ainsworth entwickelte die Fremde-Situation zur Erfassung der Bindungsqualität, nicht die visuelle Klippe."}, {"t": "Kinder, die bereits krabbeln konnten, überquerten den tief erscheinenden Teil, sobald die Mutter sie von der anderen Seite lockte.", "c": false, "fb": "Richtungsumkehr: Sie weigerten sich zu krabbeln – selbst wenn die eigene Mutter versuchte, sie hinüberzulocken."}, {"t": "Weil unter der Glasplatte tatsächlich ein Absturz drohte, war die Zurückhaltung der Kinder auch objektiv begründet.", "c": false, "fb": "Die Klippe war durch die Glasplatte abgesichert und in keiner Weise wirklich gefährlich – nur die optische Illusion eines Abgrundes bestand."}], "concept": {"title": "Die visuelle Klippe (Gibson & Walk, 1960)", "points": ["<b>Aufbau</b>: Glasplatte, auf einer Seite direkt auf rot-weiß kariertem Untergrund, auf der anderen Seite etwa einen halben Meter darüber – die optische Illusion einer Klippe.", "<b>Sicherheit</b>: Durch die Glasplatte war der Abgrund abgesichert; eine reale Gefahr bestand nicht.", "<b>Stichprobe</b>: Kinder im Alter von sechs bis 14 Monaten.", "<b>Befund</b>: Krabbelnde Kinder weigerten sich, über den tiefen Teil zu krabbeln – selbst wenn die Mutter sie lockte.", "<b>Schluss</b>: Bereits in der frühen Kindheit besteht ein grundlegendes Verständnis von Tiefenwahrnehmung.", "<b>Methodenkritik zur Säuglingsforschung</b>: Aussagen auf Basis präsprachlicher Verhaltensindikatoren – Blickdauer, Reaktionszeiten, Fokussierung des Blicks – sind in vielen Fällen Interpretationen und werden zum Teil divers gedeutet."]}}, {"id": "k6-ee7d74aceb", "kap": 6, "sec": "6.1 Grundlagen", "stem": "Welche Aussagen zum Gegenstand der Entwicklungspsychologie und zur Einteilung der Lebensspanne treffen zu?", "opts": [{"t": "Das Fach untersucht Veränderungsprozesse über die gesamte Lebensspanne – von der Empfängnis bis ins hohe Erwachsenenalter.", "c": true, "fb": "Forschungsthemen sind nicht auf das Kindes- und Jugendalter beschränkt, sondern gehen weit darüber hinaus."}, {"t": "Das mittlere Erwachsenenalter wird mit ungefähr 30 bis 55 Jahren angesetzt.", "c": false, "fb": "Angegeben sind ca. 40 bis 65 Jahre; 20 bis 40 Jahre umfasst das frühe Erwachsenenalter, ab 65 beginnt das hohe."}, {"t": "Im Zentrum stehen ausschließlich körperliche Reifungsprozesse; kognitive, sprachliche und soziale Veränderungen sind Gegenstand anderer Teildisziplinen.", "c": false, "fb": "Kognitive, sprachliche und soziale Veränderungen sind ausdrücklich wichtige Forschungsbereiche der Entwicklungspsychologie."}, {"t": "Dass Kindheit und Jugend besonders intensiv beforscht werden, liegt unter anderem daran, dass dort relativ zur verstrichenen Zeit mehr Veränderung stattfindet.", "c": true, "fb": "Die Schwerpunktsetzung ist also eine Frage der Veränderungsdichte, nicht der fachlichen Zuständigkeit."}], "concept": {"title": "Entwicklungsphasen über die Lebensspanne (Tabelle 6.1)", "points": ["<b>Pränatal</b> von der Empfängnis bis zur Geburt · <b>Säuglingsalter</b> Geburt bis Ende des ersten Lebensjahres.", "<b>Kleinkindalter / frühe Kindheit</b> ca. 1–3 Jahre · <b>Mittlere und späte Kindheit</b> ca. 3–11 Jahre.", "<b>Pubertät / Adoleszenz</b> ca. 11–20 Jahre · <b>Frühes Erwachsenenalter</b> ca. 20–40 Jahre.", "<b>Mittleres Erwachsenenalter</b> ca. 40–65 Jahre · <b>Hohes Erwachsenenalter</b> 65 Jahre und älter.", "<b>Gegenstand</b>: Veränderungsprozesse auf körperlicher, kognitiver, sprachlicher und sozialer Ebene über die gesamte Lebensspanne.", "<b>Leitfragen des Kapitels</b>: Anlage, Umwelt oder beides? Und verläuft Entwicklung in Stufen oder kontinuierlich?"]}}, {"id": "k6-3d896339db", "kap": 6, "sec": "6.4.1 Bindung", "stem": "Welche Aussagen zur Bindungsforschung und zum Fremde-Situation-Szenario treffen zu?", "opts": [{"t": "Bindung wird definiert als emotionale Verbindung, die mit nahestehenden Personen, besonders der Mutter oder anderen frühen Bezugspersonen, aufgebaut wird.", "c": true, "fb": "Diese Definition geht auf Cassidy und Shaver (1999) zurück."}, {"t": "John Bowlby führte ab den 1930er Jahren Studien an Kindern durch, die in Kinderheimen aufwuchsen.", "c": true, "fb": "Im Fokus standen die negativen Auswirkungen einer fehlenden Bezugsperson in der frühen Kindheit, etwa auf körperliche und emotionale Gesundheit."}, {"t": "Das Szenario wurde mit Kindern zwischen 12 und 24 Monaten durchgeführt und gilt bis heute als verbreitete, anerkannte Forschungsmethode.", "c": true, "fb": "Mary Ainsworth entwickelte es selbst; auf seiner Basis ließ sich Bindungsqualität erfassen und verschiedenen Bindungstypen zuordnen."}, {"t": "Zentrales Untersuchungselement war die Reaktion des Kindes, wenn die Mutter in den Raum zurückkam.", "c": true, "fb": "Die Trennung selbst löste bei allen Kindern Stress aus – aussagekräftig ist erst das Verhalten beim Wiedersehen."}], "concept": {"title": "Die Fremde-Situation (Ainsworth) und ihre Vorgeschichte", "points": ["<b>Bindung</b>: emotionale Verbindung zu nahestehenden Personen, besonders zu frühen Bezugspersonen (Cassidy & Shaver, 1999).", "<b>Bowlby (1907–1990)</b>: früher Bindungsforscher, ab den 1930er Jahren Studien an Heimkindern; beschrieb die Folgen einer fehlenden Bezugsperson (Bowlby, 1953).", "<b>Ainsworth (1913–1999)</b>: Entwicklungspsychologin, entwickelte in Zusammenarbeit mit Bowlby die Bindungstheorien und das Szenario der Fremde-Situation.", "<b>Ablauf</b>: Kind (12–24 Monate) mit der Mutter im Spielzimmer, fremde Person kommt hinzu, Mutter verlässt den Raum und kehrt nach wenigen Minuten zurück.", "<b>Auswertung</b>: Die Trennung stresst alle Kinder – bewertet wird die Reaktion auf die Rückkehr, daraus folgt die Zuordnung zu einem der vier Bindungstypen.", "<b>Bindungsperson</b>: muss nicht die Mutter sein – Vater, Großeltern oder Bezugsbetreuer:innen im Heim können diese Rolle ebenfalls erfolgreich übernehmen (Shirvanian & Michael, 2017)."]}}, {"id": "k6-1a14587fe5", "kap": 6, "sec": "6.3.4 Kognition im Erwachsenenalter", "stem": "Welche Aussagen zur kognitiven Entwicklung im Erwachsenenalter treffen zu?", "opts": [{"t": "Als postformales Denken bezeichnet man reflektiertes Denken, bei dem Problemstellungen identifiziert und benannt sowie mögliche Folgen von Entscheidungen antizipiert und abgewogen werden.", "c": true, "fb": "Es entwickelt sich im frühen bis mittleren Erwachsenenalter."}, {"t": "Blouin und McKelvie (2012) fanden einen Zusammenhang zwischen postformalem Denken und der Fähigkeit, sprachliche Metaphern und Ironie zu identifizieren und zu verstehen.", "c": true, "fb": "Die Autoren interpretierten dies so, dass Menschen mit höherem Maß an postformalem Denken die volle Bedeutung von Metaphern und Ironie zugänglich ist; auch ein Zusammenhang mit Kreativität zeigte sich."}, {"t": "Der Rückgang der kognitiven Fähigkeiten im Alter wird in der Regel unterschätzt und setzt früher ein als angenommen.", "c": false, "fb": "Richtungsumkehr: Er wird häufig überschätzt und als zu früh einsetzend angenommen."}, {"t": "Postformales Denken bildet sich nach heutigem Verständnis bereits mit dem formal-operatorischen Stadium in der Pubertät aus.", "c": false, "fb": "Es entwickelt sich erst im frühen bis mittleren Erwachsenenalter; das aufstrebende Erwachsenenalter entspricht der Pubertät und ist von der weiteren Reifung des präfrontalen Kortex geprägt."}], "concept": {"title": "Kognitive Veränderungen im Erwachsenenalter", "points": ["<b>Altersgliederung</b>: aufstrebendes (entspricht der Pubertät), frühes (20–40), mittleres (40–65) und hohes Erwachsenenalter (ab 65).", "<b>Präfrontaler Kortex</b>: reift im aufstrebenden Erwachsenenalter weiter heran; zuständig vor allem für Planung, Aufmerksamkeit und exekutive Funktionen, gern „Sitz der Persönlichkeit“ genannt.", "<b>Postformales Denken</b>: reflektiertes Denken im frühen bis mittleren Erwachsenenalter – Probleme benennen, Folgen antizipieren und abwägen. Zusammenhang mit Kreativität, Metaphern- und Ironieverständnis (Blouin & McKelvie, 2012).", "<b>Hohes Erwachsenenalter</b>: Veränderung der Intelligenzstruktur – die Leistungsniveaus verschiedener kognitiver Fähigkeiten korrelieren stärker miteinander als bei Jüngeren und nehmen generell ab (de Frias et al., 2007).", "<b>Neurokognitive Störungen</b>: Alzheimer-Demenz und Parkinson-Krankheit häufen sich; sie haben oft eine biologische Basis und können kognitive wie motorische Fähigkeiten stark einschränken.", "<b>Gestaltbarkeit</b>: Ernährung sowie körperliche und geistige Aktivität spielen eine große Rolle; gesunde Personen zeigen meist nur leichte bis gar keine Einbußen, gezieltes Training wirkt dem Abbau entgegen."]}}, {"id": "k6-c3ba20e141", "kap": 6, "sec": "6.2.1 Pränatale Entwicklung", "stem": "Welche Aussagen zu schädigenden Substanzen in der Schwangerschaft treffen zu?", "opts": [{"t": "Das Fetale Alkoholsyndrom (FAS) stellt die ausgeprägteste Form der Fetalen Alkoholspektrumsstörungen (FASD) dar.", "c": true, "fb": "FASD bezeichnet die Reihe an Schädigungen, die vorgeburtlich durch Alkoholkonsum entstehen können; FAS ist deren Extremform."}, {"t": "Zu den möglichen Folgen zählen unter anderem Wachstumsstörungen, Herzfehler und kognitive Beeinträchtigungen wie Konzentrationsstörungen und Lernschwächen.", "c": true, "fb": "Auch Gesichtsfehlbildungen und Bewegungsstörungen gehören dazu; die Schwere der einzelnen Schädigungen kann unterschiedlich ausfallen."}, {"t": "Bei Thalidomid (Contergan) zeigten sich unabhängig vom Zeitraum der Einnahme stets dieselben Fehlbildungen.", "c": false, "fb": "Je nachdem, in welchem Zeitraum der Schwangerschaft das Medikament eingenommen wurde, traten unterschiedliche Missbildungen auf – ein Lehrbeispiel für sensible Phasen."}, {"t": "Schätzungen gehen davon aus, dass weltweit etwa 9,8 % der Frauen während der Schwangerschaft Alkohol konsumieren.", "c": true, "fb": "Jährlich werden weltweit um die 119.000 Kinder mit FAS geboren (Popova et al., 2017)."}], "concept": {"title": "Alkohol, Medikamente und pränatale Diagnostik", "points": ["<b>FASD</b>: Reihe an Schädigungen, die vorgeburtlich durch Alkoholkonsum entstehen können. <b>FAS</b> ist die ausgeprägteste Form.", "<b>Mögliche Folgen</b>: Wachstumsstörungen, Gesichtsfehlbildungen, Herzfehler, Bewegungsstörungen, kognitive Beeinträchtigungen (Konzentrationsstörungen, Lernschwächen).", "<b>Zahlen</b>: etwa 9,8 % der Frauen konsumieren weltweit während der Schwangerschaft Alkohol; jährlich rund 119.000 Kinder mit FAS (Popova et al., 2017).", "<b>Thalidomid / Contergan</b>: in den 1950er Jahren beliebtes Beruhigungs- und Schlafmittel für Schwangere; Anfang der 1960er Jahre wurde der Zusammenhang mit Fehlbildungen bis zum völligen Fehlen von Organen oder Gliedmaßen erkannt. Art der Missbildung abhängig vom Einnahmezeitpunkt.", "<b>Weitere Risiken</b>: niedriger sozioökonomischer Status, Mangelernährung, chronischer Stress, psychische Belastungen, sexueller oder körperlicher Missbrauch.", "<b>Pränatale Diagnostik</b>: Bluttests und Ultraschall bei der Mutter, zusätzlich Nackenfaltenmessung, Organscreening, Fruchtwasserbiopsie – Ziel ist die frühzeitige Erkennung von Krankheiten und Fehlentwicklungen."]}}, {"id": "k6-adf92084c7", "kap": 6, "sec": "6.3.3 Kohlberg – Moral", "stem": "Welche Aussage zur Zuordnung von Niveaus und Stufen bei Kohlberg ist korrekt?", "opts": [{"t": "Zum konventionellen Niveau gehört die Stufe „sozialer Kontrakt und individuelle Rechte“.", "c": false, "fb": "Diese Stufe 5 gehört zum postkonventionellen Niveau. Konventionell sind Stufe 3 (wechselseitige Erwartungen) und Stufe 4 (soziales System und Gewissen)."}, {"t": "Auf dem präkonventionellen Niveau steht die Stufe der heteronomen Moral, bei der sich Verhalten an der Vermeidung negativer Konsequenzen orientiert.", "c": true, "fb": "Stufe 1 orientiert sich an Gehorsam und Bestrafung; die Furcht vor Strafe leitet das moralische Handeln."}, {"t": "Dem postkonventionellen Niveau ist die Stufe „autonome Reziprozität und Vertragstreue“ zugeordnet.", "c": false, "fb": "Eine Stufe dieses Namens gibt es bei Kohlberg nicht – postkonventionell sind „sozialer Kontrakt und individuelle Rechte“ sowie „universelle ethische Prinzipien“."}, {"t": "Auf der Stufe „soziales System und Gewissen“ bleibt eine strafende Instanz notwendig, damit Normen eingehalten werden.", "c": false, "fb": "Auf Stufe 4 ist eine strafende Instanz gerade nicht mehr notwendig: Das Handeln ist von internalisierten Werten geprägt."}], "concept": {"title": "Moralische Niveaus und Stufen nach Kohlberg (Tabelle 6.4)", "points": ["<b>Präkonventionell</b> – Normen werden noch nicht als gesellschaftliche Vereinbarungen erkannt. Stufe 1: heteronome Moral (Gehorsam, Strafvermeidung). Stufe 2: Individualismus und Austausch („Wie du mir, so ich dir“).", "<b>Konventionell</b> – die Perspektive eines Gesellschaftsmitglieds wird eingenommen. Stufe 3: wechselseitige Erwartungen und interpersonelle Konformität. Stufe 4: soziales System und Gewissen, strafende Instanz nicht mehr nötig.", "<b>Postkonventionell</b> – universelle ethische Prinzipien stehen über gesellschaftlichen Normen. Stufe 5: sozialer Kontrakt und individuelle Rechte. Stufe 6: universelle ethische Prinzipien.", "<b>Benennungslogik</b>: Die Niveaus sind danach benannt, inwieweit ein Individuum die Konventionen einer Gesellschaft anerkennt.", "<b>Heinz-Dilemma auf Stufe 5</b>: Das Medikament soll gestohlen werden, weil das Recht auf Leben höher wiegt als Gesetzestreue oder Eigentumsrecht.", "<b>Kohlbergs Einschränkung</b>: Stufe 6 hielt er für rein hypothetisch und von niemandem erreichbar; nur wenige Erwachsene gelangen bis Stufe 5, die meisten argumentieren auf Basis von Stufe 4."]}}, {"id": "k6-4a3c9de6b6", "kap": 6, "sec": "6.4.3 Identität (Marcia)", "stem": "Welche Aussagen zu James Marcias Modell des Identitätsstatus treffen zu?", "opts": [{"t": "Die vier Identitätskategorien sind – wie Eriksons Phasen – als aufeinanderfolgende Stufen zu verstehen.", "c": false, "fb": "Gerade das ist der Unterschied zu Erikson: Sie sind als Ergebnis der Bewältigung psychosozialer Aufgaben zu verstehen, nicht als Stufenfolge."}, {"t": "Bei der übernommenen Identität („Foreclosure“) wurde keine erkennbare Identitätskrise durchlaufen; Werte und Überzeugungen von Eltern und Rollenvorbildern werden unhinterfragt übernommen.", "c": true, "fb": "Dieser Status ist von autoritären Werten wie Gehorsam, Führung und Respekt vor hierarchisch höhergestellten Personen gekennzeichnet; das Selbstwertgefühl ist anfällig für negative Information."}, {"t": "Als fünften Status beschreibt Marcia die konsolidierte Identität („Identity Consolidation“), in der ein erarbeitetes Selbstbild im Erwachsenenalter stabilisiert wird.", "c": false, "fb": "Marcias Katalog ist mit vier Kategorien abgeschlossen; ein fünfter Status dieses Namens existiert nicht."}, {"t": "Die kritische Identität („Moratorium“) verbindet einen hohen Grad an Exploration mit einem niedrigen Grad an Verbindlichkeit.", "c": true, "fb": "Jugendliche in diesem Status erleben eine Identitätskrise und lassen sich alle Möglichkeiten offen, ohne sich festzulegen."}], "concept": {"title": "Identitätsstatus nach Marcia (1966)", "points": ["<b>Diffuse Identität („Identity Diffusion“)</b>: weder kohärentes Selbstkonzept noch Auseinandersetzung mit der eigenen Identitätsfindung.", "<b>Übernommene Identität („Foreclosure“)</b>: keine erkennbare Krise, unhinterfragte Übernahme von Werten der Eltern und Rollenvorbilder, autoritäre Werte, Selbstwert anfällig für negative Information.", "<b>Kritische Identität („Moratorium“)</b>: Identitätskrise wird erlebt, hohe Exploration bei niedriger Verbindlichkeit, alle Möglichkeiten bleiben offen.", "<b>Erarbeitete Identität („Identity Achievement“)</b>: Krise durchlaufen, neues Selbstbild erfolgreich erarbeitet, weniger autoritäre Werte, Selbstwert robuster gegenüber negativer Information.", "<b>Verhältnis zu Erikson</b>: Marcias Forschung gilt als Weiterentwicklung von Eriksons Theorie – die vier Status sind aber keine Stufenfolge, sondern Ergebnisse der Aufgabenbewältigung mit dem Ziel einer „Ich-Identität“.", "<b>Entwicklungsaufgabe</b>: Die Bildung eines kohärenten Selbstbildes ist eine der zentralen Aufgaben der Adoleszenz."]}}, {"id": "k6-85a7d33f4c", "kap": 6, "sec": "6.2.3 Adoleszenz (körperlich)", "stem": "Welche Aussagen zur Pubertät treffen zu?", "opts": [{"t": "Bei Mädchen sind vor allem Östrogen und Progesteron ausschlaggebend, bei Buben vermehrt gebildetes Testosteron.", "c": true, "fb": "Hormonelle Veränderungen liefern die Grundlage der körperlichen Veränderungen; die Geschlechtshormone führen zur Ausbildung der sekundären Geschlechtsmerkmale."}, {"t": "Bei Mädchen liegt der Beginn der Pubertät in der Regel zwischen dem 11. und 16. Lebensjahr.", "c": false, "fb": "Angegeben ist der Bereich vom 9. bis zum 14. Lebensjahr; der Bereich vom 10. bis 17. Lebensjahr gilt für Buben."}, {"t": "Die Menarche tritt im Durchschnitt mit ungefähr 12 Jahren auf, der Zeitpunkt schwankt jedoch stark.", "c": true, "fb": "Er hängt von der genetischen Grundlage sowie von körperlichen Faktoren wie dem Gewicht ab."}, {"t": "Als Spermarche bezeichnet man den Beginn der Spermienproduktion.", "c": true, "fb": "Bei Buben beginnt die Pubertät mit dem Wachstum der Hoden, der Schambehaarung und des Penis; die Spermarche fällt in diese Phase."}], "concept": {"title": "Sexuelle Reifung in der Adoleszenz", "points": ["<b>Adoleszenz</b>: Übergang von der Kindheit ins Erwachsenenalter, Phase der sexuellen Reifung; hormonelle Veränderungen liefern die Grundlage.", "<b>Leithormone</b>: Testosteron bei Buben, Östrogen und Progesteron bei Mädchen.", "<b>Zeitfenster</b>: Pubertätsbeginn bei Buben zwischen dem 10. und 17., bei Mädchen zwischen dem 9. und 14. Lebensjahr – individuell stark variabel.", "<b>Menarche</b>: erste Menstruation, im Durchschnitt mit ca. 12 Jahren; abhängig von genetischer Grundlage und körperlichen Faktoren wie dem Gewicht.", "<b>Spermarche</b>: Beginn der Spermienproduktion; bei Buben setzt die Pubertät mit Wachstum von Hoden, Schambehaarung und Penis ein.", "<b>Psychische Seite</b>: Starke körperliche Veränderungen und hormonelle Schwankungen können das Wohlbefinden beeinträchtigen und zu geringem Selbstwert und psychischem Stress führen (Duchesne et al., 2017)."]}}, {"id": "k6-288a97722a", "kap": 6, "sec": "6.2.2 Frühe Kindheit", "stem": "Welche Aussage zu Reflexen im Säuglingsalter und zum Kniesehnenreflex ist korrekt?", "opts": [{"t": "Der Kniesehnenreflex wird über das Großhirn vermittelt und lässt sich daher durch Übung beeinflussen.", "c": false, "fb": "Die Verschaltung läuft als „Abkürzung“ über das Rückenmark – müsste der Körper auf eine Antwort des Großhirns warten, wäre es für die schnellen motorischen Prozesse meist zu spät. Der Reflex ist nicht trainierbar."}, {"t": "Wie Such- und Saugreflex verschwindet der Kniesehnenreflex in den ersten Lebensmonaten wieder.", "c": false, "fb": "Der Kniesehnenreflex besteht ein Leben lang und bleibt im Wesentlichen gleich – er ist im Skript gerade das Gegenbeispiel zu den frühkindlichen Reflexen."}, {"t": "Beim Kniesehnenreflex erfolgt über das Rückenmark die reflexartige Kontraktion der kniestreckenden Muskulatur – eine Schutzreaktion.", "c": true, "fb": "Betroffen ist der Muskel Quadriceps Femoris; die Abkürzung über das Rückenmark verhindert Verletzungen des Gewebes bei schneller, starker Dehnung."}, {"t": "Der Suchreflex wird beim Neugeborenen anfangs durch Berührung der Fußsohle ausgelöst.", "c": false, "fb": "Ausgelöst wird er beispielsweise durch Berührung der Wangen; er hilft dem Kind, eine Nahrungsquelle zu finden."}], "concept": {"title": "Reflexe: frühkindlich vs. lebenslang (Infobox 6.1)", "points": ["<b>Reflex</b>: rasches, unwillkürliches Reaktionsmuster, das der Organismus auf einen Reiz zeigt.", "<b>Suchreflex</b>: anfangs etwa durch Berührung der Wangen ausgelöst, hilft beim Finden einer Nahrungsquelle (z. B. Brust).", "<b>Saugreflex</b>: ermöglicht die Nahrungsaufnahme an der gefundenen Quelle. Beide Reflexe dienen der Ernährung und verschwinden in den ersten Lebensmonaten.", "<b>Kniesehnenreflex (Patellarsehnenreflex)</b>: Schlag auf die Patellarsehne erhöht ruckartig die Dehnung, über das Rückenmark folgt die Kontraktion des Quadriceps Femoris.", "<b>Funktion</b>: Schutzreaktion – die Abkürzung über das Rückenmark spart die Zeit, die eine Antwort des Großhirns kosten würde.", "<b>Abgrenzung</b>: Der Kniesehnenreflex ist nicht trainierbar, bleibt im Wesentlichen gleich und besteht ein Leben lang."]}}, {"id": "k6-5c020cba78", "kap": 6, "sec": "6.3.1 Piaget – Kritik", "stem": "Welche Aussagen zur heutigen Bewertung von Piagets Theorie treffen zu?", "opts": [{"t": "Baillargeon (1987) zeigte, dass erste Formen des Verständnisses von Objektpermanenz bereits mit etwa 3,5 Monaten erkennbar sind.", "c": true, "fb": "Piaget hatte diese Errungenschaft erst mit ungefähr 8 Monaten angesetzt."}, {"t": "Aus heutiger Sicht hat Piaget das Erwerbsalter mancher Errungenschaften systematisch zu niedrig eingeschätzt.", "c": false, "fb": "Richtungsumkehr: Er schätzte es eher zu hoch ein und unterschätzte damit die Fähigkeiten der Kinder."}, {"t": "Nicht alle kognitiven Veränderungen lassen sich in klar abtrennbare Stadien unterteilen; manche verlaufen stadienübergreifend.", "c": true, "fb": "Diese Einschränkung betrifft den Kern der Stadienannahme, ohne den Wert der Theorie insgesamt aufzuheben."}, {"t": "Als Ursache der Fehleinschätzung gilt vor allem, dass Piagets Testaufgaben zu einfach waren, um die Fähigkeiten der Kinder auszureizen.", "c": false, "fb": "Umgekehrt: Manche Aufgabenstellungen waren aufgrund zu hoher Komplexität des Testmaterials bzw. der Testsituation nicht geeignet, die tatsächlichen Fähigkeiten abzubilden."}], "concept": {"title": "Piagets Theorien aus heutiger Sicht", "points": ["<b>Fortbestehender Einfluss</b>: bis heute wichtige Grundlage für das Verständnis kognitiver Veränderungen, mit theoretischen und praktischen Anwendungen (Barrouillet, 2015; DeVries, 2000).", "<b>Revision der Altersangaben</b>: Objektpermanenz bereits ab ca. 3,5 Monaten statt erst mit 8 Monaten (Baillargeon, 1987).", "<b>Unterschätzte Kinder</b>: Erwerbsalter tendenziell zu hoch eingeschätzt; Aufgaben teils zu komplex, sodass zusätzliche Voraussetzungen fehlten und sich das Zielverhalten nicht zeigen konnte.", "<b>Stadienannahme aufgeweicht</b>: nicht alle kognitiven Veränderungen sind klar abtrennbar, manche verlaufen stadienübergreifend.", "<b>Objektpermanenz neu gelesen</b>: Möglicherweise fehlt kleinen Kindern nicht das Wissen um das verdeckte Objekt, sondern die Handlungsfähigkeit, es selbst wieder sichtbar zu machen – die fehlende Reaktion ist dann kein Beleg für fehlendes Wissen.", "<b>Merkregel</b>: Kritik trifft die Altersgrenzen und die Trennschärfe der Stadien, nicht die Grundidee der aktiven Wissenskonstruktion."]}}, {"id": "k6-3ab93e5312", "kap": 6, "sec": "6.2.2 Frühe Kindheit", "stem": "Welche Aussagen zur Wahrnehmung von Neugeborenen und Säuglingen treffen zu?", "opts": [{"t": "Neugeborene bevorzugen die Stimme der eigenen Mutter, was sich unter anderem an einem beschleunigten Herzschlag zeigt.", "c": true, "fb": "Diese Präferenz besteht durch die Zeit im Mutterleib bereits von Geburt an (Kisilevsky et al., 2009)."}, {"t": "Säuglinge ziehen den Geruch der eigenen Mutter dem fremder Personen vor.", "c": true, "fb": "Cernoch und Porter (1985); zudem beruhigt der Geruch der eigenen Muttermilch in schmerzlichen Situationen schneller als der anderer Mütter (Nishitani et al., 2009)."}, {"t": "Im Vergleich zu Erwachsenen ist das Sehvermögen Neugeborener in Schärfe, Kontrast- und Farbempfindlichkeit eingeschränkt.", "c": true, "fb": "Menschen werden dennoch mit weitgehend funktionierendem Sehvermögen geboren und reagieren auf visuelle Muster mit Kopf- und Augenbewegungen."}, {"t": "Neugeborene zeigen Präferenzen etwa für gemusterte gegenüber ungemusterten Reizen und für menschliche Gesichter gegenüber gesichtsunähnlichen Reizen.", "c": true, "fb": "Ebenso bevorzugt werden Bewegung gegenüber statischen Mustern, Dreidimensionales gegenüber Zweidimensionalem und Neues gegenüber Bekanntem (S. P. Johnson, 2011)."}], "concept": {"title": "Sinne und Präferenzen im Säuglingsalter", "points": ["<b>Ausgangslage</b>: Alle Sinne sind nach der Geburt vorhanden, aber unterschiedlich gut ausgebildet.", "<b>Präferenz für die Mutter</b>: Stimme (beschleunigter Herzschlag; Kisilevsky et al., 2009), Gesicht (Bushnell, 2001), Geruch (Cernoch & Porter, 1985), beruhigende Wirkung der eigenen Muttermilch (Nishitani et al., 2009).", "<b>Sehvermögen</b>: weitgehend funktionsfähig, aber in Schärfe, Kontrast- und Farbempfindlichkeit eingeschränkt.", "<b>Visuelle Präferenzen</b>: gemustert vor ungemustert, Bewegung vor Statik, dreidimensional vor zweidimensional, neu vor bekannt, Gesichter vor gesichtsunähnlichen Reizen (S. P. Johnson, 2011).", "<b>Umwelt und Deprivation</b>: Das Kind gestaltet seine Lernerfahrungen aktiv mit; extreme Deprivation veränderte das Wachstum des Gehirns und zog unter anderem verringerte Intelligenz nach sich (Mackes et al., 2020).", "<b>Forschungsmethodik</b>: Fortschritte durch ausdifferenzierte experimentelle Bedingungen und präsprachliche Verhaltensindikatoren – Blickdauer, Reaktionszeiten, Blickfokussierung."]}}, {"id": "k6-b64f48dad5", "kap": 6, "sec": "6.3.1 Piaget – Stadien", "stem": "Welche Aussagen zu Animismus und Realismus treffen zu?", "opts": [{"t": "Als Animismus bezeichnet man es, wenn Kinder nicht lebenden Objekten menschliche Gefühle und Vorhaben zuschreiben.", "c": true, "fb": "Typische Aussage: „Mein Teddybär ist heute ganz traurig, weil er die Omi vermisst!“"}, {"t": "Der kindliche Realismus meint, dass Kinder nicht zwischen Vorstellungen und der Realität unterscheiden können, sodass mentale Vorgänge wie Denken oder Träumen für sie extern real sind.", "c": true, "fb": "Nach Piaget müssten Kinder daher bejahen, dass sie einen bloß vorgestellten Keks verschenken können."}, {"t": "Untersuchungen zeigten, dass der Realismus deutlich seltener auftritt als von Piaget ursprünglich postuliert.", "c": true, "fb": "Kinder können früh zwischen Realität und Vorstellung unterscheiden – ein Beispiel für die Revision einzelner Annahmen Piagets."}, {"t": "Beide Phänomene ordnet Piaget dem konkret-operatorischen Stadium zu, in dem sich das logische Denken ausbildet.", "c": false, "fb": "Sie gehören zum präoperatorischen Stadium (ca. 2–7 Jahre). Im konkret-operatorischen Stadium sind viele dieser Entwicklungsaufgaben bereits gelöst."}], "concept": {"title": "Das präoperatorische Stadium (ca. 2–7 Jahre)", "points": ["<b>Sprache</b>: rasante Weiterentwicklung – neue Wörter und Bezeichnungen für Objekte, erste simple mentale Operationen in der bloßen Vorstellung.", "<b>Animismus</b>: nicht lebende Objekte oder Phänomene werden als lebendig angesehen; Feuer oder Wolken werden Eigenschaften von Lebewesen wie atmen, fühlen oder sterben zugeschrieben – begründet etwa damit, dass sie sich „bewegen“.", "<b>Realismus</b>: Nicht Existierendes wird als real verstanden; Kinder unterscheiden nicht zwischen Vorstellung und Realität, mentale Vorgänge gelten als extern real.", "<b>Empirische Relativierung</b>: Der Realismus tritt deutlich seltener auf als postuliert, da Kinder früh zwischen Realität und Vorstellung trennen können.", "<b>Abgrenzung nach unten</b>: Im sensumotorischen Stadium steht die Objektpermanenz im Zentrum.", "<b>Abgrenzung nach oben</b>: Erst im konkret-operatorischen Stadium gelingen logische Schlüsse rein auf gedanklicher Basis, Reversibilität und Invarianz."]}}, {"id": "k6-3aabf7a13d", "kap": 6, "sec": "6.2.4 Erwachsenenalter (körperlich)", "stem": "Welche Aussage zur Andropause und zur Fruchtbarkeit im Alter ist korrekt?", "opts": [{"t": "Die Testosteronproduktion beginnt bei Männern etwa ab dem 50. bis 60. Lebensjahr abzunehmen.", "c": false, "fb": "Sie nimmt bereits ab etwa dem 30. bis 40. Lebensjahr kontinuierlich ab; Beginn und Tempo sind individuell sehr verschieden."}, {"t": "Wie Eizellen sind auch Spermien bereits bei der Geburt vollständig angelegt und werden im Laufe des Lebens verbraucht.", "c": false, "fb": "Spermien werden – anders als Eizellen – ein Leben lang produziert, weshalb Männer bis ins hohe Alter Kinder zeugen könnten."}, {"t": "Wechselbedingte Beschwerden fallen Männern in der Regel stärker auf als Frauen, weil die Andropause deutlicher einsetzt.", "c": false, "fb": "Umgekehrt: Sie fallen Frauen eher auf, weil die Menopause erkennbarer startet, kürzer dauert und einen Abschluss hat."}, {"t": "Die Andropause verläuft in der Regel ohne wahrnehmbaren Startpunkt und ohne fixiertes Ende, weshalb Beschwerden oft als Altersschwächen gedeutet werden.", "c": true, "fb": "Der Prozess ist deutlich langsamer als die Menopause; die Beschwerden werden dann nicht dem Wechsel im Hormonsystem zugeordnet."}], "concept": {"title": "Andropause: der männliche Wechsel", "points": ["<b>Beginn</b>: Testosteronproduktion nimmt ab etwa dem 30. bis 40. Lebensjahr kontinuierlich ab; Alter und Tempo individuell sehr verschieden.", "<b>Symptomatik</b>: Bei etwa 20 bis 30 % der Männer macht sich der Abfall körperlich und psychisch bemerkbar – erst dann spricht man von Andropause.", "<b>Spermien</b>: Qualität und Anzahl sinken langsam ab; die Prozesse können teilweise unabhängig vom Hormonabfall verlaufen.", "<b>Lebenslange Produktion</b>: Spermien werden – anders als Eizellen – ein Leben lang gebildet; Zeugungsfähigkeit bleibt möglich, die Befruchtungswahrscheinlichkeit sinkt jedoch.", "<b>Beschwerden beider Geschlechter</b>: Antriebsschwäche, Hitzewallungen, Schlafstörungen, depressive Verstimmungen, geringere sexuelle Lust, Erektionsstörungen (Penis wie Klitoris).", "<b>Wahrnehmungsunterschied</b>: Die Menopause hat erkennbaren Beginn, kürzere Dauer und einen Abschluss – die Andropause nicht, weshalb ihre Beschwerden oft als Altersschwächen gelten."]}}, {"id": "k6-43abfb7d1e", "kap": 6, "sec": "6.3.1 Piaget – Stadien", "stem": "Welche Aussagen zum konkret-operatorischen Stadium und zum Invarianzprinzip treffen zu?", "opts": [{"t": "Kinder vor diesem Stadium achten beim Umschütten vor allem auf die Breite des Glases und vernachlässigen die Höhe.", "c": false, "fb": "Richtungsumkehr: Sie scheinen die Breite zu vernachlässigen und nur auf die Höhe zu achten."}, {"t": "Reversibilität zeigt sich etwa daran, dass ein Mädchen, das auf die Frage nach einer Schwester mit „Ja, die Anne“ antwortet, auch bejaht, dass Anne eine Schwester hat.", "c": true, "fb": "Formal entspricht das dem Schluss: wenn X + X = Y, dann gilt Y − X = X."}, {"t": "Das Gesetz der Erhaltung – auch Invarianzprinzip – wird in diesem Stadium im Regelfall ohne Probleme nachvollzogen.", "c": true, "fb": "Das Verständnis der Reversibilität ist die Voraussetzung dafür; vorher bleibt die Umschüttaufgabe ungelöst."}, {"t": "Bevor Kinder dieses Stadium erreichen, lösen sie die Umschüttaufgabe zuverlässig, sobald die Flüssigkeit mehrmals zwischen den Gläsern hin- und hergeschüttet wird.", "c": false, "fb": "Der Fehler tritt selbst dann auf, wenn die Flüssigkeit abwechselnd hin- und hergeschüttet wird."}], "concept": {"title": "Konkret-operatorisches Stadium (ca. 7–11 Jahre)", "points": ["<b>Kern</b>: Das logische Denken steht im Vordergrund; die Phase erstreckt sich etwa über die Grundschulzeit.", "<b>Gedankliche Schlüsse</b>: Logische Schlussfolgerungen werden ausschließlich auf Basis gedanklicher Vorgänge abgeleitet – etwa den Heimweg in eine Karte einzeichnen oder Informationen aus einem Text kombinieren.", "<b>Reversibilität</b>: Umkehrbarkeit von Beziehungen und Operationen – „Anne ist meine Schwester“ ⇔ „Ich bin Annes Schwester“; formal: X + X = Y, also Y − X = X.", "<b>Gesetz der Erhaltung / Invarianzprinzip</b>: Die Menge bleibt gleich, auch wenn sich die Form des Behälters ändert.", "<b>Klassische Prüfaufgabe</b>: Flüssigkeit wird in ein höheres, schmaleres Glas umgefüllt. Vor dem Stadium achten Kinder nur auf die Höhe und vernachlässigen die Breite – auch bei mehrfachem Hin- und Herschütten.", "<b>Anschluss</b>: Im formal-operatorischen Stadium kommen abstraktes Denken, hypothetisches Schlussfolgern und deduktive Logik hinzu."]}}, {"id": "k7-b9fa725127", "kap": 7, "sec": "7.3.4 Gehorsam gegenüber Autoritäten", "stem": "Milgram (1974) berichtete 18 weitere Studien, in denen der ursprüngliche Versuch variiert wurde. Welche Aussagen zu den dabei gefundenen bedingenden Faktoren treffen zu?", "opts": [{"t": "Mit abnehmender Distanz zwischen Lehrer und Schüler sank der Gehorsam; selbst im gleichen Raum machten aber noch über 30 % der Lehrer bis zum Ende mit.", "c": true, "fb": "Zwischenstufen waren etwa verbales Feedback des Schülers aus dem Nebenraum, bevor beide in denselben Raum gesetzt wurden."}, {"t": "Gab der Versuchsleiter seine Anweisungen per Telefon statt im selben Raum, stieg die Bereitschaft zu sehr starken Stromstößen deutlich an.", "c": false, "fb": "Umgekehrt: Bei abwesendem Versuchsleiter waren weniger Lehrer bereit, sehr starke Stromstöße zu verabreichen."}, {"t": "In einem erkennbar heruntergekommenen Gebäude fiel der Gehorsam geringer aus als in den Räumen der Eliteuniversität Yale — annähernd 50 % gingen dort dennoch bis zur stärksten Stufe.", "c": true, "fb": "Die Räumlichkeit wirkt über die Seriosität, die der Untersuchung und damit der Autorität zugeschrieben wird."}, {"t": "Vor dem ersten Experiment sagten befragte Psychiater voraus, etwa ein Drittel der Versuchspersonen werde bis 450 Volt gehen; tatsächlich waren es 65 %.", "c": false, "fb": "Vorhergesagt wurde 1 %. Gerade die Kluft zu den tatsächlichen 65 % machte den Befund so folgenreich."}], "concept": {"title": "Bedingende Faktoren des Gehorsams (Milgram, 1974)", "points": ["<b>Distanz zum Opfer</b>: Je näher der Schüler, desto geringer der Gehorsam — bei gemeinsamem Raum aber immer noch über 30 % bis zur Höchststufe.", "<b>Anwesenheit der Autorität</b>: Anweisungen per Telefon senken die Bereitschaft zu sehr starken Stromstößen.", "<b>Räumlichkeit</b>: In ordentlichen Räumen der Universität Yale höherer Gehorsam als im heruntergekommenen Gebäude — dort dennoch annähernd 50 %.", "<b>Gradueller Anstieg</b>: Der Beginn bei 15 Volt erzeugt kaum Hemmungen; danach ist der richtige Ausstiegszeitpunkt schwer zu finden.", "<b>Zeitdruck und Verantwortungsverlagerung</b>: Die Situation schreitet schnell voran, man erlebt sich als „ausführendes Werkzeug“ und schreibt die Verantwortung der Expertin oder dem Experten zu (Blass, 1999).", "<b>Vorhersage vs. Befund</b>: erwartet 1 %, tatsächlich 65 %. Die Ergebnisse lieferten eine mögliche Erklärung dafür, wie nach außen unauffällige Bürger:innen am Holocaust beteiligt sein konnten."]}}, {"id": "k7-00752d5fe5", "kap": 7, "sec": "7.5.2 Empathie-Altruismus-Hypothese", "stem": "Wie lässt sich altruistisch motiviertes von nicht altruistisch motiviertem prosozialen Verhalten unterscheiden?", "opts": [{"t": "Altruistisch motivierte Personen berichten nach einem gelungenen Hilfeversuch eine deutlich stärkere Stimmungsverbesserung als nicht altruistisch motivierte.", "c": false, "fb": "Eine Stimmungsverbesserung kann bei empathisch motivierter Hilfe zwar eintreten, gilt aber als Nebeneffekt und taugt nicht als Unterscheidungskriterium."}, {"t": "Man fragt, ob ein fehlgeschlagener Hilfeversuch die Stimmung verschlechtern würde — bei empathisch motivierter Hilfe ist das sehr wahrscheinlich der Fall.", "c": true, "fb": "Im Vordergrund steht die tatsächliche Notlinderung der anderen Person; bleibt sie aus, verschlechtert sich die Stimmung der helfenden Person."}, {"t": "Bleibt die Notlinderung aus, verschlechtert sich die Stimmung nur dann, wenn der Hilfeversuch objektiv vermeidbar gewesen wäre.", "c": false, "fb": "Die Verschlechterung tritt auch dann ein, wenn das Scheitern objektiv gesehen unvermeidbar war."}, {"t": "Bei nicht empathisch motivierter Hilfe fällt die Stimmungsverschlechterung nach einem Fehlschlag besonders stark aus, weil der erhoffte soziale Gewinn ausbleibt.", "c": false, "fb": "Dort tritt gerade keine Verschlechterung ein — allein der Versuch reicht aus, um das Gewissen zu beruhigen (vgl. Batson & Weeks, 1996)."}], "concept": {"title": "Altruistisch oder nicht? Das Kriterium des fehlgeschlagenen Hilfeversuchs", "points": ["<b>Altruismus</b>: prosoziales Verhalten ohne egoistische Motivation, frei von Hintergedanken über eigene Vorteile und durch Empathie motiviert (Batson & Weeks, 1996).", "<b>Prosoziales Verhalten allgemein</b> kann der helfenden Person durchaus nutzen — etwa durch soziale Anerkennung oder um später Gunst zu gewinnen.", "<b>Prüffrage</b>: Würde ein fehlgeschlagener Hilfeversuch die Stimmung verschlechtern?", "<b>Empathisch motiviert</b>: ja, weil die angestrebte Notlinderung ausbleibt — und zwar auch dann, wenn das Scheitern unvermeidbar war.", "<b>Nicht empathisch motiviert</b>: nein, weil bereits der Versuch das Gewissen beruhigt.", "<b>Nebeneffekt</b>: Auch empathisch motivierte Hilfe kann die eigene Stimmung verbessern; das macht sie nicht weniger altruistisch (Werth & Mayer, 2020)."]}}, {"id": "k7-bca7c2450f", "kap": 7, "sec": "7.3.6 Soziale Rollen und Normen", "stem": "Welche Aussagen zur Deindividuation und zu den Bedingungen, unter denen sie entsteht, treffen zu?", "opts": [{"t": "Deindividuation beschreibt die Vernachlässigung der eigenen Identität bei gleichzeitig verstärkter Anpassung an Gruppennormen und deren Befolgung.", "c": true, "fb": "Der Begriff verbindet damit zwei Seiten: den Rückzug des Individuellen und die Zunahme des Normkonformen."}, {"t": "Mit steigender Mitgliederzahl wächst die Anonymität der oder des Einzelnen, und das eigene Verhalten wird weniger stark reflektiert (Diener, Lusk, DeFour & Flax, 1980).", "c": true, "fb": "Die Gruppengröße ist damit eine direkte Bedingung der Deindividuation."}, {"t": "Uniformen dienen ausschließlich der Deindividuation und wirken der Identifikation mit der Gruppe entgegen.", "c": false, "fb": "Uniformen fördern zwar die Anonymität, tragen aber ebenso zur positiven Identifikation mit der Gruppe und deren Zielen bei."}, {"t": "Das Tragen von Masken oder Uniformen kann den Prozess zusätzlich verstärken (Rehm, Steinleitner & Lilli, 1987).", "c": true, "fb": "Solche Mittel fördern Anonymität und Identifikation mit der Gruppe gleichermaßen."}], "concept": {"title": "Deindividuation (Infobox 7.5)", "points": ["<b>Definition</b>: psychologisches Phänomen, bei dem es zur Vernachlässigung der eigenen Identität und zu verstärkter Anpassung an Gruppennormen sowie deren Befolgung kommt.", "<b>Bedingung Gruppengröße</b>: Mit der Mitgliederzahl steigt die Anonymität, und das eigene Verhalten wird weniger reflektiert (Diener et al., 1980).", "<b>Verstärker</b>: Masken und Uniformen erhöhen Anonymität und Identifikation mit der Gruppe (Rehm, Steinleitner & Lilli, 1987).", "<b>Zweck im Heer</b>: Angleichung über Uniformen und kurze Haare unterdrückt die Persönlichkeit, damit jedes Mitglied die Gruppenziele übernimmt — Uniformen stiften zugleich positive Identifikation.", "<b>Anwendungsfall</b>: Im Stanford Gefängnisexperiment verschwammen individuelle Identität und persönliche Werte hinter den zugeschriebenen Rollen Wärter und Häftling."]}}, {"id": "k7-b771d8c3ee", "kap": 7, "sec": "7.2.1 Schemata", "stem": "Welche Aussagen zum Schemabegriff und zum Nutzen der Kategorisierung treffen zu?", "opts": [{"t": "Ein Schema umfasst das erworbene Wissen über ein Thema in Form von Attributen, nicht jedoch die Beziehungen zwischen einzelnen Konzepten.", "c": false, "fb": "Gerade die Beziehungen gehören dazu — im Konzertbeispiel etwa die Verknüpfung von „aufregend“ mit „(Vor-)Freude“."}, {"t": "Schemata lassen sich als vereinfachte Gedächtnisrepräsentationen und Auffassungen über Menschen, Gegenstände und Ereignisse beschreiben.", "c": true, "fb": "Sie gliedern Wissen und Erleben und beeinflussen dadurch Wahrnehmung, Interpretation, Erinnerung und Verhalten."}, {"t": "Der Vorteil der Kategorisierung liegt darin, dass sich die aus der Kategorie erschlossenen Merkmale einer Person zuverlässig als richtig erweisen.", "c": false, "fb": "Solche Schlussfolgerungen können oft richtig sein, es kann aber ebenso zu falschen Schlussfolgerungen kommen."}, {"t": "Durch die Zuordnung eines Zielobjekts zu einer Kategorie lassen sich mehr Informationen erschließen, als auf den ersten Blick verfügbar sind.", "c": true, "fb": "Im Beispiel des Kapitels erschließt die Kategorie „Groupie“ Merkmale, die die Person selbst nicht sichtbar macht."}], "concept": {"title": "Der Schemabegriff und die Leistung von Kategorien", "points": ["<b>Schema</b>: übergeordnete Wissensstruktur, die Wissen und Erleben gliedert und dadurch Wahrnehmung, Interpretation, Erinnerung und Verhalten beeinflusst (Jonas, Stroebe & Hewstone, 2014).", "<b>Inhalt eines Schemas</b>: erworbenes Wissen in Form von Attributen <i>und</i> die Beziehungen zwischen verschiedenen Konzepten.", "<b>Kurzformel</b>: vereinfachte Gedächtnisrepräsentationen und Auffassungen über Menschen, Gegenstände, Ereignisse.", "<b>Nutzen der Kategorisierung</b>: Aus dem Kategorienwissen lassen sich mehr Informationen erschließen, als auf den ersten Blick verfügbar sind.", "<b>Kehrseite</b>: Schlussfolgerungen über typische Merkmale sind oft, aber nicht immer richtig — es kann zu falschen Schlussfolgerungen kommen.", "<b>Gedankenexperiment</b>: Der Begriff „Konzert“ ruft Attribute wie „aufregend“ und „unterhaltsam“ ab, die untereinander verknüpft sind."]}}, {"id": "k7-2a89f1e086", "kap": 7, "sec": "7.4 Intergruppenprozesse", "stem": "Ferienlagerexperiment und Minimalgruppenparadigma zeichnen ein zum Teil destruktives Bild von Gruppenzugehörigkeit. Welche Gegenargumente führt das Kapitel an?", "opts": [{"t": "Gruppenzugehörigkeiten sind sinn- und identitätsstiftend und helfen dabei, sich in der Welt zurechtzufinden.", "c": true, "fb": "Zugehörigkeit nach Berufsgruppe, Hobby, nationaler, religiöser oder politischer Ausrichtung ist deshalb von hoher Wichtigkeit für das Individuum."}, {"t": "Sie bieten Geborgenheit und befriedigen das Bedürfnis nach sozialer Eingebundenheit und Kontakt.", "c": true, "fb": "Damit erfüllen Gruppen ein Grundbedürfnis, das auch unabhängig von der Überlebenssicherung besteht."}, {"t": "Sie sind zentral für die Selbstdefinition und den Selbstwert.", "c": true, "fb": "Deshalb wirkt sich der Vergleich der eigenen Gruppe mit anderen unmittelbar auf die Selbsteinschätzung aus."}, {"t": "Weil Menschen zum Überleben immer auf Gruppen angewiesen waren, ist es sinnvoll, dass Gruppen im Zweifels- oder Bedarfsfall von ihren Mitgliedern verteidigt werden.", "c": true, "fb": "Die Verteidigungsbereitschaft ist damit funktional und nicht bloß eine Fehlleistung."}], "concept": {"title": "Funktionen von Gruppenzugehörigkeit", "points": ["<b>Identitätsstiftung</b>: Gruppenzugehörigkeiten sind sinn- und identitätsstiftend und helfen bei der Orientierung in der Welt.", "<b>Bedürfnisbefriedigung</b>: Sie bieten Geborgenheit und befriedigen das Bedürfnis nach sozialer Eingebundenheit und Kontakt.", "<b>Selbstwert</b>: Sie sind zentral für Selbstdefinition und Selbstwert — Grundlage der Theorie der Sozialen Identität.", "<b>Evolutionäre Funktion</b>: Menschen waren zum Überleben immer auf Gruppen angewiesen; die Verteidigung der eigenen Gruppe ist daher funktional.", "<b>Konstruktives Beispiel</b>: In der Covid-Pandemie hing die Identifikation mit der eigenen Nation mit der Unterstützung von Schutzmaßnahmen und dem eigenen Gesundheitsverhalten zusammen (van Bavel et al., 2020).", "<b>Fazit</b>: Die Folgen von Gruppenzugehörigkeit sind mannigfaltig und können konstruktiv wie destruktiv ausfallen."]}}, {"id": "k7-32d54e87ff", "kap": 7, "sec": "7.3.1 Soziale Erleichterung vs. soziale Hemmung", "stem": "Die Distraction-Conflict-Theory beschreibt die Leistungssteigerung durch Anwesende als Folge mehrerer aufeinanderfolgender kausaler Schritte. Welche Aussage dazu trifft zu?", "opts": [{"t": "Der Aufmerksamkeitskonflikt entsteht dadurch, dass Anwesende eine besonders gut vorhersehbare Reizquelle darstellen.", "c": false, "fb": "Anwesende gelten gerade als unberechenbar; sie bieten Informationen und Hinweisreize und ermöglichen Vergleiche."}, {"t": "Bereits die Bewältigung der Aufgabe allein bindet kaum Aufmerksamkeit, weshalb Anwesende sie nahezu vollständig auf sich ziehen.", "c": false, "fb": "Die Theorie setzt gerade voraus, dass schon die Aufgabe selbst ein gewisses Maß an Aufmerksamkeit fordert — erst daraus entsteht der Konflikt."}, {"t": "Ein Aufmerksamkeitskonflikt setzt voraus, dass die handelnde Person die Tendenz oder den Bedarf hat, sich zwei einander ausschließenden Reizen zu widmen.", "c": true, "fb": "Aufgabe einerseits, Beobachter:innen andererseits — erst dieser Konflikt zieht Ressourcen von der Aufgabe ab."}, {"t": "Der Abzug von Aufmerksamkeitsressourcen wirkt sich vor allem bei komplexen Aufgaben günstig aus.", "c": false, "fb": "Die Verengung auf zentrale Aspekte hilft bei leichten Aufgaben; bei schwierigen führt sie zur sozialen Hemmung."}], "concept": {"title": "Die drei kausalen Schritte der Distraction-Conflict-Theory (Baron, 1986)", "points": ["<b>Ausgangspunkt</b>: Bereits die Aufgabe selbst fordert ein gewisses Maß an Aufmerksamkeit.", "<b>Schritt 1</b>: Anwesende Menschen stellen eine Ablenkung dar — sie sind unberechenbar, bieten Informationen oder Hinweisreize und ermöglichen Vergleiche.", "<b>Schritt 2</b>: Die Ablenkung führt zu Aufmerksamkeitskonflikten, sofern die handelnde Person die Tendenz oder den Bedarf hat, sich zwei einander ausschließenden Reizen zu widmen.", "<b>Schritt 3</b>: Aufmerksamkeitsressourcen werden von der Aufgabe abgezogen; nur die zentralen Aspekte werden beachtet, periphere vernachlässigt.", "<b>Doppelte Folge</b>: Bei leichten Aufgaben hilfreich (soziale Erleichterung), bei schwierigen hinderlich, weil dort mehrere Aspekte einzubeziehen wären (soziale Hemmung).", "<b>Verhältnis zu Zajonc (1965)</b>: Die Theorie ergänzt bzw. erweitert die Erklärung über physiologische Erregung, ersetzt sie aber nicht."]}}, {"id": "k7-fa1405a569", "kap": 7, "sec": "7.3.3 Einfluss von Minderheiten", "stem": "Welche Aussagen zur Anagrammstudie von Nemeth und Kwan (1987) treffen zu?", "opts": [{"t": "Die Versuchspersonen bearbeiteten die Aufgaben in Gruppen zu vier Personen und notierten jeweils das erste dreibuchstabige Wort, das sie identifizierten.", "c": true, "fb": "Bei der Buchstabenfolge „TDOGT“ wäre etwa „DOG“ die naheliegendste Lösung."}, {"t": "In der Minderheitsbedingung übernahmen die Versuchspersonen die abweichende Strategie unverändert und bildeten die Wörter fortan rückwärts.", "c": false, "fb": "Das geschah in der Mehrheitsbedingung. In der Minderheitsbedingung wurde die Strategie nicht blind übernommen, sondern das eigene Vorgehen erweitert."}, {"t": "Die Rückmeldung lautete in der Mehrheitsbedingung, 1 von 4 Personen habe „GOD“ notiert.", "c": false, "fb": "1 von 4 war die Minderheitsbedingung; in der Mehrheitsbedingung waren es 3 von 4."}, {"t": "Die abweichende Lösung bestand aus denselben Buchstaben in umgekehrter Reihenfolge — bei „TDOGT“ also „GOD“ statt „DOG“.", "c": true, "fb": "Dieselben Buchstaben, andere Leserichtung: Genau daran ließ sich prüfen, ob die Strategie übernommen oder erweitert wird."}], "concept": {"title": "Divergentes Denken durch Minderheiten (Nemeth & Kwan, 1987)", "points": ["<b>Aufbau</b>: Gruppen zu vier Personen bearbeiteten Anagrammaufgaben und notierten jeweils das erste gefundene Wort mit drei Buchstaben.", "<b>Manipulation</b>: Rückmeldung, dass 3 von 4 Personen (Mehrheitsbedingung) oder 1 von 4 Personen (Minderheitsbedingung) das rückwärts gebildete Wort notiert hatten.", "<b>Mehrheitsbedingung</b>: Die Versuchspersonen folgten in den weiteren Durchläufen ebenfalls der Rückwärts-Strategie.", "<b>Minderheitsbedingung</b>: Die abweichende Strategie wurde nicht blind übernommen; stattdessen wurde das eigene Vorgehen erweitert (vorwärts, rückwärts, gemischt).", "<b>Schluss</b>: Minderheiten fördern divergentes Denken — es werden mehrere Lösungsansätze in Betracht gezogen. Mehrheiten erzeugen dagegen konformes Verhalten."]}}, {"id": "k7-4661f61735", "kap": 7, "sec": "7.2.3 Zwei-Prozess-Modelle: ELM", "stem": "Das Kapitel lädt dazu ein, drei Alltagssituationen einer der beiden ELM-Routen zuzuordnen. Welche Zuordnungen und Begründungen treffen zu?", "opts": [{"t": "Wer sich einen Vormittag Zeit nimmt, um sich im Elektrofachmarkt umfassend zum Smartphonekauf beraten zu lassen, verarbeitet auf der zentralen Route.", "c": true, "fb": "Persönliche Relevanz ist hoch, Vorwissen vorhanden, Zeitdruck besteht nicht — die Voraussetzungen der zentralen Route."}, {"t": "Wer nach einem anstrengenden Arbeitstag vor allem vom Lächeln und der Art zu sprechen der werbenden Person beeindruckt ist, verarbeitet zentral, weil bewusst entschieden wird.", "c": false, "fb": "Hier wirken oberflächliche Eigenschaften statt der Argumente — das kennzeichnet die periphere Route."}, {"t": "Wer sich bei der Bankberatung vom Grundsatz „Auf Expert:innen kann man sich verlassen“ leiten lässt, folgt der peripheren Route.", "c": true, "fb": "Ohne eigenes Vorwissen wird auf vorhandene Schemata über Expert:innenwissen zurückgegriffen — eine klassische Urteilsheuristik."}, {"t": "Starke Argumente führen auf der zentralen Route zu vorwiegend positiven Gedanken und damit zu einer Einstellungsänderung.", "c": true, "fb": "Schwache Argumente erzeugen dort vorwiegend negative Gedanken und bewirken keine Veränderung."}], "concept": {"title": "Die beiden Routen des ELM im Anwendungsfall", "points": ["<b>Zentrale Route</b>: hohe Motivation und Kapazität, systematische Verarbeitung. Starke Argumente → positive Gedanken → Einstellungsänderung; schwache Argumente → negative Gedanken → keine Änderung.", "<b>Periphere Route</b>: geringe Motivation oder Kapazität, heuristische Verarbeitung. Positiver heuristischer Hinweisreiz (z. B. hohe Glaubwürdigkeit) → Änderung; negativer Hinweisreiz (z. B. geringe Glaubwürdigkeit) → keine Änderung.", "<b>Beispiel 1 — Android oder iOS</b>: zentrale Route (Relevanz hoch, Vorwissen vorhanden, kein Zeitdruck).", "<b>Beispiel 2 — Umweltschutzverein</b>: periphere Route (Beeinflussung nicht durch den Inhalt der Argumente, sondern durch oberflächliche Eigenschaften).", "<b>Beispiel 3 — Bankberatung</b>: periphere Route (kein Vorwissen, Entscheidung auf Basis vorhandener Schemata über Expert:innenwissen).", "<b>Merkregel</b>: Nicht der Inhalt der Botschaft entscheidet über die Route, sondern Motivation, Kapazität und Zeit auf Seiten der empfangenden Person."]}}, {"id": "k7-b42ca05b55", "kap": 7, "sec": "7.3.6 Soziale Rollen und Normen", "stem": "Womit wurden Wärter und Häftlinge im simulierten Gefängnis der Universität Stanford ausgestattet, und wie war der Versuch organisiert?", "opts": [{"t": "Die Wärter erhielten detaillierte Vorgaben, mit welchen Maßnahmen sie die Ordnung unter den Gefangenen aufrechtzuerhalten hatten.", "c": false, "fb": "Sie erhielten die Instruktion, eigenständig Regeln auszuarbeiten und alle nötigen Schritte selbst zu ergreifen."}, {"t": "Die Häftlinge behielten ihre Namen und erhielten lediglich zusätzlich eine Nummer für die Verwaltung.", "c": false, "fb": "Sie wurden für die Dauer des Experiments anstatt ihres Namens mit Nummern angesprochen — ein zentraler Baustein der Deindividuation."}, {"t": "Der simulierte Gefängnistrakt wurde eigens außerhalb des Universitätsgeländes angemietet.", "c": false, "fb": "Das Experiment fand im Untergeschoss eines Gebäudes der Universität Stanford statt, das dafür umgebaut wurde."}, {"t": "Zur Ausstattung der Wärter gehörten khakifarbene Uniform, Pfeife, Schlagstock sowie verspiegelte Sonnenbrillen.", "c": true, "fb": "Die Häftlinge trugen demgegenüber ein langes Hemd und eine Kappe aus Nylonstrümpfen."}], "concept": {"title": "Rollen, Ausstattung und Eskalation im Stanford Gefängnisexperiment", "points": ["<b>Ort und Dauer</b>: umgebautes Untergeschoss eines Gebäudes der Universität Stanford, geplant für 14 Tage, abgebrochen nach sechs.", "<b>Häftlinge</b>: Ansprache über Nummern statt Namen, langes Hemd, Kappe aus Nylonstrümpfen.", "<b>Wärter</b>: khakifarbene Uniform, Pfeife, Schlagstock, verspiegelte Sonnenbrillen — dazu die Instruktion, eigenständig Regeln zu erarbeiten.", "<b>Eskalation</b>: nächtliches Durchzählen, Aufstand am zweiten Tag, danach Entzug von Betten und Kleidung, Abspritzen mit dem Feuerlöscher, verwehrter Toilettengang.", "<b>Deutung</b>: Individuelle Identität und persönliche Werte verschwanden hinter den zugeschriebenen Rollen — Deindividuation in einer Situation mit besonderem Machtgefälle.", "<b>Einschränkung</b>: indirekte Instruktion der Wärter zu Grausamkeiten; etwa ein Drittel handelte sadistisch, zwei Drittel human (Griggs & Whitehead, 2014)."]}}, {"id": "k7-03b5e8a215", "kap": 7, "sec": "7.5.2 Empathie-Altruismus-Hypothese", "stem": "Wie ist Empathie definiert, und wovon hängt es ab, wie viel Empathie eine helfende Person empfindet?", "opts": [{"t": "Empathie meint, die eigenen Emotionen einer anderen Person so verständlich zu machen, dass diese die Situation nachvollziehen kann.", "c": false, "fb": "Die Richtung ist umgekehrt: Empathie meint, sich selbst an die Stelle der anderen Person zu versetzen und deren Erleben nachzuempfinden."}, {"t": "Empathieförderlich wirkt es, wenn erkennbar ist, dass die hilfsbedürftige Person unverschuldet in ihre Lage geraten ist.", "c": true, "fb": "Ebenso förderlich sind das Kennen der Person und eine wahrgenommene Ähnlichkeit zu ihr."}, {"t": "Auf Seiten der helfenden Person gelten eine Veranlagung zu empathischem Verhalten sowie das weibliche Geschlecht als förderliche Merkmale.", "c": true, "fb": "Studien zeigen mehr Empathie bei Frauen; das kann biologisch wie durch Sozialisation begründet sein (Werth & Mayer, 2020)."}, {"t": "Wie viel Empathie empfunden wird, hängt ausschließlich von stabilen Persönlichkeitsmerkmalen der helfenden Person ab.", "c": false, "fb": "Es hängt sowohl von Persönlichkeitsmerkmalen als auch von Merkmalen der Situation ab."}], "concept": {"title": "Empathie (Infobox 7.9) und ihre Bedingungen", "points": ["<b>Definition</b>: Fähigkeit, sich selbst an die Stelle einer anderen Person beziehungsweise eines fühlenden Wesens zu versetzen und deren Ereignisse und Emotionen aus ihrer Perspektive zu erleben und nachzuempfinden (vgl. Aronson, Wilson & Akert, 2014).", "<b>Zwei Quellen</b>: Empathie hängt von Persönlichkeitsmerkmalen der helfenden Person <i>und</i> von Merkmalen der Situation ab.", "<b>Situationsmerkmale</b>: Kennen der hilfsbedürftigen Person, Ähnlichkeit zu ihr, erkennbar unverschuldete Notlage.", "<b>Personenmerkmale</b>: Veranlagung zu empathischem Verhalten sowie das weibliche Geschlecht — biologisch oder durch Sozialisation begründbar.", "<b>Funktion</b>: Empathie ist die motivationale Grundlage altruistisch basierten prosozialen Verhaltens (Batson & Weeks, 1996)."]}}, {"id": "k7-fa5d7f783b", "kap": 7, "sec": "7.4.1 Ferienlagerexperiment der Sherifs", "stem": "Welche Aussagen zur Gruppenkohäsion und zur Konfliktphase des Ferienlagerexperiments treffen zu?", "opts": [{"t": "Der Grad an Gruppenkohäsion bemisst sich vor allem an der Mitgliederzahl: Je größer die Gruppe, desto geschlossener tritt sie auf.", "c": false, "fb": "Kohäsion wird durch die gegenseitigen Beziehungen zwischen den Mitgliedern und den Wunsch bestimmt, Teil der Gruppe zu sein und zu bleiben — nicht durch die Größe."}, {"t": "Gruppen mit hoher Kohäsion können Ziele leichter festlegen und auch erreichen (D. W. Johnson & Johnson, 2013).", "c": true, "fb": "Kohäsion ist damit nicht nur ein Beschreibungs-, sondern auch ein Leistungsmerkmal von Gruppen."}, {"t": "Das Gewinnerteam erhielt attraktive Preise wie einen Pokal, individuelle Medaillen und Campingmesser, während das Verliererteam leer ausging.", "c": true, "fb": "Die asymmetrische Belohnung war das Mittel, mit dem die Konkurrenzsituation überhaupt erst hergestellt wurde."}, {"t": "Mit zunehmendem Intergruppenkonflikt stieg die Solidarität gegenüber der jeweils eigenen Gruppe; freundliches Verhalten gegenüber der anderen Gruppe wurde gerügt.", "c": true, "fb": "Der Konflikt nach außen und der Zusammenhalt nach innen verstärkten sich also wechselseitig."}], "concept": {"title": "Gruppenkohäsion (Infobox 7.7) und die Konfliktphase", "points": ["<b>Gruppenkohäsion</b>: Ausmaß, in dem eine Gruppe als geschlossene Einheit auftritt. Bestimmt durch die gegenseitigen Beziehungen der Mitglieder und den Wunsch, Teil der Gruppe zu sein und zu bleiben.", "<b>Wirkung</b>: Gruppen mit hoher Kohäsion können Ziele leichter festlegen und erreichen (D. W. Johnson & Johnson, 2013).", "<b>Herstellung der Konkurrenz</b>: Wettbewerbe wie Baseball und Tauziehen; Preise (Pokal, Medaillen, Campingmesser) nur für das Gewinnerteam.", "<b>Manipulation</b>: Der Punktestand wurde etwa über manipulierbare Schnitzeljagden ausgeglichen gehalten, damit ein für beide Gruppen frustrierendes Kopf-an-Kopf-Rennen entstand.", "<b>Folgen</b>: feindselige Rhetorik, Erniedrigung der anderen Gruppe, negative Vorurteile, Meiden und Ignoranz, Überfälle auf die Lager, physische Gewalt.", "<b>Nach innen</b>: steigende Solidarität in der eigenen Gruppe; freundliches oder nicht aggressives Verhalten gegenüber der anderen Gruppe wurde unterbunden und gerügt."]}}, {"id": "k7-3eea269c44", "kap": 7, "sec": "7.3.5 Bewusste soziale Einflussnahme", "stem": "Welche der folgenden Beeinflussungstechniken zählt das Kapitel ausdrücklich zu den „Judo-Strategien“ (Werth & Mayer, 2020)?", "opts": [{"t": "Das Prinzip sozialer Bewährtheit — in mehrdeutigen Situationen verlässt man sich darauf, wie sich andere verhalten.", "c": true, "fb": "„Was alle tun, muss gut sein“: Friedman und Fireworker (1977) zeigten dies an der Bewertung von Wein."}, {"t": "Das Kontrastprinzip — Objekte werden in Abhängigkeit von einem gewählten Vergleichsstandard bewertet.", "c": true, "fb": "Ein mittelmäßiges Produkt wirkt attraktiv, wenn es nur neben schlechteren präsentiert wird."}, {"t": "Das Prinzip der Verfügbarkeitsverankerung — je leichter ein Beispiel erinnerbar ist, desto stärker prägt es die Entscheidung.", "c": false, "fb": "Eine solche Strategie führt das Kapitel nicht auf. Genannt werden soziale Bewährtheit, Knappheit, Kontrastprinzip, Reziprozitätsnorm und Commitment."}, {"t": "Die Norm der kognitiven Balance — man strebt danach, Einstellungen und Beziehungen widerspruchsfrei zu halten.", "c": false, "fb": "Ebenfalls nicht Teil der Aufzählung. Verwechselbar ist sie mit der Reziprozitätsnorm, die auf die Gegenseitigkeit von Geben und Nehmen abzielt."}], "concept": {"title": "Die Judo-Strategien der bewussten Einflussnahme (Werth & Mayer, 2020)", "points": ["<b>Begriff</b>: Strategien, mit denen man jemanden „zu Fall bringt“, indem die menschliche Informationsverarbeitung in eine bestimmte Richtung gelenkt wird.", "<b>Prinzip sozialer Bewährtheit</b> — „Was alle tun, muss gut sein“: Orientierung an anderen in mehrdeutigen Situationen (Friedman & Fireworker, 1977: als „fantastisch“ beschriebener Wein wurde besser und teurer eingeschätzt).", "<b>Prinzip der Knappheit</b> — „Was rar ist, muss viel wert sein“: extremere Beurteilung und Reaktanz.", "<b>Kontrastprinzip</b> — „Im Vergleich zu …“: Bewertung anhand eines gewählten Vergleichsstandards.", "<b>Reziprozitätsnorm</b> — „Wie du mir, so ich dir“: Verpflichtungsgefühl zur Erwiderung von Gefälligkeiten.", "<b>Commitment</b> — „Wer A sagt, muss auch B sagen“: Verpflichtung aus dem Streben nach Konsistenz. Hinzu kommt der Expert:innen- bzw. Autoritätsstatus als eigener Hebel."]}}, {"id": "k7-a4587f269d", "kap": 7, "sec": "7.3.2 Einfluss von Mehrheiten", "stem": "Welche Aussage zum Experiment von Chartrand und Bargh (1999) trifft zu?", "opts": [{"t": "Die Versuchspersonen hatten die Aufgabe, mit einer anderen Person vorgegebene Bilder aus Zeitungen zu diskutieren und einzuschätzen.", "c": true, "fb": "Dass es sich beim Gegenüber um ein Mitglied der Forschungsgruppe handelte, war ihnen nicht bekannt."}, {"t": "Jede Versuchsperson durchlief nur eine der beiden Bedingungen, damit die Manipulation nicht auffiel.", "c": false, "fb": "Alle Versuchspersonen durchliefen beide Bedingungen — Streichen über das Gesicht und Wippen mit dem Fuß."}, {"t": "Die eingeweihte Person hatte die Aufgabe, das Verhalten der Versuchsperson möglichst genau zu spiegeln.", "c": false, "fb": "Es verhielt sich umgekehrt: Die eingeweihte Person zeigte ein festgelegtes Verhalten, das die Versuchspersonen dann signifikant häufiger selbst zeigten."}, {"t": "Der Effekt trat nur bei bewusst wahrgenommenen Gesten auf, nicht bei beiläufigen Bewegungen.", "c": false, "fb": "Der Chamäleon-Effekt betrifft gerade das unbewusste Nachahmen nonverbaler Verhaltensweisen wie Gesten und Gesichtsausdrücke."}], "concept": {"title": "Der Chamäleon-Effekt (Chartrand & Bargh, 1999)", "points": ["<b>Aufgabe</b>: Die Versuchspersonen sollten mit einer anderen Person vorgegebene Bilder aus Zeitungen diskutieren und einschätzen.", "<b>Verdeckte Manipulation</b>: Das Gegenüber war ein Mitglied der Forschungsgruppe und strich sich entweder regelmäßig über das Gesicht (Bedingung 1) oder wippte mit dem Fuß (Bedingung 2).", "<b>Design</b>: Alle Versuchspersonen durchliefen beide Bedingungen.", "<b>Befund</b>: Die Versuchspersonen zeigten das jeweilige Verhalten signifikant häufiger, als wenn sie allein im Raum waren.", "<b>Chamäleon-Effekt</b>: unbewusstes Nachahmen nonverbaler Verhaltensweisen anderer Personen, etwa Gesten und Gesichtsausdrücke — sozialer Einfluss ohne jede bewusste Absicht."]}}, {"id": "k7-1105009898", "kap": 7, "sec": "7.3.6 Soziale Rollen und Normen", "stem": "Welche Aussagen über soziale Normen in Gruppen treffen zu?", "opts": [{"t": "Soziale Normen sind allgemein geteilte Erwartungen und Regeln darüber, wie sich Gruppenmitglieder zu verhalten haben und welche Einstellungen erwünscht oder toleriert werden.", "c": true, "fb": "Sie werden häufig als „ungeschriebene Gesetze“ wahrgenommen, die eine reibungslose Interaktion sichern."}, {"t": "Normen ersparen wiederkehrende Entscheidungen über angemessenes Verhalten; die dadurch geschonten Ressourcen können der Verwirklichung der Gruppenziele dienen.", "c": true, "fb": "Das Beispiel des Kapitels ist die Kleiderordnung: Ist der Dresscode transparent, entfällt das Abwägen."}, {"t": "Wird eine Norm verletzt, kann die Gruppe mit Sanktionen reagieren — etwa mit Ausgrenzung oder der Drohung, die Gruppe verlassen zu müssen.", "c": true, "fb": "Normen werden nicht immer freiwillig eingehalten und können durchaus als Einschränkung erlebt werden."}, {"t": "Je stärker sich die Mitglieder mit der Gruppe identifizieren, desto stärker wirken Gruppennormen auf ihr Verhalten (Ashforth & Mael, 1989).", "c": true, "fb": "Mit der Identifikation steigt zugleich die Wahrscheinlichkeit, dass dieselben Ziele verfolgt werden."}], "concept": {"title": "Soziale Normen in Gruppen", "points": ["<b>Definition</b>: allgemein geteilte Erwartungen und Regeln darüber, wie sich Gruppenmitglieder zu verhalten haben und welche Einstellungen erwünscht oder toleriert sind.", "<b>Funktion</b>: „ungeschriebene Gesetze“ für reibungslose Interaktion; sie erlauben den Rückgriff auf Verhaltensmuster und schonen so Ressourcen für die Gruppenziele.", "<b>Sanktionen</b>: Bei einem „aus der Reihe tanzen“ drohen sozialer Druck, Ausgrenzung oder die Drohung, die Gruppe verlassen zu müssen.", "<b>Identifikation</b>: Je stärker die Identifikation mit der Gruppe, desto eher werden dieselben Ziele verfolgt und desto stärker wirken die Normen (Ashforth & Mael, 1989).", "<b>Gruppengröße</b>: Mit steigender Mitgliederzahl wächst die Anonymität und das eigene Verhalten wird weniger reflektiert — es kommt zur Deindividuation (Diener et al., 1980).", "<b>Inhaltsabhängigkeit</b>: Normen wirken in die Richtung, die sie inhaltlich vorgeben — eine Gewaltnorm begünstigt aggressives, eine wertschätzende Norm lösungsorientiertes Verhalten."]}}, {"id": "k7-a4f4e6c1ca", "kap": 7, "sec": "7.2 Soziale Kognition", "stem": "Auf einer Party bemerken Sie, dass eine Freundin seit über einer Stunde nicht zu sehen ist, deuten das als alarmierend, weil Sie von ihren privaten Problemen wissen, und machen sich auf die Suche. Welche Aussagen zu diesem Beispiel und zum Begriff der sozialen Kognition treffen zu?", "opts": [{"t": "Das Bemerken der Abwesenheit entspricht bereits der Stufe der Kategorisierung, weil der Situation dabei Bedeutung zugeschrieben wird.", "c": false, "fb": "Das Bemerken selbst ist Stufe 1 (Wahrnehmung); erst die Deutung als alarmierend gehört zu Stufe 2."}, {"t": "Als soziale Objekte gelten nach der Definition ausschließlich andere Menschen, nicht die eigene Person.", "c": false, "fb": "Soziale Objekte umfassen ausdrücklich die eigene Person ebenso wie andere Menschen."}, {"t": "Die Entscheidung, sich auf die Suche zu machen, entspricht der Stufe der Urteilsgenerierung.", "c": true, "fb": "Neu enkodierte Informationen und bestehendes Vorwissen ermöglichen hier Schlussfolgerungen und Entscheidungen über angebrachtes Verhalten."}, {"t": "Dass Sie um das Trinkverhalten Ihrer Freundin in belastenden Phasen wissen, wirkt als Einfluss der Wissensorganisation auf die Kategorisierung.", "c": true, "fb": "Das organisierte Vorwissen ist Grundlage der Informationsverarbeitung auf allen Stufen, nicht nur auf der letzten."}], "concept": {"title": "Soziale Kognition — Definition und Beispielverlauf", "points": ["<b>Definition</b> (vgl. Dorsch Lexikon der Psychologie, 2022): Art und Weise, wie Menschen Informationen über soziale Objekte aufnehmen und verarbeiten, und welche Gedanken, Gefühle und Handlungen aus einem sozialen Kontext resultieren.", "<b>Soziale Objekte</b>: die eigene Person ebenso wie andere Menschen. <b>Soziale Akteure</b>: Einzelpersonen, aber auch Gruppen oder Gesellschaften.", "<b>Stufe 1 im Beispiel</b>: Ihnen fällt auf, dass die Freundin seit über einer Stunde nicht zu sehen ist (Wahrnehmung).", "<b>Stufe 2 im Beispiel</b>: Sie deuten das als ungewöhnlich und alarmierend (Kategorisierung) — beeinflusst durch Ihr Wissen um ihre private Belastung (Wissensorganisation).", "<b>Stufe 3 im Beispiel</b>: Sie entscheiden sich, nach ihr zu suchen (Urteilsgenerierung).", "<b>Merkregel</b>: Wahrnehmen — Deuten — Entscheiden; das Vorwissen wirkt auf alle drei Schritte."]}}, {"id": "k7-96c019ad5e", "kap": 7, "sec": "7.4.3 Stereotype, Vorurteile und Diskriminierung", "stem": "Welche Aussagen zu Erwartungshaltungen im Bildungskontext und zur Erklärung des Stereotype Threat treffen zu?", "opts": [{"t": "Erwartungshaltungen von Lehrpersonen wirken sich besonders auf die Leistung schwacher Schüler:innen aus (Madon, Jussim & Eccles, 1997).", "c": true, "fb": "Gerade dort, wo die Leistung ohnehin fragil ist, schlagen Erwartungen am stärksten durch."}, {"t": "Ein Erklärungsansatz lautet, dass die Bedrohung durch das Stereotyp Angst und negatives Denken auslöst, wodurch die mögliche Leistung nicht erbracht werden kann.", "c": true, "fb": "Die Bedrohung richtet sich dabei auf das Selbst, nicht bloß auf das Ergebnis."}, {"t": "Dieses angstbesetzte, negative Denken muss den Betroffenen nicht explizit bewusst sein.", "c": true, "fb": "Gerade deshalb lässt sich der Effekt nicht einfach durch Willensanstrengung überwinden."}, {"t": "Bei Spencer, Steele und Quinn (1999) unterschieden sich die beiden Gruppen bereits vor dem Test in ihrer tatsächlichen mathematischen Leistung, was den Effekt miterklärt.", "c": false, "fb": "Die Teilnehmer:innen beider Gruppen waren hinsichtlich ihrer tatsächlichen Leistung ausbalanciert — der Unterschied entstand erst durch die Instruktion."}], "concept": {"title": "Erwartungshaltungen und die Wirkweise des Stereotype Threat", "points": ["<b>Erwartungseffekte</b>: Studien im Bildungskontext zeigen, dass Erwartungshaltungen von Lehrpersonen besonders die Leistung schwacher Schüler:innen beeinflussen (Madon, Jussim & Eccles, 1997).", "<b>Stereotype Threat</b>: Der Hinweis auf ein leistungsbezogenes Gruppenstereotyp erzeugt ein hohes Bedrohungslevel und die Angst, das Stereotyp zu erfüllen — also eine Bedrohung auf das Selbst.", "<b>Erklärungsansatz</b>: Angst und negatives Denken mindern die abrufbare Leistung; dieses Denken muss nicht explizit bewusst sein.", "<b>Kontrolle des Vorwissens</b>: Bei Spencer, Steele und Quinn (1999) waren die Gruppen hinsichtlich der tatsächlichen Leistung ausbalanciert; nur die Instruktion unterschied sich.", "<b>Auflösbarkeit</b>: Weil die Effekte kognitiver Natur sind, lassen sie sich kognitiv auflösen — Aufklärung über Stereotype Threat verringerte oder beseitigte ihn (Johns, Schmader & Martens, 2005)."]}}, {"id": "k7-a1e872e449", "kap": 7, "sec": "7.5 Prosoziales Verhalten", "stem": "Welche Aussage zu den Definitionen von prosozialem Verhalten und Altruismus trifft zu?", "opts": [{"t": "Prosoziales Verhalten liegt nur dann vor, wenn die helfende Person keinerlei Nutzen aus ihrem Handeln zieht.", "c": false, "fb": "Das kennzeichnet den Altruismus. Prosoziales Verhalten kann der helfenden Person durchaus nutzen, etwa durch soziale Anerkennung."}, {"t": "Prosoziales Verhalten meint jegliches Verhalten, durch das das Wohlergehen anderer erhöht werden soll, wobei es absichtlich und freiwillig gezeigt wird.", "c": true, "fb": "Absichtlichkeit und Freiwilligkeit sind die beiden definitorischen Bedingungen (vgl. Eisenberg & Fabes, 1998)."}, {"t": "Altruismus setzt voraus, dass die helfende Person mit der hilfsbedürftigen verwandt oder eng bekannt ist.", "c": false, "fb": "Altruismus ist über Selbstlosigkeit in Denken, Fühlen und Handeln definiert (Bergius & Six, 2021), nicht über die Beziehung zur anderen Person."}, {"t": "Eine unmittelbare Gegenleistung darf erwartet werden, solange sie nicht ausdrücklich vereinbart wurde.", "c": false, "fb": "Prosoziales Verhalten wird gerade ohne die Erwartung einer unmittelbaren Belohnung gezeigt."}], "concept": {"title": "Prosoziales Verhalten und Altruismus — die Begriffe", "points": ["<b>Prosoziales Verhalten</b>: jegliches Verhalten, durch das das Wohlergehen anderer erhöht werden soll, absichtlich und freiwillig gezeigt (vgl. Eisenberg & Fabes, 1998) — ohne Erwartung einer unmittelbaren Belohnung.", "<b>Altruismus</b>: uneigennützige Rücksichtnahme auf andere, gekennzeichnet durch Selbstlosigkeit in Denken, Fühlen und Handlungen (Bergius & Six, 2021).", "<b>Verhältnis</b>: Altruismus ist die engere Kategorie — prosoziales Verhalten darf der helfenden Person nutzen, altruistisches ist frei von Hintergedanken über eigene Vorteile.", "<b>Beispiele aus dem Kapitel</b>: den fallengelassenen Stift aufheben, einer älteren Dame über die Straße helfen, ehrenamtliche Rettungseinsätze.", "<b>Drei Erklärungstheorien</b>: evolutionspsychologischer Ansatz, Empathie-Altruismus-Hypothese, Soziale-Austausch-Theorie."]}}, {"id": "k7-172e32e9fb", "kap": 7, "sec": "7.3.5 Bewusste soziale Einflussnahme", "stem": "Welche Aussagen zum Commitment und zum Experiment von Freedman und Fraser (1966) treffen zu?", "opts": [{"t": "Commitment wird besonders verhaltenswirksam, wenn es aktiv und öffentlich geäußert, mit Anstrengung verbunden und freiwillig eingegangen wird.", "c": true, "fb": "Eine bloß innerlich gefasste Meinung lässt sich dagegen leicht wieder ändern; erst die Äußerung bindet."}, {"t": "Der ersten Gruppe wurde zunächst die kleine Bitte gestellt, woraufhin später 22 % auch der großen Bitte zustimmten.", "c": false, "fb": "Die 22 % beziehen sich auf jene Gruppe, der die große Bitte ohne Vorbereitung gestellt wurde; nach vorheriger kleiner Bitte waren es 53 %."}, {"t": "Damit das Foot-in-the-door-Prinzip wirkt, müssen beide Bitten zwingend von derselben Person stammen.", "c": false, "fb": "Eine nachfolgende Studie zeigte, dass es auch bei zwei verschiedenen Personen funktioniert, sofern die Bitten auf dasselbe Thema abzielen."}, {"t": "Die große Bitte bestand darin, sechs Mitarbeiter:innen für zwei Stunden eine Bestandsaufnahme der vorhandenen Seifenprodukte im Haus durchführen zu lassen.", "c": true, "fb": "Dafür hätten diese in alle Schränke und Schubladen sehen müssen — die Bitte war also bewusst weitreichend."}], "concept": {"title": "Commitment und das Foot-in-the-door-Prinzip", "points": ["<b>Commitment</b>: Engagement beziehungsweise Verpflichtung zu einer Sache; Grundlage ist das menschliche Streben nach Konsistenz in Aussagen und Handlungen.", "<b>Wirkbedingungen</b>: aktiv und öffentlich geäußert, mit Anstrengung verbunden, freiwillig eingegangen. Eine bloß gedankliche Meinung lässt sich leicht ändern, eine geäußerte bindet.", "<b>Foot-in-the-door</b>: Auf eine kleine, leicht zu gewährende Bitte folgt eine größere im selben Kontext, der eher zugestimmt wird, um konsistent zu bleiben.", "<b>Freedman & Fraser (1966)</b>: Große Bitte direkt gestellt — 22 % Zustimmung. Nach vorheriger kleiner Bitte (Telefonbefragung) — 53 %.", "<b>Ergänzender Befund</b>: Die beiden Bitten müssen nicht von derselben Person kommen, solange sie dasselbe Thema betreffen. Einmal erzeugtes Commitment wirkt langfristig und personenunabhängig, weil das Selbstbild angesprochen und verändert wird.", "<b>Abgrenzung</b>: Door-in-the-face beruht auf Reziprozität, Foot-in-the-door auf selbstbildkonsistentem Commitment."]}}, {"id": "k7-abdf2c24ab", "kap": 7, "sec": "7.2.3 Kontrolliertes vs. automatisches Denken", "stem": "Welche Aussagen zur Unterscheidung von automatischem und kontrolliertem Denken treffen zu?", "opts": [{"t": "Automatisches Denken ist als unbewusster, unbeabsichtigter und ressourcenschonender Prozess definiert, der andere parallel stattfindende kognitive Prozesse nicht stört.", "c": true, "fb": "Gerade diese Störungsfreiheit macht es zum Regelfall der alltäglichen Informationsverarbeitung."}, {"t": "Kontrolliertes Denken unterliegt der willentlichen Kontrolle und ist mit höherem kognitivem Aufwand verbunden.", "c": true, "fb": "Es ist bewusst und beabsichtigt — kurz gesagt: mühsamer."}, {"t": "In der Geschichte über den Autounfall führt das kontrollierte Denken dazu, dass ein rein männliches Chirurgieteam angenommen und ein Widerspruch wahrgenommen wir
