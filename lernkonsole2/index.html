s arbeitet in beide Richtungen und initiiert, moduliert oder hemmt auch Bewegungen."}, {"t": "Es arbeitet unbewusst und entzieht sich in der Regel der willkürlichen Kontrolle.", "c": false, "fb": "Das beschreibt das autonome Nervensystem, das innere Organe und Drüsen steuert."}, {"t": "Es gehört gemeinsam mit dem Rückenmark zum zentralen Nervensystem.", "c": false, "fb": "Es ist eine Untergliederung des peripheren Nervensystems."}], "concept": {"title": "Peripheres Nervensystem", "points": ["<b>Somatisches Nervensystem</b>: überträgt sensorische Informationen von Rezeptoren in Haut, Muskeln und Gelenken über das Rückenmark an das Gehirn – und leitet umgekehrt Signale zurück, um Bewegungen zu <b>initiieren, modulieren oder hemmen</b>.", "<b>Autonomes (vegetatives) Nervensystem</b>: Steuerung innerer Organe, Stimulation von Drüsen; läuft in der Regel <b>unbewusst und ohne willkürliche Kontrolle</b> ab.", "<b>Sympathikus</b>: Aktivierung – Adrenalinausschüttung, Blut zu den Muskeln, Puls und Sauerstoffverbrauch steigen, Verdauung wird heruntergeregelt.", "<b>Parasympathikus</b>: Beruhigung – langsamerer Herzschlag, ruhigere Atmung, Verdauung stellt sich wieder ein. „Normalbetrieb“."]}}, {"id": "k4-8dd9d556ed", "kap": 4, "sec": "4.2.1 Bausteine des Nervensystems", "stem": "Welche Aussagen zum Neuron als Zelle sind korrekt?", "opts": [{"t": "Als Sonderform der tierischen Zelle enthält das Neuron alle Organellen, die in tierischen Zellen vorhanden sind, etwa Mitochondrien und einen Zellkern.", "c": true, "fb": "Das Besondere am Neuron liegt nicht in exotischen Bestandteilen, sondern in seiner Spezialisierung auf Signalverarbeitung."}, {"t": "Neuronen weisen untereinander eine sehr ähnliche Struktur auf; die Zahl der Fortsätze und die Axonlänge variieren nur geringfügig.", "c": false, "fb": "Tatsächlich gibt es eine sehr große Vielfalt: von einem einzigen bis zu sehr vielen Fortsätzen, lange oder kurze Axone, keine oder viele Verzweigungen."}, {"t": "Die äußere Gestalt eines Neurons ist unabhängig von seinem Aufgabengebiet festgelegt.", "c": false, "fb": "Sie kann sich je nach Aufgabengebiet unterschiedlich zeigen."}, {"t": "Das Soma enthält neben dem Zellkern zumeist eine große Zahl von Organellen wie Mitochondrien, Golgi-Apparate und Ribosomen.", "c": true, "fb": "Das Soma wird auch Zellkörper oder Perikaryon genannt; im Zellkern (Nucleus) liegt die DNA."}], "concept": {"title": "Der Bauplan des Neurons", "points": ["<b>Zellmembran</b>: Lipid-Doppelschicht mit eingebetteten Proteinmolekülen (Basis für Ionenkanäle, Pumpen, Rezeptoren).", "<b>Soma</b> (Zellkörper, Perikaryon): enthält den <b>Zellkern</b> (Nucleus, DNA) und viele Organellen – Mitochondrien, Golgi-Apparate, Ribosomen.", "<b>Dendriten</b>: zahlreiche, meist kurze Fortsätze am Soma; <b>Empfang</b> von Informationen.", "<b>Axon</b>: meist genau eines, tritt am <b>Axonhügel</b> aus; Transport <b>weg</b> vom Zellkörper zu den Endknöpfchen (<b>Axonterminale</b>). Länge von unter 1 mm bis über 1 m; kann sich verzweigen.", "Trotz der Standarddarstellung: sehr große <b>Vielfalt</b> an Formen, abhängig vom Aufgabengebiet."]}}, {"id": "k5-034fb83a3c", "kap": 5, "sec": "5.3.3 Klassische Konditionierung", "stem": "Welche Aussagen zu den Grundbegriffen der klassischen Konditionierung treffen zu?", "opts": [{"t": "Das Futter stellt einen unkonditionierten Reiz dar, der darauf folgende Speichelfluss eine unkonditionierte Reaktion.", "c": true, "fb": "UCS und UCR bezeichnen genau diese Verknüpfung, die beim Hund reflexhaft schon vor jeder Konditionierung vorliegt."}, {"t": "Von unkonditioniertem Reiz und unkonditionierter Reaktion spricht man, weil diese Verknüpfung bereits vor der Konditionierung besteht.", "c": true, "fb": "Darin liegt die Begründung der Vorsilbe: Die Verbindung ist nicht gelernt, sondern etwa durch einen Reflex vorgegeben."}, {"t": "Nach mehrmaliger gemeinsamer Darbietung mit dem Futter wird die Glocke vom neutralen zum konditionierten Reiz.", "c": true, "fb": "Die Paarung macht das Läuten zum Signal; die konditionierte Reaktion folgt danach auch ohne Darbietung des Futters."}, {"t": "Die klassische Konditionierung wird auch als Signallernen bezeichnet.", "c": true, "fb": "Der ursprünglich neutrale Reiz kündigt den zweiten Reiz an und wird damit zum Signal — daher die zweite Bezeichnung."}], "concept": {"title": "Klassische Konditionierung (Pawlow)", "points": ["<b>Ausgangsbeobachtung</b>: Pawlow (1849–1936) untersuchte Verdauungsdrüsen an Hunden; der Speichelfluss trat schon vor dem Fleischpulver auf — erst beim Anblick, später bei den Schritten des Versuchsleiters.", "<b>UCS / UCR</b>: unkonditionierter Reiz (Futter) und unkonditionierte Reaktion (Speichelfluss); diese Verknüpfung besteht bereits vorher, z. B. reflexbedingt.", "<b>Neutraler Reiz</b>: löst zunächst keine Reaktion aus, etwa das Läuten einer Glocke.", "<b>CS / CR</b>: nach mehrmaliger gleichzeitiger Darbietung wird die Glocke zum konditionierten Reiz, der Speichelfluss zur konditionierten Reaktion — auch ohne Futter.", "<b>Prinzip</b>: Durch gemeinsames Auftreten zweier Reize entsteht eine Assoziation; der neutrale Reiz wird zum <i>Signal</i> — daher auch <b>Signallernen</b>.", "Randnotiz zur Person: Pawlow erhielt 1904 den Nobelpreis für Medizin — für die Verdauungsforschung, nicht für die Konditionierung."]}}, {"id": "k5-0bb952c8ea", "kap": 5, "sec": "5.2.2 Theorien der Wahrnehmung", "stem": "Welche Aussage zu den psychophysischen Schwellen und ihren Untersuchungsmethoden trifft zu?", "opts": [{"t": "Bei der Grenzmethode werden unterschiedlich starke Reize in zufälliger Reihenfolge dargeboten.", "c": false, "fb": "Das beschreibt die Konstanzmethode. Bei der Grenzmethode wird der Reiz gerade nicht zufällig, sondern in ab- oder zunehmender Intensität dargeboten."}, {"t": "Die Unterschiedsschwelle ist von der Intensität des Ausgangsreizes unabhängig.", "c": false, "fb": "Sie hängt sehr wohl vom Ausgangsreiz ab: Je stärker dieser ist, desto größer muss der absolute Unterschied zum zweiten Reiz ausfallen."}, {"t": "Als Absolutschwelle gilt jene Intensität, bei der ein Reiz in der Hälfte der Fälle erkannt wird.", "c": true, "fb": "Die empirische Schwellenkurve verläuft S-förmig; festgelegt wird die Schwelle am Punkt mit 50 % Erkennungsrate."}, {"t": "Reize oberhalb der ermittelten Absolutschwelle werden ausnahmslos wahrgenommen.", "c": false, "fb": "Oberhalb der Schwelle steigt lediglich die Wahrscheinlichkeit der Entdeckung; ein eindeutiger Grenzwert existiert nicht."}], "concept": {"title": "Psychophysik nach Fechner — Schwellen und Methoden", "points": ["<b>Absolutschwelle</b>: kleinste Reizintensität, die nötig ist, damit ein Reiz überhaupt wahrgenommen wird; empirisch dort angesetzt, wo er in 50 % der Fälle erkannt wird.", "<b>Unterschiedsschwelle</b>: kleinste Differenz, um zwei Reize zu unterscheiden — abhängig vom Ausgangsreiz: je stärker dieser, desto größer der nötige absolute Unterschied.", "<b>Grenzmethode</b>: Reize werden in ab- oder zunehmender Intensität dargeboten; nach jedem Reiz erfolgt das Urteil „wahrgenommen / nicht wahrgenommen“.", "<b>Konstanzmethode</b>: gleiche Urteilsaufgabe, aber zufällige statt geordnete Abfolge der Intensitäten.", "<b>Psychometrische Funktion</b>: Graph der Erkennungsrate; die reale Kurve steigt allmählich an, nicht sprunghaft von 0 % auf 100 %.", "Beide Methoden lassen sich auch zur Bestimmung von Unterschiedsschwellen einsetzen (Kiesel & Koch, 2018)."]}}, {"id": "k5-2139027147", "kap": 5, "sec": "5.4.4 Langzeitgedächtnis", "stem": "Welche Aussagen zur Untergliederung des Langzeitgedächtnisses treffen zu?", "opts": [{"t": "Tulving (1972) unterschied innerhalb des expliziten Gedächtnisses das semantische und das episodische Gedächtnis.", "c": true, "fb": "Semantisch steht für Faktenwissen, episodisch für persönliche Erlebnisse — beide gehören zum bewusst abrufbaren Teil."}, {"t": "Das episodische Gedächtnis speichert persönliche Erlebnisse samt ihrer zeitlich-räumlichen Verknüpfungen.", "c": true, "fb": "Es hat stets Bezug zur eigenen Person und kann von Emotionen begleitet sein — anders als das semantische Faktenwissen."}, {"t": "Resultate klassischer und operanter Konditionierung zählen zum deklarativen Gedächtnis.", "c": false, "fb": "Sie gehören zum non-deklarativen, also impliziten Gedächtnis — ebenso wie nicht-assoziatives Lernen, Erwartungen und Priming."}, {"t": "Squire (1992) ordnete neben dem prozeduralen Gedächtnis auch Erwartungen und Priming dem non-deklarativen Gedächtnis zu.", "c": true, "fb": "Sein Beitrag bestand darin, das implizite Gedächtnis nicht mit dem prozeduralen gleichzusetzen, sondern weiter aufzufächern."}], "concept": {"title": "Untergliederung des Langzeitgedächtnisses (Becker-Carus & Wendt, 2017)", "points": ["<b>Eigenschaften</b>: sehr hohe Kapazität und lange, oft lebenslange Speicherdauer (Gazzaniga et al., 2017).", "<b>Explizit / deklarativ</b>: bewusst abrufbare Inhalte. <b>Implizit / non-deklarativ</b>: nicht bewusst zugängliche Inhalte.", "<b>Explizit → Tulving (1972)</b>: <b>semantisches Gedächtnis</b> (Faktenwissen ohne Personenbezug) und <b>episodisches Gedächtnis</b> (eigene Erlebnisse mit zeitlich-räumlichem Bezug, oft emotional gefärbt).", "<b>Implizit → Squire (1992)</b>: prozedurales Gedächtnis (Radfahren, Zehnfingerschreiben) sowie klassische und operante Konditionierung, nicht-assoziatives Lernen und Erwartungen/Priming.", "<b>Arbeitsteilung der Fächer</b>: implizite Prozesse behandelt vorrangig die Lernpsychologie, explizite die Gedächtnispsychologie.", "<b>Empirische Basis</b>: Patient:innen mit Amnesie, die Faktenwissen verloren, motorische Aufgaben aber weiterhin beherrschten (Cohen & Squire, 1980)."]}}, {"id": "k5-489d9ddee2", "kap": 5, "sec": "5.1 Was ist Allgemeine Psychologie?", "stem": "Welche Aussagen zum Selbstverständnis der Allgemeinen Psychologie treffen zu?", "opts": [{"t": "Die Bezeichnung verweist darauf, dass diese Teildisziplin die Gesamtheit der Psychologie umfasst.", "c": false, "fb": "Genau diese Deutung weist das Skript als naheliegenden Irrtum zurück; gemeint ist der universalistische Ansatz, kein Anspruch auf die ganze Disziplin."}, {"t": "Sie folgt einem universalistischen Ansatz: der Annahme, dass alle Menschen über die gleichen psychischen Funktionen verfügen.", "c": true, "fb": "Auf dieser Annahme beruht das Fach; aus ihr leitet es allgemein gültige Aussagen über psychische Funktionen ab."}, {"t": "Gegenüber der Differentiellen Psychologie verschiebt sich der Blick von Unterschieden auf Gemeinsamkeiten psychischer Vorgänge.", "c": true, "fb": "Die Differentielle Psychologie untersucht Unterschiede, die Allgemeine Psychologie das, was Menschen gemeinsam ist."}, {"t": "Sie beschreibt in erster Linie, wie sich psychische Prozesse über die Lebensspanne verändern.", "c": false, "fb": "Das ist Gegenstand der Entwicklungspsychologie; die Allgemeine Psychologie betrachtet gesunde erwachsene Personen."}], "concept": {"title": "Allgemeine Psychologie — Gegenstand und Abgrenzung", "points": ["<b>Universalistischer Ansatz</b>: Annahme, dass alle Menschen universell über die gleichen psychischen Funktionen verfügen (Becker-Carus & Wendt, 2017).", "<b>Gegenstand</b>: grundlegende psychische Funktionen bei gesunden erwachsenen Menschen; daraus werden allgemein gültige Aussagen abgeleitet (Kiesel & Spada, 2018).", "<b>Abgrenzung zur Differentiellen Psychologie</b>: dort Unterschiede, hier Gemeinsamkeiten.", "<b>Abgrenzung zur Entwicklungspsychologie</b>: dort Veränderung im Laufe des Lebens, hier der gesunde Erwachsene.", "<b>Abgrenzung zur Sozialpsychologie</b>: sozialpsychologische Aspekte bleiben außer Acht.", "Merkhilfe: „Allgemein“ meint <i>universell</i>, nicht <i>umfassend</i>."]}}, {"id": "k5-b76947cdb0", "kap": 5, "sec": "5.4.3 Arbeitsgedächtnis", "stem": "Welche Aussage zum Dual-Task-Paradigma und zur Studie von Robbins et al. (1996) trifft zu?", "opts": [{"t": "Die Qualität der Schachzüge litt vor allem bei jenen Personen, die immer wieder dasselbe Wort aussprechen mussten.", "c": false, "fb": "Diese Bedingung beanspruchte die phonologische Schleife, die beim Schach kaum benötigt wird — hier blieb die Leistung weitgehend erhalten."}, {"t": "Als Doppelaufgabenkosten bezeichnet man die Leistungsdifferenz zwischen gleichzeitiger und getrennter Bearbeitung zweier Aufgaben.", "c": true, "fb": "Liegt eine solche Differenz vor, spricht das für eine Beeinträchtigung durch das parallele Bearbeiten (Becker-Carus & Wendt, 2017)."}, {"t": "Das Generieren zufälliger Zahlen beanspruchte in der Studie den visuell-räumlichen Notizblock.", "c": false, "fb": "Zufallszahlen belasteten die zentrale Exekutive; den Notizblock beanspruchte das Tastendrücken im Uhrzeigersinn."}, {"t": "Als Kontrollbedingung diente das Drücken von Tasten im Uhrzeigersinn.", "c": false, "fb": "Die Kontrollbedingung bestand darin, im Sekundentakt immer dieselbe Taste zu drücken — ohne gezielte Beanspruchung einer Komponente."}], "concept": {"title": "Dual-Task-Paradigma und die Studie von Robbins et al. (1996)", "points": ["<b>Dual-Task</b>: Forschungsansatz, bei dem zwei Aufgaben zeitgleich bearbeitet werden; verglichen wird mit der Leistung bei getrennter Bearbeitung.", "<b>Doppelaufgabenkosten (Dual-Task-Costs)</b>: die dabei entstehende Leistungsdifferenz (Becker-Carus & Wendt, 2017).", "<b>Aufbau</b>: Schachprobleme lösen und parallel entweder dieselbe Taste im Sekundentakt drücken (Kontrolle), Zufallszahlen generieren (zentrale Exekutive), Tasten im Uhrzeigersinn drücken (visuell-räumlicher Notizblock) oder ein Wort wiederholen (phonologische Schleife).", "<b>Ergebnis</b>: Die Schachleistung sank bei Zufallszahlen und beim Tastendrücken im Uhrzeigersinn — nicht beim Wortwiederholen.", "<b>Schlussfolgerung</b>: Schach beansprucht vor allem zentrale Exekutive und visuell-räumlichen Notizblock; das stützt die Untergliederung des Arbeitsgedächtnisses.", "<b>Logik des Paradigmas</b>: Zwei Aufgaben stören einander besonders dann, wenn sie dieselbe Komponente beanspruchen."]}}, {"id": "k5-d0f83abef1", "kap": 5, "sec": "5.2.4 Visuelle Wahrnehmung", "stem": "Welche Aussagen zu den beiden Pfaden der visuellen Verarbeitung und zur doppelten Dissoziation treffen zu?", "opts": [{"t": "Schädigungen im ventralen Pfad zeigten sich darin, dass Objekte zwar benannt, aber nicht mehr gegriffen werden konnten.", "c": false, "fb": "Dieses Muster gehört zum dorsalen Pfad. Bei ventraler Schädigung war umgekehrt das Greifen möglich, das Benennen jedoch erschwert."}, {"t": "Der ventrale Pfad verläuft vom visuellen Cortex zum Temporallappen und trug ursprünglich die Bezeichnung „Was“-Pfad.", "c": true, "fb": "In der ursprünglichen Fassung stand er für die Objekterkennung (Mishkin, Ungerleider & Macko, 1983)."}, {"t": "Goodale und Milner (1992) schlugen für den dorsalen Pfad die Bezeichnung „Wie“-Pfad vor.", "c": true, "fb": "Sie stellten den Zweck der Information in den Vordergrund: Der dorsale Pfad steuert Handlungen wie Erreichen und Greifen."}, {"t": "Von einer doppelten Dissoziation spricht man, wenn sich zu beiden Aufgaben Personen mit jeweils umgekehrtem Ausfallmuster finden lassen.", "c": true, "fb": "Erst dieses Kreuzmuster entkräftet den Einwand, eine Aufgabe sei schlicht schwieriger als die andere."}], "concept": {"title": "Ventraler und dorsaler Pfad — und die doppelte Dissoziation", "points": ["<b>Ventraler Pfad</b>: visueller Cortex → Temporallappen; Objekterkennung, „Was“-Pfad (Mishkin, Ungerleider & Macko, 1983).", "<b>Dorsaler Pfad</b>: visueller Cortex → Parietallappen; räumliche Verarbeitung, „Wo“-Pfad.", "<b>Adaption von Goodale und Milner (1992)</b>: nicht die Qualität des Inputs, sondern der Zweck unterscheidet die Pfade — ventral <i>Vision for Perception</i>, dorsal <i>Vision for Action</i>, daher treffender „Wie“-Pfad.", "<b>Befundlage</b>: dorsale Schädigung → benennen möglich, greifen schwierig; ventrale Schädigung → greifen möglich, benennen schwierig.", "<b>Dissoziation</b>: Eine Person scheitert an Aufgabe A, löst aber Aufgabe B — das kann auch bloß an unterschiedlicher Schwierigkeit liegen.", "<b>Doppelte Dissoziation</b>: Beide Ausfallmuster lassen sich finden. Auch sie bleibt ein indirekter Rückschluss, kein Beweis für zwei getrennte Prozesse (M. W. Eysenck & Keane, 2020)."]}}, {"id": "k5-448c9096aa", "kap": 5, "sec": "5.3.3 Klassische Konditionierung", "stem": "Was gilt für Löschung, Spontanremission, Reizgeneralisierung und Reizdiskrimination?", "opts": [{"t": "Die Spontanremission zeigt, dass die konditionierte Reaktion bei der Löschung nicht verlernt, sondern nur abgeschwächt wird.", "c": true, "fb": "Nach der Löschung löst der konditionierte Reiz erneut eine — wenn auch schwache — Reaktion aus; die Assoziation ist also noch vorhanden."}, {"t": "Von Reizdiskrimination spricht man, wenn auch dem konditionierten Reiz ähnliche Reize die Reaktion auslösen.", "c": false, "fb": "Das ist die Reizgeneralisierung. Die Diskrimination ist ihr Gegenstück: Auf ähnliche Reize werden unterschiedliche Reaktionen gelernt."}, {"t": "Beim Diskriminationstraining werden beide ähnlichen Reize gleichermaßen mit dem unkonditionierten Reiz gepaart.", "c": false, "fb": "Gepaart wird nur einer der beiden Reize; die Reaktion auf den anderen nimmt dadurch allmählich ab."}, {"t": "Watson und Rayner erzeugten bei Little Albert eine Furchtreaktion, die sich anschließend auf ähnliche Objekte ausweitete.", "c": true, "fb": "Albert reagierte danach auch auf weißen Hasen und Pelzmantel — ein klassisches Beispiel für Reizgeneralisierung (Watson & Rayner, 1920)."}], "concept": {"title": "Löschung, Spontanremission, Generalisierung, Diskrimination", "points": ["<b>Löschung (Extinktion)</b>: Bleibt der UCS aus, nimmt die konditionierte Reaktion ab, bis sie schließlich ausbleibt.", "<b>Spontanremission</b>: Einige Zeit nach der Löschung löst der CS erneut eine Reaktion aus — schwach und rasch verschwindend; wird der CS wieder mit dem UCS gepaart, ist die CR schnell zurück.", "<b>Deutung</b>: Löschung ist kein Vergessensprozess, sondern selbst eine Form des Lernens, die neben der alten Assoziation gespeichert wird und signalisiert, dass diese nicht mehr gilt.", "<b>Reizgeneralisierung</b>: Auch dem CS ähnliche Reize lösen die CR aus — je ähnlicher, desto stärker. Sie ist ein Sicherheitsfaktor, da Reize in der Natur selten identisch auftreten.", "<b>Reizdiskrimination</b>: Gegenstück dazu — auf ähnliche Reize werden unterschiedliche Reaktionen gelernt.", "<b>Diskriminationstraining</b>: Nur einer der beiden ähnlichen Reize wird mit dem UCS gepaart; die Reaktion auf den anderen nimmt zunehmend ab (Gerrig et al., 2018)."]}}, {"id": "k5-dfb5c46a46", "kap": 5, "sec": "5.4.3 Arbeitsgedächtnis", "stem": "Welche Aussagen zur Millerschen Zahl und zum Chunking treffen zu?", "opts": [{"t": "Miller ging 1956 davon aus, dass sich im Arbeitsgedächtnis etwa sieben Einheiten behalten lassen.", "c": true, "fb": "Da diese Zahl ihm auch bei anderen Prozessen begegnete, nannte er sie die magische Zahl."}, {"t": "Die übliche Angabe 7 ± 2 macht deutlich, dass es sich um einen ungefähren Wert handelt.", "c": true, "fb": "Die Spannweite signalisiert, dass die Kapazität nicht exakt festgelegt ist."}, {"t": "Beim Chunking werden mehrere einzelne Informationen zu einer Informationseinheit gruppiert.", "c": true, "fb": "Aus 1, 9, 4, 5 wird so etwa eine einzige Jahreszahl statt vier separater Ziffern."}, {"t": "Ein Chunk beansprucht weniger Kapazität als die Einzelinformationen, aus denen er gebildet wurde.", "c": true, "fb": "Genau darin liegt der Nutzen: Insgesamt lässt sich mehr im Arbeitsgedächtnis unterbringen."}], "concept": {"title": "Millersche Zahl und Chunking", "points": ["<b>Magische Zahl</b>: George A. Miller (1956) — etwa sieben Einheiten im Arbeitsgedächtnis; auch <b>Millersche Zahl</b> genannt.", "<b>7 ± 2</b>: die gängige Literaturangabe macht deutlich, dass es sich um eine Näherung handelt.", "<b>Erklärungswert</b>: verständlich wird, warum lange Ziffern- oder Buchstabenfolgen wie Telefonnummern oder die IBAN schwer zu merken sind.", "<b>Chunking</b>: Gruppieren mehrerer einzelner Informationen zu einer Informationseinheit, z. B. 1, 9, 4, 5 als Jahreszahl 1945.", "<b>Effekt</b>: Ein Chunk verbraucht weniger Speicher als vier Einzelinformationen — insgesamt lässt sich mehr behalten.", "Verwandter Mechanismus: Auch das Verknüpfen neuer Inhalte mit Wissen aus dem Langzeitspeicher entlastet das Arbeitsgedächtnis."]}}, {"id": "k5-f928269a3b", "kap": 5, "sec": "5.1 Was ist Allgemeine Psychologie?", "stem": "Welche Aussage zum kognitionspsychologischen Ansatz und zu den Themenbereichen der Allgemeinen Psychologie trifft zu?", "opts": [{"t": "Die Kognitive Psychologie entstand als Weiterentwicklung des Behaviorismus, den sie um beobachtbare Reiz-Reaktions-Ketten ergänzte.", "c": false, "fb": "Sie entwickelte sich als Gegenreaktion auf den behavioristischen Ansatz, der kognitive Prozesse zur Gänze außer Acht lässt."}, {"t": "Als eigener Themenbereich wird die Untersuchung interindividueller Unterschiede in Persönlichkeitsmerkmalen geführt.", "c": false, "fb": "Das ist Gegenstand der Differentiellen Psychologie und taucht in der Auflistung der Themenbereiche nicht auf."}, {"t": "Unter Volition fallen Prozesse, die mit dem Planen und Erreichen von Zielen zu tun haben.", "c": true, "fb": "So definiert es das Skript in der Fußnote zum Themenbereich Emotion, Motivation, Volition (Achtziger & Gollwitzer, 2021)."}, {"t": "Kognitiv bedeutet „das Wahrnehmen betreffend“ und bezieht sich auf die Aufnahme sensorischer Reize.", "c": false, "fb": "Kognitiv heißt „das Denken betreffend“; die Reizaufnahme ist nur ein Ausschnitt des kognitionspsychologischen Themenspektrums."}], "concept": {"title": "Kognitive Psychologie und die Themenbereiche des Fachs", "points": ["<b>Kognitive Psychologie</b>: seit der kognitiven Wende der vorherrschende Ansatz der Allgemeinen Psychologie; „kognitiv“ bedeutet „das Denken betreffend“.", "<b>Entstehung</b>: als Gegenreaktion zum behavioristischen Ansatz, der kognitive Prozesse vollständig ausklammert. Ziel ist es, Methoden und Theorien zu entwickeln, die den Ablauf kognitiver Prozesse erklären.", "<b>Fünf Themenbereiche</b>: Wahrnehmung/Aufmerksamkeit/Bewusstsein · Lernen/Gedächtnis/Wissen · Problemlösen/Denken/Entscheiden · Emotion/Motivation/Volition · Sprache.", "<b>Volition</b>: Prozesse rund um das Planen und Erreichen von Zielen (Achtziger & Gollwitzer, 2021).", "<b>Prozess der Inputverarbeitung</b>: sensorischer Reiz → Rezeptoren der Sinne → Filter der Aufmerksamkeit → Wahrnehmung → Klassifikation → Denken und Urteilen → Entscheidung → Handlung.", "Vorwissen, Bewertungen, Emotion und Motivation greifen in diesen Ablauf laufend ein; Sprache erlaubt es, alle Inhalte mitzuteilen."]}}, {"id": "k5-74dbb0cb97", "kap": 5, "sec": "5.4.5 Gedächtniseffekte", "stem": "Welche Aussagen zum seriellen Positionseffekt und zu den Abrufmethoden treffen zu?", "opts": [{"t": "Der Primacy Effekt wird plausibel damit erklärt, dass frühe Wörter innerlich häufiger wiederholt werden können.", "c": true, "fb": "Dieses Rehearsal gilt als die naheliegende Erklärung für den besseren Abruf am Listenanfang."}, {"t": "Beim Serial Recall dürfen die gelernten Wörter in beliebiger Reihenfolge genannt werden.", "c": false, "fb": "Das kennzeichnet den Free Recall. Beim Serial Recall muss die Reihenfolge der Darbietung eingehalten werden."}, {"t": "Das Wiedererkennen erfordert in der Regel eine höhere Gedächtnisleistung als die eigenständige Wiedergabe.", "c": false, "fb": "Das Verhältnis ist umgekehrt: Recall verlangt in der Regel mehr, da beim Recognition-Test nur alte von neuen Wörtern getrennt werden müssen."}, {"t": "Der Recency Effekt wird unter anderem darauf zurückgeführt, dass die letzten Elemente noch im Kurzzeitgedächtnis präsent sind.", "c": true, "fb": "Daneben wird eine höhere zeitliche Diskriminierbarkeit der späten Elemente als Erklärung diskutiert (Gruber, 2018)."}], "concept": {"title": "Serieller Positionseffekt und Abrufmethoden", "points": ["<b>Serieller Positionseffekt</b>: Wörter am Anfang und am Ende einer Liste werden besser erinnert als solche aus der Mitte — bei kurzen wie bei längeren Listen (Jahnke, 1965).", "<b>Primacy Effekt</b>: verbesserter Abruf der ersten Elemente; Erklärung ist das häufigere innere Wiederholen (Rehearsal).", "<b>Recency Effekt</b>: verbesserter Abruf der letzten Elemente; erklärt über die Präsenz im Kurzzeitgedächtnis und über die höhere zeitliche Diskriminierbarkeit (Gruber, 2018).", "<b>Anwendung</b>: Im Marketing werden die wichtigsten Botschaften bewusst an den Anfang und an das Ende einer Kampagne gesetzt.", "<b>Recognition (Wiedererkennen)</b>: Alte Wörter müssen von neuen Distraktorwörtern getrennt werden — so funktioniert auch Teil A der Aufnahmeprüfung.", "<b>Recall (Wiedergabe)</b>: in der Regel anspruchsvoller als Recognition; <b>Free Recall</b> in beliebiger, <b>Serial Recall</b> in vorgegebener Reihenfolge (Pastötter et al., 2018)."]}}, {"id": "k5-f1c494a3db", "kap": 5, "sec": "5.3.4 Operante Konditionierung", "stem": "Welche Aussagen zu Verstärkung und Bestrafung treffen zu?", "opts": [{"t": "Bei der negativen Verstärkung wird ein als unangenehm empfundener Reiz weggenommen, wodurch das Verhalten wahrscheinlicher wird.", "c": true, "fb": "Beispiel aus dem Skript: die Befreiung von Haushaltsdiensten als Folge einer guten Note."}, {"t": "Primäre Verstärker befriedigen keine biologischen Bedürfnisse und entstehen durch klassische Konditionierung.", "c": false, "fb": "Das beschreibt sekundäre Verstärker wie Geld. Primäre Verstärker — Nahrung, Wasser — befriedigen biologische Bedürfnisse unmittelbar."}, {"t": "Ein Fernsehverbot nach einer schlechten Note ist ein Beispiel für negative Bestrafung.", "c": true, "fb": "Es wird ein als angenehm empfundener Reiz weggenommen, um die Auftretenswahrscheinlichkeit des Verhaltens zu senken."}, {"t": "Auch bei der operanten Konditionierung lassen sich Löschung und Spontanremission beobachten.", "c": true, "fb": "Bleibt die Verstärkung aus, geht das Verhalten auf das Ausgangsniveau zurück; danach kann es erneut spontan auftreten."}], "concept": {"title": "Verstärkung und Bestrafung nach Skinner", "points": ["<b>Verstärker</b>: Faktoren, die auf ein gezeigtes Verhalten folgen und sein Auftreten wahrscheinlicher machen.", "<b>Primär vs. sekundär</b>: primäre Verstärker befriedigen biologische Bedürfnisse (Nahrung, Wasser); sekundäre — etwa Geld — tun das nicht und werden durch klassische Konditionierung geschaffen. Auch Personen können als Verstärker dienen.", "<b>Positive Verstärkung</b>: angenehmer Reiz kommt hinzu (gute Note, Taschengeld). <b>Negative Verstärkung</b>: unangenehmer Reiz fällt weg (Befreiung vom Haushaltsdienst). Beide erhöhen die Auftretenswahrscheinlichkeit.", "<b>Positive Bestrafung</b>: unangenehmer Reiz kommt hinzu (zusätzlicher Küchendienst). <b>Negative Bestrafung</b>: angenehmer Reiz fällt weg (Fernsehverbot, Hausarrest). Beide senken sie.", "<b>Merkhilfe</b>: „positiv/negativ“ meint Hinzufügen oder Wegnehmen, „Verstärkung/Bestrafung“ die Richtung der Wahrscheinlichkeit.", "Löschung bei ausbleibender Verstärkung, Spontanremission, Reizgeneralisierung und Reizdiskrimination treten auch hier auf (Gerrig et al., 2018)."]}}, {"id": "k5-62508cd836", "kap": 5, "sec": "5.2.1 Wahrnehmung", "stem": "Welche Aussagen zu den drei Stufen der Wahrnehmung nach Becker-Carus und Wendt (2017) treffen zu?", "opts": [{"t": "Das Perzept, ein mentales Abbild des Wahrgenommenen, entsteht auf der Stufe der Klassifikation.", "c": false, "fb": "Das Perzept entsteht auf der zweiten Stufe, der Wahrnehmung im engeren Sinne; die Klassifikation ordnet dieses Abbild erst danach ein."}, {"t": "Die sensorische Empfindung wird eher der Biologischen Psychologie zugeordnet, die beiden folgenden Stufen der Allgemeinen Psychologie.", "c": true, "fb": "Diese Arbeitsteilung nennt das Skript ausdrücklich; die Stufen zwei und drei sind zudem oft schwer voneinander zu trennen."}, {"t": "Auf der dritten Stufe werden die Abbilder in bereits bekannte Kategorien eingeordnet.", "c": true, "fb": "Erst dadurch wird aus dem Abbild einer Person etwa eine Fremde, ein Freund oder eine Ärztin."}, {"t": "Bereits auf der ersten Stufe entsteht eine innere Repräsentation, die mit Vorerfahrungen abgeglichen wird.", "c": false, "fb": "Auf der ersten Stufe werden Reize lediglich aufgenommen und in neuronale Signale umgewandelt; der Abgleich folgt eine Stufe später."}], "concept": {"title": "Die drei Stufen der Wahrnehmung (Becker-Carus & Wendt, 2017)", "points": ["<b>Wahrnehmung allgemein</b>: Prozess der Aufnahme und Verarbeitung von Reizen aus der Umwelt; die Aufmerksamkeit bestimmt, was aufgenommen wird und trennt Wichtiges von Unwichtigem.", "<b>Stufe 1 – Sensorische Empfindung</b>: Rezeptoren der Sinnesorgane nehmen Reize auf und wandeln sie in neuronale Signale um.", "<b>Stufe 2 – Wahrnehmung im engeren Sinne</b>: Bildung einer inneren Repräsentation; im Zusammenspiel mit übergeordneten Prozessen entsteht das <b>Perzept</b>, ein mentales Abbild.", "<b>Stufe 3 – Klassifikation</b>: Einordnung des Abbilds in bereits bekannte Kategorien.", "<b>Zuordnung</b>: Stufe 1 eher Biologische Psychologie, Stufen 2 und 3 Allgemeine Psychologie — praktisch oft schwer trennbar.", "Vorwissen, Vorerfahrungen, Bewertungen, Erwartungen und Emotionen beeinflussen, was zwei Personen in derselben Situation wahrnehmen (Kiesel & Koch, 2018)."]}}, {"id": "k5-b715abc96d", "kap": 5, "sec": "5.4.4 Langzeitgedächtnis", "stem": "Welche Aussage zur Amnesie und zum Fall H.M. trifft zu?", "opts": [{"t": "Bei einer retrograden Amnesie können keine neuen Gedächtnisinhalte mehr eingespeichert werden.", "c": false, "fb": "Das kennzeichnet die anterograde, vorwärts gerichtete Amnesie. Retrograd fehlen Ereignisse kurz vor der Schädigung."}, {"t": "Henry Molaison entwickelte nach der Entfernung von Teilen der Temporallappen und des Hippocampus eine ausgeprägte anterograde Amnesie.", "c": true, "fb": "Der Eingriff erfolgte wegen starker epileptischer Anfälle; neue Fakten und Ereignisse konnte er danach nicht mehr einspeichern."}, {"t": "In perzeptiv-motorischen Lernaufgaben schnitt H.M. durchgehend schlecht ab.", "c": false, "fb": "Gerade dort war er erfolgreich und behielt die erlernten Fähigkeiten sogar über ein Jahr hinaus."}, {"t": "Die bahnbrechenden Studien zu diesem Fall führte Brenda Milner gemeinsam mit Hermann Ebbinghaus durch.", "c": false, "fb": "Ihr Mitautor war der Neurochirurg William B. Scoville (Scoville & Milner, 1957); Ebbinghaus steht für die Vergessenskurve."}], "concept": {"title": "Amnesie und der Fall H.M.", "points": ["<b>Amnesie</b>: teilweiser Verlust der Erinnerungsfähigkeit infolge einer Schädigung des Gehirns — Ursachen sind Unfälle, aber auch Schlaganfall, Alkoholismus oder Gehirnentzündung.", "<b>Retrograde Amnesie</b>: rückwärts gerichtet — Ereignisse kurz <i>vor</i> der Schädigung fehlen, alle übrigen kognitiven Funktionen bleiben intakt.", "<b>Anterograde Amnesie</b>: vorwärts gerichtet — <i>neue</i> Inhalte lassen sich nicht mehr einspeichern; tritt häufig zusammen mit einer retrograden Amnesie auf.", "<b>Henry Molaison (H.M.)</b>: Nach Entfernung von Teilen der Temporallappen und des Hippocampus wegen schwerer Epilepsie entwickelte er eine ausgeprägte anterograde Amnesie.", "<b>Aufschlussreiche Dissoziation</b>: Neue Fakten und Ereignisse blieben ihm verschlossen, perzeptiv-motorische Lernaufgaben gelangen jedoch gut — ein Beleg für getrennte Gedächtnissysteme.", "<b>Erforschung</b>: Brenda Milner, Neuropsychologin und Pionierin der kognitiven Neurowissenschaften, gemeinsam mit dem Neurochirurgen William B. Scoville in den 1950er Jahren (Scoville & Milner, 1957)."]}}, {"id": "k5-59b5eb8816", "kap": 5, "sec": "5.2.3 Aufmerksamkeit", "stem": "Welche Aussagen zum Cueing-Paradigma und zu endogenen bzw. exogenen Hinweisreizen treffen zu?", "opts": [{"t": "In der validen Bedingung erschien der Zielreiz in 80 % der Durchläufe auf der Seite, in die der Pfeil zeigte.", "c": true, "fb": "In den übrigen 20 % tauchte er auf der Gegenseite auf — das ist die invalide Bedingung."}, {"t": "Die Reaktionszeiten waren in den neutralen Durchgängen am kürzesten und in den validen am längsten.", "c": false, "fb": "Die Reihenfolge lautet valide < neutral < invalide: Valide Durchgänge waren die schnellsten, invalide die langsamsten."}, {"t": "Endogene Hinweisreize wirken bereits ab einer SOA von etwa 50 Millisekunden, exogene erst ab etwa 200 Millisekunden.", "c": false, "fb": "Die Werte sind vertauscht: Exogene Reize wirken ab rund 50 ms, endogene brauchen mindestens etwa 200 ms."}, {"t": "Exogene Hinweisreize wirken früher, endogene dafür länger — bis zu etwa 500 Millisekunden.", "c": true, "fb": "Exogene Reize verlieren ihre Wirkung oft schon nach etwa 200 ms, endogene bleiben deutlich länger wirksam."}], "concept": {"title": "Cueing-Paradigma (Posner, 1980) und die beiden Aufmerksamkeitsarten", "points": ["<b>Aufbau</b>: Fixation der Bildschirmmitte, dann Hinweisreiz (Cue), dann Zielreiz; abhängige Variable ist die <b>Reaktionszeit</b> auf den Zielreiz.", "<b>Drei Bedingungen</b>: neutral (neutrales Symbol, Zielreiz je 50 % links/rechts) · valide (Pfeil, 80 % korrekt) · invalide (20 % auf der Gegenseite).", "<b>Ergebnis</b>: valide < neutral < invalide. Weil die Augen fixiert bleiben, scheiden Augenbewegungen als Ursache der kürzeren Reaktionszeit aus.", "<b>Endogene Aufmerksamkeit</b>: von innen heraus gesteuert, beeinflusst von Erwartungen, Bewertungen, Vorwissen und Vorerfahrungen (Huestegge, 2022).", "<b>Exogene Aufmerksamkeit</b>: wird von äußeren Reizen angezogen; der periphere Cue wirkt durch sein bloßes Erscheinen, ohne Bedeutungsverarbeitung.", "<b>SOA (Stimulus-Onset-Asynchrony)</b>: endogen ab ca. 200 ms wirksam und bis ca. 500 ms anhaltend; exogen schon ab ca. 50 ms, aber oft nur bis ca. 200 ms."]}}, {"id": "k5-e0003d47e3", "kap": 5, "sec": "5.4.5 Gedächtniseffekte", "stem": "Welche Aussagen zur Vergessenskurve von Ebbinghaus und zu Interferenzphänomenen treffen zu?", "opts": [{"t": "Ebbinghaus arbeitete mit Listen sinnloser Silben nach dem Muster Konsonant-Vokal-Konsonant.", "c": true, "fb": "Beispiele aus dem Skript sind FUB, KAH und BIK; er wiederholte solche Listen bis zum fehlerfreien Aufsagen."}, {"t": "Nach 24 Stunden ließen sich noch knapp 34 % der Arbeitsleistung einsparen.", "c": true, "fb": "Der Verlauf war 58 % nach 20 Minuten, 44 % nach einer Stunde, knapp 34 % nach 24 Stunden und gut 25 % nach sechs Tagen."}, {"t": "Von proaktiver Interferenz spricht man, wenn neu gelernte Inhalte das Erinnern älterer Inhalte beeinträchtigen.", "c": false, "fb": "Das beschreibt die retroaktive Interferenz. Proaktiv wirkt die ältere Information störend auf das Erinnern der neueren."}, {"t": "Die Gedächtnisleistung geht bereits in der ersten Stunde deutlich zurück und nimmt danach nur noch langsam ab.", "c": true, "fb": "Dieser steile Abfall mit anschließend flachem Verlauf ist die charakteristische Form der Vergessenskurve."}], "concept": {"title": "Vergessenskurve von Ebbinghaus und Interferenzphänomene", "points": ["<b>Ebbinghaus</b>: Begründer der experimentellen Gedächtnisforschung; „Über das Gedächtnis“ (1885), gewonnen in Selbstversuchen mit <b>sinnlosen Silben</b> (Konsonant-Vokal-Konsonant, z. B. FUB, KAH, BIK).", "<b>Ersparnismethode</b>: Maß für die Gedächtnisleistung sind die beim Wiedererlernen eingesparten Wiederholungen bzw. die eingesparte Zeit — je weniger Zeit nötig, desto mehr wurde behalten.", "<b>Verlauf</b>: nach 20 Minuten ca. 58 % Ersparnis, nach einer Stunde 44 %, nach 24 Stunden knapp 34 %, nach sechs Tagen gut 25 %.", "<b>Interferenz</b>: Ein großer Teil des Vergessens entsteht dadurch, dass andere Informationen die gewünschten Inhalte verdrängen.", "<b>Proaktive Interferenz</b>: <i>ältere</i> Inhalte erschweren das Erinnern <i>neuer</i> — früh gelerntes Spanisch stört das spätere Italienisch.", "<b>Retroaktive Interferenz</b>: <i>neue</i> Inhalte erschweren das Erinnern <i>älterer</i> — nach dem Chemielernen fehlt der Physikstoff. Merkhilfe: Die Vorsilbe nennt die Richtung, in die gestört wird."]}}, {"id": "k5-d649e93a7f", "kap": 5, "sec": "5.3.1 Lernen", "stem": "Welche Aussage zum psychologischen Lernbegriff und zum nicht-assoziativen Lernen trifft zu?", "opts": [{"t": "Bei der Sensitivierung führt die wiederholte Darbietung eines Reizes zu einer abnehmenden Reaktionsbereitschaft.", "c": false, "fb": "Abnehmend ist die Reaktion bei der Habituation. Die Sensitivierung erhöht Empfindlichkeit und Reaktionsbereitschaft, meist bei schmerzhaften Reizen."}, {"t": "Habituation und Sensitivierung gelten als nicht-assoziatives Lernen, weil keine Assoziationen zwischen Gegebenheiten gebildet werden müssen.", "c": true, "fb": "Damit grenzen sie sich von klassischer und operanter Konditionierung ab, bei denen genau solche Verknüpfungen entstehen."}, {"t": "Die Ausbildung der Theory of Mind wird als Lernprozess eingeordnet, da sie auf Erfahrung beruht.", "c": false, "fb": "Sie zählt zu den Entwicklungsprozessen; Lernen setzt eine durch Erfahrung bewirkte Änderung des Verhaltenspotenzials voraus."}, {"t": "Verhaltensänderungen infolge von Ermüdung oder Drogeneinfluss zählen zum Lernen, sofern sie beobachtbar sind.", "c": false, "fb": "Das Kriterium der überdauernden Veränderung schließt genau solche vorübergehenden Zustandsänderungen aus."}], "concept": {"title": "Lernen, Verhaltenspotenzial und nicht-assoziatives Lernen", "points": ["<b>Definition</b>: durch Erfahrung entstandene, relativ überdauernde Verhaltensänderungen (Gerrig et al., 2018) — nicht deterministisch, sondern als veränderte Auftretenswahrscheinlichkeit zu verstehen.", "<b>Verhaltenspotenzial</b>: Gelerntes muss sich nicht sofort in Leistung zeigen; die Änderung kann erst viel später sichtbar werden.", "<b>Abgrenzungen</b>: Reife- und Entwicklungsprozesse zählen nicht dazu — die Theory of Mind ist ein Entwicklungs-, kein Lernprozess. „Überdauernd“ schließt Ermüdung und Drogeneinfluss aus.", "<b>Explizit vs. implizit</b>: bewusstes Aneignen (Schule, Prüfungsvorbereitung) gegenüber automatisch ablaufenden Prozessen ohne bewusste Verarbeitung (I. Koch & Stahl, 2017).", "<b>Habituation</b>: Gewöhnung an einen zunächst auffälligen, aber ungefährlichen Reiz — die Orientierungsreaktion nimmt ab.", "<b>Sensitivierung</b>: umgekehrter Fall — bei erschreckenden oder schmerzvollen Reizen steigen Empfindlichkeit und Reaktionsbereitschaft; beides zusammen bildet das <b>nicht-assoziative Lernen</b>."]}}, {"id": "k5-59364fa943", "kap": 5, "sec": "5.4.3 Arbeitsgedächtnis", "stem": "Welche Aussagen zum Arbeitsgedächtnismodell nach Baddeley treffen zu?", "opts": [{"t": "Die phonologische Schleife verarbeitet sprachbasierte Informationen, auch still mitgesprochene geschriebene Wörter.", "c": true, "fb": "Beim Eintippen einer gelesenen Telefonnummer hält sie die Ziffern, bis sie im Handy stehen."}, {"t": "Der visuell-räumliche Notizblock kontrolliert die Aufmerksamkeit und koordiniert die übrigen Komponenten.", "c": false, "fb": "Diese Aufgabe übernimmt die zentrale Exekutive. Der Notizblock speichert visuelle und räumliche Informationen kurzfristig."}, {"t": "Der episodische Puffer wurde erst rund 25 Jahre nach dem ursprünglichen Modell ergänzt.", "c": true, "fb": "Baddeley (2000) fügte ihn als Schnitt- und Speicherstelle zwischen den Komponenten sowie zum Langzeitgedächtnis hinzu."}, {"t": "Baddeley und Hitch behielten den Begriff des Kurzzeitspeichers bei, weil dieser ausschließlich Gedächtnisaufgaben dient.", "c": false, "fb": "Sie ersetzten ihn durch das Arbeitsgedächtnis, gerade weil es auch andere komplexe Aufgaben wie Kopfrechnen trägt."}], "concept": {"title": "Das Arbeitsgedächtnismodell (Baddeley & Hitch, 1974; Baddeley, 2000)", "points": ["<b>Anlass</b>: Kritik am Modell von Atkinson & Shiffrin; der Begriff <i>Kurzzeitspeicher</i> wird durch <b>Arbeitsgedächtnis</b> ersetzt, weil dieses auch andere komplexe Aufgaben trägt.", "<b>Zentrale Exekutive</b>: komplexeste Komponente; kontrolliert die Aufmerksamkeit und koordiniert die übrigen Bestandteile, die als Hilfssysteme gelten.", "<b>Phonologische Schleife</b>: Verarbeitung und kurzfristige Speicherung sprachbasierter Information — gesprochene wie beim Lesen still mitgesprochene Wörter.", "<b>Visuell-räumlicher Notizblock</b>: dasselbe für visuelle und räumliche Information, etwa einen beschriebenen Weg.", "<b>Episodischer Puffer</b> (Baddeley, 2000): 25 Jahre später ergänzt; verbindet die Komponenten untereinander sowie mit Wahrnehmung und Langzeitgedächtnis.", "Die drei Hilfssysteme haben begrenzte Kapazität und arbeiten weitgehend unabhängig; selektive Gedächtnisausfälle nach Hirnschädigungen lassen sich damit besser erklären als mit dem Drei-Speicher-Modell."]}}, {"id": "k5-a7d1cba399", "kap": 5, "sec": "5.2.4 Visuelle Wahrnehmung", "stem": "Welche Aussagen zur Tiefen- und Größenwahrnehmung treffen zu?", "opts": [{"t": "Zur Linienperspektive zählt, dass parallel verlaufende Linien in der Entfernung aufeinander zulaufen.", "c": true, "fb": "Sie gehört zu den monokularen Hinweisen, für die die Information eines Auges genügt."}, {"t": "Weiter entfernte Objekte wirken bläulicher und weniger gesättigt — das nennt man atmosphärische Perspektive.", "c": true, "fb": "Diese Färbung dient als Hinweis darauf, dass ein Objekt weiter weg ist."}, {"t": "Konvergenz und Akkommodation werden als okulomotorische Tiefenhinweise bis zu einer Entfernung von drei Metern genutzt.", "c": true, "fb": "Die Augen bewegen sich nach innen und die Linse verdickt sich — beides sind binokulare, okulomotorische Hinweise."}, {"t": "Der Ames-Raum beruht auf einer gezielten Manipulation von Tiefenhinweisen wie der Linienperspektive.", "c": true, "fb": "Zwei unterschiedlich weit entfernte Ecken erscheinen gleich weit entfernt, wodurch die nähere Person deutlich größer wirkt."}], "concept": {"title": "Tiefen- und Größenwahrnehmung", "points": ["<b>Monokulare Hinweise</b> (ein Auge genügt): Linienperspektive · relative Größe (der kleinere von zwei gleichen Gegenständen wirkt ferner) · Verdeckung (der verdeckte Gegenstand wirkt ferner) · atmosphärische Perspektive (bläulich, weniger gesättigt = weiter weg).", "<b>Binokulare Hinweise</b>: benötigen die Information beider Augen.", "<b>Okulomotorische Tiefenhinweise</b>: Konvergenz (Augen bewegen sich nach innen) und Akkommodation (Linse verdickt sich) — nutzbar bis etwa 3 Meter.", "<b>Querdisparation</b>: leicht unterschiedliche Netzhautbilder beider Augen; sie allein genügt für einen Tiefeneindruck — sichtbar an Autostereogrammen.", "<b>Ames-Raum</b> (Adelbert Ames, 1935): manipulierte Tiefenhinweise lassen zwei unterschiedlich weit entfernte Ecken gleich weit erscheinen.", "<b>Folge im Ames-Raum</b>: Da die kleinere Person nicht als „weiter weg“ interpretiert werden kann, erscheint die nähere Person schlicht viel größer (Gazzaniga et al., 2017)."]}}, {"id": "k5-cf41036010", "kap": 5, "sec": "5.2.3 Aufmerksamkeit", "stem": "Welche Aussagen zu den klassischen Untersuchungen der Aufmerksamkeit treffen zu?", "opts": [{"t": "Broadbent (1954) leitete aus dem Split-Span-Paradigma ab, dass die Zahlen vor der Weiterverarbeitung nach ihrer Lokalisation selektiert werden.", "c": true, "fb": "Die Versuchspersonen gaben die Zahlen meist ohrweise statt paarweise wieder — die Lokalisation diente als Hinweisreiz zur Trennung."}, {"t": "Beim dichotischen Hören nach Cherry (1953) konnten die Versuchspersonen den Inhalt des unbeachteten Ohrs in der Regel wiedergeben.", "c": false, "fb": "Dazu konnten sie meist keine Angaben machen: Die Inhalte am anderen Ohr wurden zwar gehört, aber nicht wahrgenommen."}, {"t": "Als Experimentalparadigma bezeichnet man einen häufig verwendeten experimentellen Aufbau zur Untersuchung eines bestimmten Gegenstands.", "c": true, "fb": "Das Cueing-Paradigma und das Split-Span-Paradigma nennt das Skript als Beispiele dafür."}, {"t": "Im Experiment von Simons und Chabris (1999) entdeckte die Gruppe, die die Pässe des weißen Teams zählte, den Gorilla häufiger.", "c": false, "fb": "Es war umgekehrt: 83 % der Personen, die das schwarze Team zählten, sahen den Gorilla — beim weißen Team waren es nur 42 %."}], "concept": {"title": "Selektive Aufmerksamkeit und ihre Untersuchungsparadigmen", "points": ["<b>Aufmerksamkeit</b>: Filter, der vorsortiert, welche physikalischen Reize relevant sind; die <b>selektive Aufmerksamkeit</b> wählt aus vielen Sinneseindrücken eine Teilmenge aus.", "<b>Unaufmerksamkeitsblindheit</b> (Simons & Chabris, 1999): 83 % der Personen, die die Pässe des <i>schwarzen</i> Teams zählten, entdeckten den Gorilla — beim weißen Team nur 42 %.", "<b>Cocktailparty-Effekt</b>: Beispiel für selektives Hören; der eigene Name im Nebengespräch zieht die Aufmerksamkeit ab (Krummenacher & Müller, 2017).", "<b>Dichotisches Hören</b> (Cherry, 1953): Das Wiedergeben des beachteten Textes gelingt leicht, der Inhalt am anderen Ohr wird gehört, aber nicht wahrgenommen.", "<b>Split-Span-Paradigma</b> (Broadbent, 1954): Zahlenpaare werden meist ohrweise statt paarweise wiedergegeben → Selektion nach physikalischen Eigenschaften, hier der Lokalisation.", "<b>Experimentalparadigma</b>: etablierter Versuchsaufbau für einen bestimmten Untersuchungsgegenstand — im Skript etwa das Cueing- und das Split-Span-Paradigma."]}}, {"id": "k5-ce4cda49e7", "kap": 5, "sec": "5.3.5 Beobachtungslernen", "stem": "Welche Aussage zum Beobachtungslernen und zu den Bobo-Doll-Experimenten trifft zu?", "opts": [{"t": "Das Beobachtungslernen wird dem Behaviorismus zugerechnet, weil es auf Reiz, Reaktion und Verstärkung beruht.", "c": false, "fb": "Es zählt zur kognitiven Psychologie und erklärt gerade jene Lernprozesse, die nicht auf Reiz, Reaktion und Verstärkung zurückgehen."}, {"t": "Im Experiment von 1965 zeigten jene Kinder die geringste Aggression, die ein Filmende mit Tadel gesehen hatten.", "c": true, "fb": "Belohntes Modell und Modell ohne Konsequenzen führten dagegen zu deutlich mehr physischer und verbaler Aggression."}, {"t": "Die Kinder der nicht-aggressiven Bedingung ahmten das Modell in abgeschwächter Form nach.", "c": false, "fb": "Sie zeigten so gut wie kein aggressives Verhalten; die Nachahmung trat nur in der aggressiven Bedingung auf."}, {"t": "Blieben Konsequenzen für die erwachsene Person aus, verhielten sich die Kinder ähnlich zurückhaltend wie nach der Tadelbedingung.", "c": false, "fb": "Die Gruppe ohne Konsequenzen lag auf ähnlich hohem Aggressionsniveau wie die Gruppe mit belohntem Modell."}], "concept": {"title": "Beobachtungslernen und die Bobo-Doll-Experimente (Bandura)", "points": ["<b>Bezeichnungen</b>: Modelllernen, Lernen am Modell, Imitationslernen, soziales Lernen, sozialkognitive Lerntheorie — zugeordnet der kognitiven Psychologie, nicht dem Behaviorismus.", "<b>Prinzip</b>: Gelernt wird durch Beobachtung anderer Lebewesen, ohne eigene Erfahrung mit Reiz, Reaktion und Verstärkung.", "<b>Bobo-Doll-Experiment</b> (Bandura, Ross & Ross, 1961): Vierjährige sahen ein Modell entweder aggressiv oder nicht-aggressiv gegenüber der Puppe; nur die aggressive Bedingung führte zu ähnlichem physischem und verbalem Verhalten.", "<b>Stellvertretendes Lernen</b> (Bandura, 1965): Drei Filmenden — belohnt, getadelt, ohne Konsequenzen. Gruppe 1 und Gruppe 3 zeigten mehr Aggression als die Tadelgruppe; auch Konsequenzen werden also durch Beobachtung gelernt.", "<b>Menschenbild</b>: aktiv Lernender; Lernen entsteht in Wechselwirkung von Person und Umwelt (soziale Komponente) sowie durch Planen, Reflektieren und Selbstmotivieren (kognitive Komponente).", "Daraus entwickelten sich die sozial-kognitiven Persönlichkeitstheorien (Hobmair, 2012; vgl. Kapitel 8.2.4)."]}}, {"id": "k5-fb30f1706d", "kap": 5, "sec": "5.2.2 Theorien der Wahrnehmung", "stem": "Welche Aussagen zur Signalentdeckungstheorie treffen zu?", "opts": [{"t": "Die zweite Komponente, der kognitive Entscheidungsprozess, variiert unmittelbar mit der Sensitivität der Person.", "c": false, "fb": "Der Entscheidungsprozess wird ausdrücklich als von der Sensitivität unabhängig beschrieben; er greift vor allem bei uneindeutigen Reizen."}, {"t": "Wird kein Reiz dargeboten und die Person meldet dennoch einen Reiz, liegt ein falscher Alarm vor.", "c": true, "fb": "Das Gegenstück ist die korrekte Zurückweisung: kein Reiz dargeboten und keiner berichtet."}, {"t": "Eine Nein-Sage-Tendenz äußert sich in einer vergleichsweise hohen Anzahl an Verpassern.", "c": true, "fb": "Bei Unsicherheit wird eher „kein Reiz“ angegeben — auch dann, wenn tatsächlich einer dargeboten wurde."}, {"t": "Eine Antworttendenz ist ein systematisches Muster im Antwortverhalten, das unabhängig vom Untersuchungsgegenstand auftritt.", "c": true, "fb": "Sie kann zugunsten oder zuungunsten einer bestimmten Antwortart ausfallen; die Ja-Sage-Tendenz ist ein Beispiel dafür."}], "concept": {"title": "Signalentdeckungstheorie", "points": ["<b>Grundannahme</b>: Das Entdecken eines Reizes ist kein objektiver, sondern ein subjektiver Prozess aus zwei Komponenten — motivationale Faktoren und konkurrierende Reize blieben in der Psychophysik unbeachtet.", "<b>Sensitivität</b>: Empfindlichkeit gegenüber dem Reiz, stark beeinflusst von der Anwesenheit anderer Reize (voller Raum vs. geräuscharmer Raum).", "<b>Kognitiver Entscheidungsprozess</b>: von der Sensitivität <b>unabhängig</b>; entscheidet vor allem bei uneindeutigen Reizen über „vorhanden / nicht vorhanden“.", "<b>Vier mögliche Ausgänge</b>: Treffer (Reiz + Ja) · Verpasser (Reiz + Nein) · Falscher Alarm (kein Reiz + Ja) · Korrekte Zurückweisung (kein Reiz + Nein).", "<b>Ja-Sage-Tendenz</b>: viele Treffer <i>und</i> auffällig viele falsche Alarme. <b>Nein-Sage-Tendenz</b>: auffällig viele Verpasser. Beides sind <b>Antworttendenzen</b>, also systematische Muster unabhängig vom Untersuchungsgegenstand.", "Die gegebene Antwort ist damit nie Resultat des Reizes allein, sondern einer Kombination aus Reiz und kognitiven Prozessen (Becker-Carus & Wendt, 2017; Gazzaniga et al., 2017)."]}}, {"id": "k5-2e91bdb42d", "kap": 5, "sec": "5.4.5 Gedächtniseffekte", "stem": "Welche Aussagen zum Prinzip der Enkodierspezifität treffen zu?", "opts": [{"t": "Der Abruf gelingt besser, wenn die während der Enkodierung herrschenden Zustände denen beim Abruf ähneln.", "c": true, "fb": "Das ist die allgemeine Formulierung des Prinzips — sie gilt für Aufgabenformate ebenso wie für Kontexte."}, {"t": "Bei Godden und Baddeley (1975) war die Erinnerungsleistung am besten, wenn Lern- und Abfrageort auseinanderfielen.", "c": false, "fb": "Die Leistung war gerade dann am besten, wenn Lern- und Abfrageort übereinstimmten — obwohl der Ort für die Aufgabe irrelevant war."}, {"t": "Morris, Bransford und Franks (1977) zeigten, dass semantische Enkodierung dem Abruf unabhängig von der Abrufaufgabe überlegen ist.", "c": false, "fb": "Beim Reimtest kehrte sich der Effekt der Verarbeitungstiefe um: Phonemisch enkodierte Wörter wurden besser erkannt."}, {"t": "Passungseffekte betreffen nicht nur äußere Lernumgebungen, sondern auch innere Zustände wie die Stimmung.", "c": true, "fb": "In trauriger Stimmung Eingeprägtes lässt sich in trauriger Stimmung leichter abrufen."}], "concept": {"title": "Das Prinzip der Enkodierspezifität", "points": ["<b>Grundaussage</b>: Die Gedächtnisleistung beim Abruf ist besser, wenn die Zustände während der Enkodierung denen beim Abruf ähneln.", "<b>Morris, Bransford und Franks (1977)</b>: Bei einem Reimtest wurden phonemisch enkodierte Wörter besser erkannt als semantisch enkodierte — der Effekt der Verarbeitungstiefe kehrte sich um. Entscheidend ist die <b>Passung</b> zwischen Einpräge- und Abrufaufgabe.", "<b>Godden und Baddeley (1975)</b>: Taucher:innen lernten und erinnerten Wortlisten unter Wasser oder am Ufer; die Leistung war am besten, wenn Lern- und Abfrageort übereinstimmten.", "<b>Reichweite</b>: Kontexteffekte betreffen äußere Lernumgebungen ebenso wie innere Zustände, etwa die emotionale Verfassung.", "<b>Erklärung</b>: Mit dem Lernmaterial werden auch die Kontextbedingungen eingespeichert; beim Abruf wirken sie als Hinweisreize (Pastötter et al., 2018).", "Bemerkenswert daran: Der Kontext wirkt selbst dann, wenn er für die eigentliche Aufgabe inhaltlich völlig irrelevant ist."]}}, {"id": "k5-b27d86a697", "kap": 5, "sec": "5.3.4 Operante Konditionierung", "stem": "Welche Aussage zu Thorndikes Problemkäfig und zur Skinner-Box trifft zu?", "opts": [{"t": "Bei Thorndikes Paradigma war eine Assoziation zwischen zwei Reizen beobachtbar, wie sie auch der klassischen Konditionierung zugrunde liegt.", "c": false, "fb": "Beobachtbar war eine Reiz-Reaktions-Verbindung: Der Mechanismus stellte den Reiz dar, sein Bedienen die Reaktion."}, {"t": "Skinner entwickelte seine operante Kammer rund fünfzehn Jahre vor Thorndikes Arbeiten am Problemkäfig.", "c": false, "fb": "Skinner baute den Problemkäfig etwa dreißig Jahre nach Thorndike weiter und setzte dabei auf dessen Gesetz des Effekts auf."}, {"t": "Als Operandum bezeichnete Skinner alles, was in der Versuchsanordnung einen Vorgang auslösen konnte, etwa einen Hebel oder eine Taste.", "c": true, "fb": "Weil der Käfig klein und reizarm war, betätigte das Tier früher oder später zwangsläufig ein vorhandenes Operandum."}, {"t": "Nach dem Gesetz des Effekts sinkt die Auftretenswahrscheinlichkeit einer Reaktion, wenn ihr eine befriedigende Konsequenz folgt.", "c": false, "fb": "Sie steigt in diesem Fall. Bleibt die befriedigende Konsequenz aus, vermindert sich die Wahrscheinlichkeit."}], "concept": {"title": "Von Thorndikes Problemkäfig zur Skinner-Box", "points": ["<b>Problemkäfig</b> (Thorndike, 1898): Katzen befreiten sich zunächst eher zufällig über einen Mechanismus; in weiteren Durchgängen gelang das immer schneller.", "<b>S-R-Verbindung</b>: Anders als bei Pawlow verknüpft sich hier ein Reiz (Mechanismus) mit einer Reaktion (Bedienen) — gelernt über <b>Versuch und Irrtum</b>.", "<b>Gesetz des Effekts</b>: Lernen wird durch seine Konsequenzen beeinflusst — folgt eine befriedigende Konsequenz, steigt die Auftretenswahrscheinlichkeit der Reaktion; bleibt sie aus, sinkt sie.", "<b>Skinners Kritik</b>: „befriedigende Zustände“ seien nicht empirisch beobachtbar; rund dreißig Jahre nach Thorndike formalisierte er die Theorie stärker.", "<b>Skinner-Box</b>: von Skinner selbst <i>operante Kammer</i> genannt; klein und reizarm, mit mindestens einem <b>Operandum</b> (Hebel, Taste), das zwangsläufig betätigt wird.", "<b>Vorgehen</b>: erst die <b>Basisrate</b> ohne Verstärkung bestimmen, dann die Konditionierungsphase mit gezielter Verstärkung (Spada, Rummel & Ernst, 2018)."]}}, {"id": "k5-01379f7b71", "kap": 5, "sec": "5.2.4 Visuelle Wahrnehmung", "stem": "Welche Aussagen zu den Theorien des Farbensehens und zu Komplementärfarben treffen zu?", "opts": [{"t": "Die Dreifarbentheorie geht auf Thomas Young zurück und wurde von Hermann von Helmholtz aufgegriffen und weiterentwickelt.", "c": true, "fb": "Young postulierte sie zu Beginn des 19. Jahrhunderts; heute bestätigen drei Zapfentypen in der Retina die Grundannahme."}, {"t": "Dass längeres Betrachten einer Farbe ein Nachbild in der Komplementärfarbe erzeugt, erklärt die Dreifarbentheorie.", "c": false, "fb": "Genau dieses Phänomen blieb der Dreifarbentheorie verschlossen; die Gegenfarbentheorie erklärt es über die Ermüdung einer Komponente."}, {"t": "Im RGB-Modell gelten Rot–Grün, Blau–Gelb sowie Schwarz–Weiß als Komplementärfarbenpaare.", "c": false, "fb": "Diese Paare stammen aus Herings Gegenfarbentheorie. Im RGB-Modell sind es Rot–Cyan, Grün–Magenta und Blau–Gelb."}, {"t": "Nach Hering reagiert die Rot-Grün-Einheit auf Rot mit einer Erhöhung und auf Grün mit einer Verminderung der Aktivität.", "c": true, "fb": "Da eine Einheit nicht gleichzeitig erhöht und vermindert reagieren kann, ist ein grünliches Rot nicht wahrnehmbar."}], "concept": {"title": "Zwei Theorien des Farbensehens und die Komplementärfarben", "points": ["<b>Physikalische Basis</b>: Das menschliche Auge nimmt Wellenlängen von etwa 400–700 nm wahr; 500–570 nm werden als Grün gesehen. Lichtintensität = <b>Helligkeit</b>, Reinheit = <b>Sättigung</b>.", "<b>Dreifarbentheorie</b> (Young, weitergeführt von von Helmholtz): Jede Farbe ist eine Kombination von Licht in drei Wellenlängen; drei Rezeptorsysteme mit unterschiedlicher spektraler Empfindlichkeit — heute bestätigt durch drei Zapfentypen. Farbblindheit entsteht durch Ausfall oder Fehlen von Rezeptortypen.", "<b>Gegenfarbentheorie</b> (Hering): drei gegensätzlich wirkende Einheiten — Rot–Grün, Blau–Gelb, Schwarz–Weiß. Die Rot-Grün-Einheit reagiert auf Rot mit erhöhter, auf Grün mit verminderter Aktivität.", "<b>Konsequenz daraus</b>: kein grünliches Rot, wohl aber ein grünliches Blau — wenn beide Einheiten geringe Aktivität zeigen.", "<b>Nachbilder</b>: erklärbar über die Gegenfarbentheorie — eine Komponente ermüdet, die andere ist bei neutraler Reizung aktiver.", "<b>Komplementärfarben</b>: Farbpaare, die kombiniert Weiß oder Grau ergeben. Bei Hering Rot–Grün, Blau–Gelb, Schwarz–Weiß; im RGB-Modell dagegen Rot–Cyan, Grün–Magenta und Blau–Gelb (Pinel et al., 2019)."]}}, {"id": "k5-04162176fc", "kap": 5, "sec": "5.4.2 Drei-Speicher-Modell", "stem": "Welche Aussagen zum Drei-Speicher-Modell von Atkinson und Shiffrin (1968) treffen zu?", "opts": [{"t": "Ohne Kontrollprozesse stehen Informationen im Kurzzeitspeicher noch etwa fünf Minuten zur Verfügung.", "c": false, "fb": "Nach etwa 30 Sekunden zerfallen sie oder werden durch neue Informationen verdrängt."}, {"t": "Im ikonischen Register werden visuelle, im echoischen Register auditive Informationen gehalten.", "c": true, "fb": "Der sensorische Speicher besteht aus solchen modalitätsspezifischen Registern; auch für die übrigen Sinne werden sie angenommen."}, {"t": "Der sensorische Speicher verfügt über eine enorme Kapazität, hält seine Inhalte aber nur sehr kurz.", "c": true, "fb": "Nur die beachteten Informationen gelangen weiter — der Großteil zerfällt (Pastötter, Oberauer & Bäuml, 2018)."}, {"t": "Kritisiert wurde vor allem die zentrale Stellung des Kurzzeitspeichers, den nach dem Modell sämtliche neuen Informationen passieren müssen.", "c": true, "fb": "Personen mit stark reduzierter verbaler Kurzzeitspanne konnten dennoch Sprache verstehen und Neues lernen."}], "concept": {"title": "Das Drei-Speicher-Modell (Atkinson & Shiffrin, 1968)", "points": ["<b>Sensorischer Speicher</b>: modalitätsspezifische Register — ikonisch für visuelle, echoisch für auditive Information; enorme Kapazität, sehr kurze Dauer. Nur Beachtetes gelangt weiter, der Rest zerfällt.", "<b>Kurzzeitspeicher</b>: erhält Informationen aus dem sensorischen <i>und</i> aus dem Langzeitspeicher; ohne Kontrollprozesse zerfallen sie nach etwa <b>30 Sekunden</b> oder werden verdrängt.", "<b>Kontrollprozesse</b>: aktives Wiederholen sowie Verknüpfen der Inhalte untereinander oder mit Langzeitwissen überführen Information in den Langzeitspeicher.", "<b>Langzeitspeicher</b>: theoretisch zeitlich unbegrenzt; Erinnern kann dennoch am Wiederauffinden oder an <b>Interferenz</b> mit ähnlichen Inhalten scheitern.", "<b>Verlustmechanismen im Modell</b>: Zerfall (sensorisch) · Verdrängung (Kurzzeitspeicher) · Interferenz (Langzeitspeicher).", "<b>Kritik</b>: die Schlüsselstellung des Kurzzeitspeichers. Personen mit stark reduzierter verbaler Kurzzeitspanne lernten dennoch Neues, und Wortlisteneffekte belegen eine enge Wechselbeziehung zum Langzeitwissen (Pastötter et al., 2018)."]}}, {"id": "k6-e237ce06ef", "kap": 6, "sec": "6.3.1 Piaget – Stadien", "stem": "Welche Zuordnungen zu Piagets Entwicklungsstadien treffen zu?", "opts": [{"t": "Im präoperatorischen Stadium gelingt es dem Kind erstmals, logische Schlussfolgerungen rein auf gedanklicher Basis abzuleiten – etwa den eigenen Heimweg in eine Karte einzuzeichnen.", "c": false, "fb": "Die beschriebene Leistung gehört zum konkret-operatorischen Stadium (ca. 7–11 Jahre). Das präoperatorische Stadium ist durch den rasanten Spracherwerb und einfache mentale Operationen gekennzeichnet."}, {"t": "Das sensumotorische Stadium reicht von der Geburt bis etwa zum zweiten Lebensjahr; Intelligenz zeigt sich hier vor allem über sensorische und motorische Fähigkeiten.", "c": true, "fb": "Fühlen, Greifen, Schmecken, Riechen und Sehen stehen im Zentrum, das Kind ist stark im Hier und Jetzt verankert."}, {"t": "Als Errungenschaft des konkret-operatorischen Stadiums gilt der Spracherwerb.", "c": false, "fb": "Der Spracherwerb ist die Errungenschaft des präoperatorischen Stadiums; konkret-operatorisch sind die Prinzipien der Erhaltung von Zahlen, Masse und Gewicht."}, {"t": "Im formal-operatorischen Stadium wenden Jugendliche zunehmend fortgeschrittene deduktive Logik an, etwa Schlüsse der Form „Wenn A, dann B“ und „nicht B“ → „nicht A“.", "c": true, "fb": "Ab etwa 11 Jahren kommen abstraktes Denken und hypothetisches Schlussfolgern hinzu; die eigene Wirklichkeit wird als eine von mehreren möglichen begriffen."}], "concept": {"title": "Die vier Entwicklungsstadien nach Piaget (Tabelle 6.3)", "points": ["<b>Sensumotorisch (Geburt–2 J.)</b>: Welt über basale Sinneswahrnehmung und Motorik, Zirkulärreaktionen, erste Schemata. Errungenschaft: <b>Objektpermanenz</b>.", "<b>Präoperatorisch (2–7 J.)</b>: rasante Sprachentwicklung, simple mentale Operationen, Animismus und Realismus. Errungenschaft: <b>Spracherwerb</b>.", "<b>Konkret-operatorisch (7–11 J.)</b>: logisches Denken auf Basis gedanklicher Vorgänge, Reversibilität. Errungenschaft: <b>Gesetz der Erhaltung / Invarianzprinzip</b>.", "<b>Formal-operatorisch (ab 11 J. bis Erwachsenenalter)</b>: abstrakte, hypothetische Konzepte, deduktive Logik, ethische und wissenschaftliche Fragestellungen. Errungenschaft: <b>abstrakte Logik</b>.", "<b>Stadienlogik</b>: diskontinuierlicher Sprung von einer kohärenten Art des Verstehens zur nächsthöheren; Reihenfolge bei allen Menschen gleich, Übergangszeiten kurz, jede Stufe qualitativ neu und kontextübergreifend sichtbar.", "<b>Merkregel</b>: Das Stadium bestimmt sich nicht nur über das Erreichte, sondern auch darüber, dass die Errungenschaft des Folgestadiums noch fehlt."]}}, {"id": "k6-1acaeb5b6d", "kap": 6, "sec": "6.4.1 Bindung", "stem": "Welche Aussage über die vier Bindungstypen aus der Fremde-Situation ist korrekt?", "opts": [{"t": "Bindungstyp A (unsicher-vermeidend) zeigt sich darin, dass das Kind nach der Rückkehr der Bezugsperson Trost sucht, diesen aber nicht annehmen kann.", "c": false, "fb": "Das beschreibt Typ C (unsicher-ambivalent). Typ-A-Kinder holen sich gerade keinen Trost und vermeiden es, Gefühle zu zeigen."}, {"t": "Als sichere Bindung gelten die Typen A und B, während C und D als unsicher eingestuft werden.", "c": false, "fb": "Nur Typ B gilt als sichere Bindung; A, C und D werden als unsichere Bindungen bezeichnet."}, {"t": "Kinder des Typs A wirken nach außen ruhig, weisen über das Speichel-Cortisol gemessen aber ein sehr hohes Stressniveau auf.", "c": true, "fb": "Die Speichelentnahmen zeigten die Diskrepanz zwischen äußerlicher Ruhe und tatsächlicher Stressbelastung – ein zentrales Argument dafür, dass Typ A nicht das gesunde Muster ist."}, {"t": "Bindungstyp D wurde 1978 von Ainsworth, Blehar, Waters und Wall als vierter Typ ergänzt.", "c": false, "fb": "Der desorganisierte Typ wurde erst 1990 von Mary Main und Judit Solomon hinzugefügt; 1978 stammt die Typologie A–C."}], "concept": {"title": "Bindungstypen nach Ainsworth (Ainsworth, Blehar, Waters & Wall, 1978; Typ D: Main & Solomon, 1990)", "points": ["<b>Typ A – unsicher-vermeidend</b>: äußerlich ruhig, sucht keinen Trost, vermeidet Gefühlsausdruck. Erfahrung: Bezugsperson reagiert nicht zuverlässig, Trostsuche „lohnt nicht“.", "<b>Typ B – sicher gebunden</b>: weint beim Verlassen, sucht sofort Kontakt bei Rückkehr, lässt sich beruhigen. Eltern agieren vorrangig autonom und haben sich aus der eigenen Elternbeziehung gelöst.", "<b>Typ C – unsicher-ambivalent</b>: kann nach der Rückkehr nicht entspannen, sucht Trost, nimmt ihn aber nicht an. Vorerfahrung: ambivalente, von liebevoll bis abweisend schwankende Reaktionen; Eltern oft noch in der Beziehung zu den eigenen Eltern verhaftet.", "<b>Typ D – unsicher-desorganisiert</b>: konfuses Verhalten, Schreien am Boden, „Einfrieren“, mitunter Aggression. Annahme: Traumatisierungen in den ersten Lebensmonaten, unvorhersagbares Elternverhalten.", "<b>Sicher vs. unsicher</b>: nur B ist sicher; A, C und D sind unsicher. Die Buchstabenfolge ist historisch – A wirkte nach außen ruhiger als das weinende B.", "<b>Befundlage</b>: Gültigkeit über Kulturen hinweg gezeigt; Sensitivität der Bindungsperson als zentraler Umweltfaktor; die Bindungsperson muss nicht die Mutter sein."]}}, {"id": "k6-46ae387ed3", "kap": 6, "sec": "6.2.1 Pränatale Entwicklung", "stem": "Welche Aussagen über Teratogene und sensible Phasen treffen zu?", "opts": [{"t": "Teratogene können biologischer, physikalischer oder chemischer Natur sein; dazu zählen unter anderem Erkrankungen der Mutter, ionisierende Strahlung und Luftverschmutzung.", "c": true, "fb": "Teratogene sind Umwelteinflüsse, die die gesunde Entwicklung des Fötus beeinträchtigen und Schädigungen des Organismus verursachen können; Suchtmittelkonsum der Mutter gehört ebenfalls dazu."}, {"t": "Wie schwer die Folgen ausfallen, hängt allein vom Zeitpunkt der Einwirkung ab.", "c": false, "fb": "Neben dem Zeitpunkt bestimmen auch Menge und Dauer des schädlichen Einflusses mit, wie schwerwiegend die Folgen für das Kind sind."}, {"t": "Als sensible Phasen gelten meist Zeiträume starken Wachstums, in denen das Ungeborene besonders empfindlich reagiert.", "c": true, "fb": "Das Kind ist zu verschiedenen Zeitpunkten im Mutterleib unterschiedlich anfällig; Wachstumsphasen sind besonders verletzlich."}, {"t": "Ein niedriger sozioökonomischer Status kann über Mangelernährung der Mutter zu einer Unterversorgung des Kindes führen.", "c": true, "fb": "Finanzielle Not oder Obdachlosigkeit wirken über die Ernährung der Mutter auf das Ungeborene; auch chronischer Stress und Missbrauch sind nachweislich schädlich."}], "concept": {"title": "Teratogene und ihre Wirkbedingungen", "points": ["<b>Definition</b>: Umwelteinflüsse, die die gesunde Entwicklung des Fötus beeinträchtigen und Schädigungen des Organismus verursachen können – biologisch, physikalisch oder chemisch.", "<b>Beispiele</b>: Erkrankungen der Mutter, Luftverschmutzung, ionisierende Strahlung, Suchtmittelkonsum der Mutter.", "<b>Sensible Phasen</b>: Zeitfenster besonders negativer Auswirkungen, meist Phasen starken Wachstums.", "<b>Dosis und Dauer</b>: Menge und Dauer der Einwirkung bestimmen die Schwere der Folgen mit.", "<b>Fehlbildungen</b>: kleinere morphologische Defekte sind kosmetischer Natur (z. B. zusätzliche Brustwarze, kurze Finger); große Defekte beeinträchtigen Lebensfähigkeit oder Funktionalität und sind teils interventionsbedürftig (z. B. Herzinsuffizienz, Gliedmaßenfehlbildungen). In Deutschland jährlich circa 49.000 Kinder mit großen Fehlbildungen.", "<b>Psychosoziale Belastung</b>: pränataler Stress wurde mit Angstzuständen, Depressionen und Aufmerksamkeitsdefiziten bei Kindern in Zusammenhang gebracht (Weinstock, 2007)."]}}, {"id": "k6-1196795eb0", "kap": 6, "sec": "6.2.4 Erwachsenenalter (körperlich)", "stem": "Welche Aussagen zur Menopause und den zugrunde liegenden Prozessen treffen zu?", "opts": [{"t": "Die Menopause ist definiert als der Zeitpunkt 12 Monate nach der letzten Regelblutung.", "c": true, "fb": "Sie tritt meist im mittleren Erwachsenenalter, durchschnittlich um das 50. Lebensjahr, ein; davor wird die Periode in der Perimenopause bereits seltener."}, {"t": "Bei der Geburt sind etwa 1 bis 2 Milliarden Eizellen angelegt.", "c": false, "fb": "Angelegt sind etwa 1 bis 2 Millionen Eizellen – die Größenordnung ist um den Faktor tausend zu hoch."}, {"t": "Als Atresie bezeichnet man den monatlichen Verlust von etwa 1000 Eizellen, der unabhängig vom Menstruationszyklus abläuft.", "c": true, "fb": "Sinkt die Zahl so weit, dass kein Eisprung mehr möglich ist, kommt es zur Menopause."}, {"t": "Für die Produktion von Östradiol und Progesteron sind die Eizellen selbst zuständig, weshalb die Hormonproduktion langsam und gleichmäßig ausläuft.", "c": false, "fb": "Zuständig sind die Follikel, welche die Eizellen umgeben; der Hormonabfall erfolgt – je nachdem, wie abrupt die Periode ausbleibt – eher abrupt."}], "concept": {"title": "Hormonelle Umstellung im Erwachsenenalter", "points": ["<b>Menopause</b>: Zeitpunkt 12 Monate nach der letzten Regelblutung, durchschnittlich um das 50. Lebensjahr; vorgeschaltet die <b>Perimenopause</b> mit seltener werdender Periode.", "<b>Ursache</b>: Reduktion der Keimzellen. Eizellen sind vollständig vor der Geburt angelegt (etwa 1–2 Millionen), monatlich gehen rund 1000 verloren (<b>Atresie</b>).", "<b>Hormonproduktion</b>: die <b>Follikel</b> um die Eizellen produzieren Östradiol und Progesteron – mit der Menopause fällt die Produktion eher abrupt ab.", "<b>Andropause</b>: Testosteronabfall ab etwa dem 30. bis 40. Lebensjahr, bei 20–30 % der Männer mit körperlichen und psychischen Symptomen; Spermien werden lebenslang produziert.", "<b>Beschwerden beider Geschlechter</b>: Antriebsschwäche, Hitzewallungen, Schlafstörungen, depressive Verstimmungen, geringere sexuelle Lust, Erektionsstörungen (Penis wie Klitoris).", "<b>Merkregel</b>: Die Menopause hat erkennbaren Start, kürzere Dauer und einen Abschluss – die Andropause nicht, weshalb ihre Beschwerden oft als Altersschwächen gedeutet werden."]}}, {"id": "k6-e481e5a736", "kap": 6, "sec": "6.2.4 Erwachsenenalter (körperlich)", "stem": "Welche Aussagen zum Inflammaging treffen zu?", "opts": [{"t": "Inflammaging bezeichnet chronische, unterschwellige Entzündungen, die mit zunehmendem Alter auftreten können.", "c": true, "fb": "Das menschliche Immunsystem verändert sich mit dem Alter; unterschwellige Dauerentzündung ist die Folge."}, {"t": "Der Begriff ist aus den englischen Wörtern für Entzündung und Altern zusammengesetzt.", "c": true, "fb": "Inflammation und Aging ergeben Inflammaging – die Wortbildung ist selbst prüfbarer Stoff."}, {"t": "Vermutet wird ein Zusammenhang mit altersbedingten Erkrankungen wie Arteriosklerose, Morbus Alzheimer und Diabetes mellitus 2.", "c": true, "fb": "Ginsburg, Vennos und Koren (2008) bringen Inflammaging mit einer Vielzahl altersbedingter Krankheiten in Verbindung bzw. sehen es als begünstigenden Faktor."}, {"t": "Im Verlauf des Alterungsprozesses werden zunehmend entzündungsfördernde Botenstoffe freigesetzt.", "c": true, "fb": "Genau diese altersbedingte Veränderung des Immunsystems beschreibt Franceschi (2007) mit dem Begriff."}], "concept": {"title": "Inflammaging (Franceschi, 2007; Ginsburg, Vennos & Koren, 2008)", "points": ["<b>Wortbildung</b>: inflammation (Entzündung) + aging (Altern) → Inflammaging.", "<b>Mechanismus</b>: altersbedingte Veränderung des Immunsystems, zunehmende Freisetzung entzündungsfördernder Botenstoffe.", "<b>Charakter</b>: chronische, unterschwellige Entzündung – nicht ein akuter Entzündungsschub.", "<b>Assoziierte Krankheiten</b>: Arteriosklerose, Morbus Alzheimer, Diabetes mellitus 2.", "<b>Einordnung</b>: gehört zu den physiologischen Rückbildungsprozessen des Erwachsenenalters, neben dem langsamen Abbau von Reaktionszeit und Muskelkraft.", "<b>Körpererleben</b>: Personen über 60 Jahren berichten stärkere Unsicherheit und Besorgnis gegenüber dem eigenen Körper als Personen unter 60 (Gunzelmann et al., 1999)."]}}, {"id": "k6-bfc3ad7c28", "kap": 6, "sec": "6.3.1 Piaget – Lernprinzipien", "stem": "Welche Aussage zu Assimilation, Akkommodation und Schemata ist korrekt?", "opts": [{"t": "Assimilation bezeichnet die Veränderung bereits vorhandener Schemata, damit sie zu einer neuen Information passen.", "c": false, "fb": "Das ist die Definition der Akkommodation. Bei der Assimilation wird die neue Information in ein bestehendes Schema eingeordnet."}, {"t": "Schemata sind angeborene Denkstrukturen, die über die Entwicklung hinweg stabil bleiben.", "c": false, "fb": "Schemata entwickelt ein Mensch aufgrund seiner Erfahrungen; im Laufe der Entwicklung werden diese Denkmuster immer komplexer."}, {"t": "Ordnet ein Kind eine unbekannte Katze seinem bestehenden Schema „Hund“ zu, spricht Piaget von Akkommodation.", "c": false, "fb": "Das Einordnen in ein vorhandenes Schema ist Assimilation – die Bezeichnung ist hier mit dem Gegenbegriff etikettiert."}, {"t": "Erklärt jemand dem Kind, dass auch Katzen vier Beine und Fell haben, und passt das Kind daraufhin sein Schema an, handelt es sich um Akkommodation.", "c": true, "fb": "Das neue Schema besagt nicht mehr, dass alle Tiere mit vier Beinen und Fell Hunde sind – das vorhandene Schema wurde an die Umwelt angepasst."}], "concept": {"title": "Piagets konstruktivistisches Lernmodell", "points": ["<b>Schemata</b>: mentale Strukturen oder Muster, die aufgrund von Erfahrungen entwickelt werden und auf deren Basis Informationen organisiert und interpretiert werden; sie werden zunehmend komplexer.", "<b>Assimilation</b>: neue Information wird in bereits existente Schemata integriert – das Schema bleibt, die Information wird eingepasst.", "<b>Akkommodation</b>: neue Information führt zur Anpassung existenter Schemata – die Information bleibt, das Schema verändert sich.", "<b>Konstruktivismus</b>: Kinder sind denkende und erkennende Wesen, die eigenes Wissen und ihre eigene Wirklichkeit konstruieren; sie sind eigenständig und von sich aus motiviert zu lernen.", "<b>„Kinder als Wissenschafter“</b>: Sie bilden Hypothesen über ihre Umgebung und experimentieren („Was passiert, wenn ich den Brei auf den Boden werfe?“).", "<b>Merkregel</b>: Assimilation – die Welt passt sich dem Kopf an; Akkommodation – der Kopf passt sich der Welt an."]}}, {"id": "k6-9df8bd29bd", "kap": 6, "sec": "6.3.2 Theory of Mind", "stem": "Welche Aussagen zur Theory of Mind und zur False-Belief-Aufgabe treffen zu?", "opts": [{"t": "Die False-Belief-Aufgabe („Maxi-Aufgabe“) wurde von den österreichischen Psychologen Heinz Wimmer und Josef Perner entwickelt.", "c": true, "fb": "Sie ist das typische Verfahren, um die Zuschreibung mentaler Zustände zu prüfen."}, {"t": "Kinder ohne Theory of Mind nennen in der Maxi-Aufgabe den grünen Schrank.", "c": false, "fb": "Richtungsumkehr: Wer noch keine mentalen Zustände zuschreiben kann, antwortet auf Basis des eigenen Weltwissens mit dem blauen Schrank. Der grüne Schrank ist die Antwort der Kinder, die Maxis falsche Überzeugung verstehen."}, {"t": "Die Fähigkeit, sich selbst und anderen mentale Zustände zuzuschreiben, entsteht in der Regel erst mit etwa sieben Jahren.", "c": false, "fb": "Kinder sind dazu ab ungefähr 4 Jahren in der Lage; sechs Jahre ist das Alter, ab dem in der Studie fast alle Kinder die Aufgabe lösten."}, {"t": "In der Studie von Wimmer und Perner (1983) lösten fast alle Kinder ab sechs Jahren die Aufgabe korrekt, während der Großteil der 3- bis 4-Jährigen daran scheiterte.", "c": true, "fb": "Dieser Alterseffekt ist der Ausgangspunkt der gezielten Variationen der Aufgabe, mit denen seither untersucht wird, worauf der Unterschied genau beruht."}], "concept": {"title": "Theory of Mind und die False-Belief-Aufgabe (Wimmer & Perner, 1983)", "points": ["<b>Theory of Mind</b>: Fähigkeit, sich selbst und anderen mentale Zustände wie Wünsche und Überzeugungen zuzuschreiben – und zu verstehen, dass sich diese von den eigenen unterscheiden können. Ab ungefähr 4 Jahren.", "<b>Aufbau der Aufgabe</b>: Maxi verstaut Schokolade im grünen Küchenschrank und geht auf den Spielplatz. Die Mutter verlegt sie in den blauen Schrank. Frage: Wo wird Maxi suchen?", "<b>Lösung mit Theory of Mind</b>: grüner Schrank – das Kind trennt Maxis (falsche) Überzeugung von der eigenen Kenntnis der Lage.", "<b>Lösung ohne Theory of Mind</b>: blauer Schrank – das Kind projiziert das eigene Wissen über die Welt auf Maxi.", "<b>Befund</b>: fast alle Kinder ab sechs Jahren lösen die Aufgabe, der Großteil der 3- bis 4-Jährigen nicht.", "<b>Abgrenzung</b>: Die Aufgabe stammt nicht von Piaget – dort gehören Objektpermanenz, Animismus und Realismus zum Repertoire."]}}, {"id": "k6-6798321685", "kap": 6, "sec": "6.3.3 Kohlberg – Moral", "stem": "Welche Aussagen entsprechen Kohlbergs Regeln zur moralischen Entwicklung?", "opts": [{"t": "Eine Person kann je nach Situation gleichzeitig auf mehreren der sechs Stufen argumentieren.", "c": false, "fb": "Kohlbergs erste Regel besagt ausdrücklich, dass eine Person zu einem bestimmten Zeitpunkt nur auf einer der sechs Stufen steht."}, {"t": "Die Abfolge der Stufen verläuft für jede Person gleich.", "c": true, "fb": "Diese Annahme übernimmt Kohlberg von Piagets Stadienlogik, die ihn zu seinem Modell inspirierte."}, {"t": "Jede Stufe stellt eine neue Denkweise dar: Die Begründung des moralischen Handelns wird immer komplexer.", "c": true, "fb": "Deshalb war für Kohlberg bei den meisten Niveaus nicht die Entscheidung selbst relevant, sondern deren Begründung."}, {"t": "Die Stufen sollen für Menschen aus allen Kulturen gleich sein.", "c": true, "fb": "Genau an dieser Universalitätsannahme setzt die spätere Kritik an, Kohlberg habe seine Theorie auf westlichen Moralkonzepten aufgebaut."}], "concept": {"title": "Kohlbergs Theorie der moralischen Entwicklung (1969, 1996)", "points": ["<b>Ausgangsmaterial</b>: das <b>Heinz-Dilemma</b> – Medikament stehlen oder die Frau sterben lassen. Die Niveaus leitete Kohlberg aus den Begründungen von Schülern ab.", "<b>Regel 1</b>: Eine Person steht zu einem Zeitpunkt nur auf einer der sechs Stufen.", "<b>Regel 2</b>: Die Abfolge der Stufen ist für jede Person gleich.", "<b>Regel 3</b>: Jede Stufe ist eine neue Denkweise; die Begründung wird zunehmend komplexer.", "<b>Regel 4</b>: Die Stufen sind für alle Menschen aus allen Kulturen gleich.", "<b>Kritik</b>: Gilligan (1982) – Vernachlässigung der weiblichen Perspektive (Moral der Fürsorge vs. Moral der Gerechtigkeit); Jaffee & Hyde (2000) – Unterschiede vorhanden, aber klein; Snell (1996) – Instrumente zielen auf westliche Zeichen moralischen Handelns."]}}, {"id": "k6-88b56363d3", "kap": 6, "sec": "6.2.3 Adoleszenz (körperlich)", "stem": "Welche Aussage zu primären und sekundären Geschlechtsmerkmalen ist korrekt?", "opts": [{"t": "Sekundäre Geschlechtsmerkmale sind genetisch determinierte Merkmale, die für die Fortpflanzung notwendig sind.", "c": false, "fb": "Diese Definition gehört zu den primären Geschlechtsmerkmalen; sekundäre Merkmale symbolisieren die Geschlechtsreife nach außen."}, {"t": "Primäre Geschlechtsmerkmale sind die inneren und äußeren Geschlechtsorgane, etwa Vulva, Vagina, Gebärmutter und Eierstöcke beziehungsweise Penis und Hoden.", "c": true, "fb": "Sie sind genetisch determiniert und für die Fortpflanzung notwendig – eine Definition, die bewusst absolut formuliert ist."}, {"t": "Die sekundären Geschlechtsmerkmale sind bei der Geburt bereits vollständig ausgebildet und werden in der Pubertät lediglich sichtbar.", "c": false, "fb": "Sie bilden sich erst in der Pubertät heran – Brustentwicklung, Bartwuchs, Tieferwerden der Stimme, Intimbehaarung."}, {"t": "Sekundäre Geschlechtsmerkmale entstehen unabhängig von den Geschlechtshormonen.", "c": false, "fb": "Gerade die Geschlechtshormone führen zu ihrer Ausbildung: Testosteron bei Buben, Östrogen und Progesteron bei Mädchen."}], "concept": {"title": "Primäre und sekundäre Geschlechtsmerkmale (Infobox 6.2)", "points": ["<b>Primär</b>: innere und äußere Geschlechtsorgane – Vulva, Vagina, Gebärmutter, Eierstöcke bzw. Penis und Hoden. Genetisch determiniert, für die Fortpflanzung notwendig.", "<b>Sekundär</b>: nach außen hin erkennbare Veränderungen, die die Geschlechtsreife symbolisieren – Brustentwicklung, Bartwuchs, Tieferwerden der Stimme, Intimbehaarung.", "<b>Auslöser</b>: Geschlechtshormone führen zur Ausbildu
