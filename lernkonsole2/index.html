ößere Person höhere Zahl.", "<b>Daten</b>: die so gewonnenen Messungen (Tabelle 3.1).", "<b>Messinstrumente in der Psychologie</b>: Fragebögen, psychologische Tests und Apparaturen für Puls, Gehirnaktivität oder Hormonspiegel.", "<b>Psychologische Tests</b>: erfassen Ausprägungen latenter Merkmale, indem Aufgaben bearbeitet werden, die den Einsatz dieser Merkmale erfordern (Döring, 2023) — etwa Kurzzeitgedächtnisaufgaben.", "<b>Objektivität</b>: Das Ergebnis hängt nicht davon ab, welche Versuchsleitung misst — betrifft Durchführung, Auswertung und Interpretation.", "<b>Reliabilität und Validität</b>: Zuverlässigkeit/Messgenauigkeit (gleiche Ergebnisse bei Wiederholung) bzw. die Frage, ob inhaltlich gemessen wird, was gemessen werden soll — der Puls etwa ist auch durch Nervosität oder Bewegung beeinflusst."]}}, {"id": "k3-62bfd7cac6", "kap": 3, "sec": "3.3 Operationalisierung & Untersuchungsplanung", "stem": "Welche Aussagen zu Population und Stichprobe treffen zu?", "opts": [{"t": "In der psychologischen Forschung ist die Vollerhebung der Regelfall, weil Stichproben zu ungenaue Schätzungen liefern.", "c": false, "fb": "Eine Vollerhebung, bei der alle Angehörigen der Population untersucht werden, ist annähernd nie möglich — deshalb wird mit Stichproben gearbeitet."}, {"t": "Die Gesamtheit der Fälle, über die in einer Studie etwas ausgesagt werden soll, wird als Population oder Grundgesamtheit bezeichnet.", "c": true, "fb": "Die Population kann eng definiert sein, etwa alle in Österreich lebenden Frauen zwischen 18 und 25 Jahren."}, {"t": "Bei einer Zufallsstichprobe hat jede Person, die der Population angehört, die gleiche Chance, in die Stichprobe aufgenommen zu werden.", "c": true, "fb": "In der Praxis ist diese Forderung meist schwer umzusetzen — etwa weil nicht alle Angeschriebenen antworten."}, {"t": "Repräsentiert die Stichprobe die Population, stellt sie hinsichtlich der untersuchten Merkmale eine Art Miniaturabbild der Population dar.", "c": true, "fb": "Nur dann lassen sich die Ergebnisse auf die Population übertragen — Voraussetzung für die externe Validität."}], "concept": {"title": "Population, Stichprobe und Repräsentativität", "points": ["<b>Population (Grundgesamtheit)</b>: die Gesamtheit der Fälle, über die in einer Studie etwas ausgesagt werden soll — etwa alle in Österreich lebenden Frauen zwischen 18 und 25.", "<b>Stichprobe</b>: Teilmenge der Population, ausgewählt unter bestimmten Gesichtspunkten; die Personen darin heißen Versuchspersonen bzw. Proband:innen. Eine <b>Vollerhebung</b> ist in der Psychologie annähernd nie möglich.", "<b>Repräsentativität</b>: Die Stichprobe muss die erhobenen Merkmale der Population adäquat abbilden — dann ist sie ein „Miniaturabbild“ und Voraussetzung für die <b>externe Validität</b>.", "<b>Zufallsstichprobe</b>: Jede Person der Population hat die gleiche Chance, aufgenommen zu werden — in der Praxis meist schwer umsetzbar (nicht alle Angeschriebenen antworten).", "<b>Selection Bias</b>: Verzerrung, die entsteht, weil die Auswahl nicht völlig zufällig erfolgt ist — etwa wenn gerade Personen mit schlechterer psychischer Gesundheit nicht antworten.", "<b>Gelegenheitsstichproben und Umfang</b>: üblich wegen der einfacheren Umsetzung (Studierende, Online-Umfragen), aber als Schätzung für die Population ungeeignet. Mit dem <b>Stichprobenumfang</b> steigt die Aussagekraft, aber auch der Ressourcenverbrauch (Döring, 2023)."]}}, {"id": "k3-70ab5679b1", "kap": 3, "sec": "3.3 Operationalisierung & Untersuchungsplanung", "stem": "Welche Aussage zur Nominalskala trifft zu?", "opts": [{"t": "Die Nominalskala gilt als Skala mit dem höchsten Skalenniveau, weil sie die meisten Informationen enthält.", "c": false, "fb": "Umgekehrt: Sie hat das niedrigste Skalenniveau, weil sich aus den Daten nur Gleichheit oder Verschiedenheit ablesen lässt."}, {"t": "Bei nominalskalierten Daten lassen sich Größer-Kleiner-Gleich-Relationen abbilden.", "c": false, "fb": "Das leistet erst die Ordinalskala. Auf Nominalniveau existiert keine Rangordnung zwischen den Kategorien."}, {"t": "Dichotome Variablen sind ein Spezialfall ordinalskalierter Variablen mit genau zwei Ausprägungen.", "c": false, "fb": "Die Zahl der Ausprägungen stimmt, die Skala nicht: Dichotome Variablen sind ein Spezialfall der Nominalskala, etwa Erkrankung vorhanden/nicht vorhanden."}, {"t": "Bei einer Nominalskala könnte man den Kategorien auch völlig andere Zahlen zuordnen, ohne dass sich an der Interpretation etwas ändert.", "c": true, "fb": "Ob Österreich = 1 und Deutschland = 2 oder umgekehrt, ist beliebig — die Zahlen drücken nur Gleichheit bzw. Verschiedenheit aus."}], "concept": {"title": "Die Nominalskala", "points": ["<b>Relation</b>: Im Vordergrund steht allein die Gleichheit bzw. Verschiedenheit von Objekten.", "<b>Niedrigstes Skalenniveau</b>: Aus den Daten lässt sich nur schließen, ob zwei Objekte dieselbe oder eine andere Merkmalsausprägung haben.", "<b>Willkürliche Zahlenzuordnung</b>: Österreich = 1 und Deutschland = 2 oder umgekehrt — es gibt keine Rangordnung, andere Zahlen änderten an der Interpretation nichts.", "<b>Beispiele</b>: Nationalität, Beruf, Vorhandensein bzw. Fehlen einer Erkrankung.", "<b>Dichotome Variablen</b>: Spezialfall der Nominalskala mit genau zwei Ausprägungen (0 = keine Erkrankung, 1 = Erkrankung).", "<b>Abgrenzung</b>: Größer-Kleiner-Gleich-Relationen leistet erst die Ordinalskala (Sedlmeier & Renkewitz, 2013)."]}}, {"id": "k3-4e850d0390", "kap": 3, "sec": "3.3 Operationalisierung & Untersuchungsplanung", "stem": "Welche Aussagen zur Unterscheidung kategorialer und kontinuierlicher Variablen treffen zu?", "opts": [{"t": "Bei kategorialen Variablen können beliebige Ausprägungen auf einem Kontinuum angenommen werden.", "c": false, "fb": "Das beschreibt kontinuierliche Variablen. Bei kategorialen Variablen ist nur eine abzählbare Menge von Ausprägungen möglich."}, {"t": "Variablen mit Intervall- oder Verhältnisskalenniveau zählen zu den kontinuierlichen Variablen.", "c": true, "fb": "Nominale und ordinale Variablen zählen dagegen zu den kategorialen."}, {"t": "Fragt man mit vier vorgegebenen Antwortkategorien nach der Putzhäufigkeit, entsteht eine kategoriale Variable — auch wenn das latente Merkmal „Reinlichkeit“ als quantitativ gilt.", "c": true, "fb": "Genau das zeigt Abbildung 3.6: Das Antwortformat entscheidet mit darüber, welche Art von Variable herauskommt."}, {"t": "Quantitative Merkmale werden im Zuge der Operationalisierung stets in kontinuierliche Variablen überführt.", "c": false, "fb": "Das ist zwar der gewöhnliche Fall, aber kein Muss — bei vorgegebenen Kategorien entsteht auch aus einem quantitativen Merkmal eine kategoriale Variable."}], "concept": {"title": "Kategoriale und kontinuierliche Variablen", "points": ["<b>Kategoriale Variablen</b>: nur eine abzählbare Menge von Ausprägungen in spezifischen Kategorien; die Zahl der Kategorien ist in der Regel begrenzt.", "<b>Kontinuierliche Variablen</b>: beliebige Ausprägungen auf einem Kontinuum.", "<b>Zuordnung</b>: nominale und ordinale Variablen sind kategorial, intervall- und verhältnisskalierte Variablen kontinuierlich.", "<b>Regelfall der Operationalisierung</b>: qualitative Merkmale werden in kategoriale, quantitative Merkmale in kontinuierliche Variablen überführt.", "<b>Ausnahme</b>: Je nach Operationalisierung und Messinstrument kann auch ein quantitatives Merkmal kategorial werden.", "<b>Beispiel (Abbildung 3.6)</b>: Vier vorgegebene Antwortkategorien zur Putzhäufigkeit ergeben eine kategoriale Variable — obwohl das latente Merkmal „Reinlichkeit“ quantitativ ist; ein offenes Antwortformat ergibt eine kontinuierliche Variable."]}}, {"id": "k3-98556af50b", "kap": 3, "sec": "3.3 Operationalisierung & Untersuchungsplanung", "stem": "Welche Aussagen über die Aussagekraft der verschiedenen Skalenniveaus treffen zu?", "opts": [{"t": "Intervallskalierte Daten erlauben Aussagen über die Gleichheit bzw. Verschiedenheit von Intervallen, aber keine Verhältnisaussagen.", "c": true, "fb": "Der Abstand zwischen 2 °C und 4 °C entspricht dem zwischen 6 °C und 8 °C — aber 8 °C ist nicht doppelt so warm wie 4 °C."}, {"t": "Ordinalskalierte Werte geben Aufschluss über die Rangordnung, nicht aber darüber, wie groß der Unterschied zwischen zwei Objekten ist.", "c": true, "fb": "Zwischen Pflichtschul- und Bachelorabschluss ist ein Rangunterschied feststellbar, der Abstand jedoch unbekannt."}, {"t": "Bei ordinalskalierten Merkmalen lässt sich kein sinnvolles arithmetisches Mittel bilden.", "c": true, "fb": "Das folgt direkt aus den unbekannten Abständen; das arithmetische Mittel setzt mindestens Intervallskalenniveau voraus."}, {"t": "Psychische Merkmale wie Intelligenz oder Gewissenhaftigkeit werden meist als verhältnisskalierte Variablen behandelt.", "c": false, "fb": "Sie werden meist als intervallskaliert behandelt, weil ein natürlicher Nullpunkt im Sinne von „keine Intelligenz“ fehlt."}], "concept": {"title": "Die vier Skalenniveaus im Vergleich (Tabelle 3.2)", "points": ["<b>Nominalskala</b>: Klassifikation in Kategorien; mögliche Aussagen betreffen nur Gleichheit bzw. Verschiedenheit (Beruf, Nationalität, dichotome Merkmale).", "<b>Ordinalskala</b>: Rangordnung ist definiert, Größer-Kleiner-Gleich-Relationen sind möglich — der Abstand zwischen den Ausprägungen bleibt jedoch unbekannt (Schulnoten, höchster Bildungsabschluss).", "<b>Folge daraus</b>: Bei ordinalskalierten Merkmalen lässt sich kein sinnvolles arithmetisches Mittel bilden.", "<b>Intervallskala</b>: Rangordnung <i>und</i> Abstände sind definiert — gleiche Messwertunterschiede bedeuten gleiche Merkmalsunterschiede; Verhältnisaussagen sind nicht zulässig (2 °C zu 4 °C wie 6 °C zu 8 °C, aber 8 °C ist nicht doppelt so warm wie 4 °C).", "<b>Verhältnisskala (Ratio-Skala)</b>: zusätzlich mit natürlichem Nullpunkt, daher sind auch Verhältnisse interpretierbar (Temperatur in Kelvin, Längen, Gewicht, Reaktionszeit — „dreimal so lang“).", "<b>Psychische Merkmale</b>: Intelligenz oder Gewissenhaftigkeit werden meist als intervallskaliert behandelt, weil ein natürlicher Nullpunkt im Sinne von „keine Intelligenz“ fehlt."]}}, {"id": "k3-1a16740cc6", "kap": 3, "sec": "3.3 Operationalisierung & Untersuchungsplanung", "stem": "Welche Aussage zum Studiendesign trifft zu?", "opts": [{"t": "Das Studiendesign ist von der Hypothese unabhängig und wird erst nach der Datenerhebung festgelegt.", "c": false, "fb": "Das Design ist maßgeblich von der Hypothese vorbestimmt und muss vor der Erhebung feststehen."}, {"t": "Liegt eine Unterschiedshypothese vor, genügt die Untersuchung einer einzigen Gruppe zu zwei Zeitpunkten.", "c": false, "fb": "Zwei Zeitpunkte braucht die Veränderungshypothese. Für eine Unterschiedshypothese müssen mehrere Gruppen gebildet werden."}, {"t": "Um die Effektivität einer Therapie zu untersuchen, sind mindestens zwei Messungen nötig: eine vor und eine nach der Therapie.", "c": true, "fb": "Nur so lässt sich feststellen, ob sich das Merkmal über die Zeit tatsächlich verändert hat."}, {"t": "Zum Studiendesign zählen zwar die Auswahl der Versuchspersonen und der zeitliche Horizont, nicht jedoch die Methoden der Datenerhebung.", "c": false, "fb": "Die Methoden der Datenerhebung gehören ausdrücklich mit dazu, ebenso die Wahl der Vergleichsgruppen."}], "concept": {"title": "Das Studiendesign (Sedlmeier & Renkewitz, 2013)", "points": ["<b>Inhalt</b>: Auswahl der Versuchspersonen, Wahl der zu vergleichenden Gruppen, Methoden der Datenerhebung und zeitlicher Horizont.", "<b>Bestimmt durch die Hypothese</b>: Eine Unterschiedshypothese verlangt mehrere Gruppen, die sich im ersten Merkmal unterscheiden; anschließend wird das zweite Merkmal verglichen.", "<b>Veränderungshypothese</b>: Das Merkmal muss zu verschiedenen Zeitpunkten erhoben werden — bei einer Therapiestudie mindestens vor und nach der Therapie.", "<b>Laboruntersuchung</b>: Die Versuchspersonen kommen ins Labor; Störfaktoren lassen sich besser kontrollieren.", "<b>Felduntersuchung</b>: Untersuchung in der natürlichen Umgebung — authentischeres Verhalten und bessere Übertragbarkeit, dafür schlechtere Kontrolle von Störfaktoren.", "<b>Bilanz</b>: Felduntersuchungen haben geringere interne und größere externe Validität als Laboruntersuchungen (Infobox 3.4)."]}}, {"id": "k3-02ab96f850", "kap": 3, "sec": "3.4 Experimentelle Methode", "stem": "Welche Aussagen zur Herstellung der Bedingungen im Experiment treffen zu?", "opts": [{"t": "Dass die Versuchsleitung die verschiedenen Ausprägungen der unabhängigen Variable herstellt, wird auch als Manipulation der unabhängigen Variable bezeichnet.", "c": true, "fb": "Realisiert wird das etwa dadurch, dass zwei Gruppen gebildet und die Versuchspersonen per Zufall zugeordnet werden."}, {"t": "Im Schlafdeprivationsbeispiel ist die Schlafdeprivation die unabhängige und die Reaktionszeit die abhängige Variable.", "c": true, "fb": "Die UV hat hier die Ausprägungen ja und nein; die Reaktionszeit hängt von ihr ab."}, {"t": "Ist die unabhängige Variable in einer Bedingung gegeben und in der anderen nicht, spricht man von Experimental- und Kontrollbedingung.", "c": true, "fb": "Die zugehörigen Personengruppen heißen entsprechend Experimental- und Kontrollgruppe."}, {"t": "Trotz Manipulation der unabhängigen Variable bleibt offen, ob die Kausalität nicht in die entgegengesetzte Richtung verläuft.", "c": false, "fb": "Gerade das schließt die Manipulation aus: Weil die Versuchsleitung die Schlafdauer vorgibt, kann die Reaktionszeit sie nicht verursacht haben."}], "concept": {"title": "Manipulation der unabhängigen Variable", "points": ["<b>Unabhängige Variable (UV)</b>: die vermutete Ursache, deren Ausprägungen von der Versuchsleitung hergestellt werden — man spricht von der <b>Manipulation</b> der UV.", "<b>Abhängige Variable (AV)</b>: die Variable, die mutmaßlich durch die UV beeinflusst wird — sie hängt von der UV ab.", "<b>Beispiel</b>: Schlafdeprivation als UV mit den Ausprägungen ja und nein, Reaktionszeit als AV; die Experimentalgruppe schläft höchstens vier Stunden, die Kontrollgruppe ausreichend.", "<b>Experimental- und Kontrollbedingung</b>: liegen vor, wenn die UV in einer Bedingung gegeben und in der anderen nicht gegeben ist; die zugehörigen Gruppen heißen Experimental- und Kontrollgruppe.", "<b>Leistung der Manipulation</b>: Sie schließt aus, dass die Kausalität in die entgegengesetzte Richtung verläuft — die Reaktionszeit kann die vorgegebene Schlafdauer nicht verursacht haben.", "<b>Between- vs. Within-Subjects-Design (Infobox 3.5)</b>: Bei Between-Designs wird per Zufall auf mehrere Gruppen aufgeteilt, bei Within-Designs durchlaufen alle Versuchspersonen alle Bedingungen — ökonomischer und datenreicher, aber ungeeignet, wenn Vorwissen über den Ablauf die AV beeinflusst."]}}, {"id": "k3-be1e43efff", "kap": 3, "sec": "3.4 Experimentelle Methode", "stem": "Welche Aussage zu den Voraussetzungen eines Kausalschlusses im Experiment trifft zu?", "opts": [{"t": "Ein Experiment liegt bereits dann vor, wenn zwischen zwei Variablen eine Kovariation nachgewiesen wurde.", "c": false, "fb": "Kovariation ist nur eine der Voraussetzungen. Ein Experiment verlangt zusätzlich die systematische Variation einer Variable und die Kontrolle von Störvariablen."}, {"t": "Der Ausschluss aller anderen Variablen als Ursache gilt als die am leichtesten zu erfüllende Voraussetzung eines Experiments.", "c": false, "fb": "Umgekehrt: Das ist ausdrücklich die schwierigste zu erfüllende Voraussetzung."}, {"t": "Die zeitliche Abfolge wird sichergestellt, indem die abhängige Variable vor der unabhängigen Variable erhoben wird.", "c": false, "fb": "Die Reihenfolge ist vertauscht — die vermutete Ursache muss der Wirkung vorausgehen, nicht umgekehrt."}, {"t": "Die zeitliche Abfolge wird dadurch sichergestellt, dass die vermutete Ursachenvariable systematisch variiert und ihr Effekt auf andere Variablen beobachtet wird.", "c": true, "fb": "Deshalb gelten Experimente als die aussagekräftigste Methode zur Prüfung von Ursache-Wirkungs-Hypothesen."}], "concept": {"title": "Die drei Voraussetzungen eines Kausalschlusses", "points": ["<b>Voraussetzung 1 — Kovariation</b>: Zwischen den beiden Variablen muss ein Zusammenhang bestehen (Infobox 3.3).", "<b>Voraussetzung 2 — zeitliche Abfolge</b>: Die verursachende Variable muss zeitlich vor der beeinflussten auftreten. Sichergestellt wird das, indem die vermutete Ursachenvariable systematisch variiert und ihr Effekt beobachtet wird.", "<b>Voraussetzung 3 — Ausschluss anderer Ursachen</b>: Alle anderen Variablen müssen als Ursache ausgeschlossen werden können — ausdrücklich die <i>schwierigste</i> zu erfüllende Voraussetzung.", "<b>Zwei Merkmale des Experiments</b>: mindestens eine Variable wird systematisch variiert, und die Wirkung von Störvariablen wird ausgeschaltet oder kontrolliert.", "<b>Ziel</b>: Experimente prüfen <b>Ursache-Wirkungs-Hypothesen</b> und gelten deshalb als die aussagekräftigste wissenschaftliche Methode.", "<b>Intern valide</b> heißt ein Experiment, wenn die für den Kausalschluss nötigen Bedingungen vollständig erfüllt sind (Renner et al., 2012; Grabowski et al., 2007)."]}}, {"id": "k3-a51910772c", "kap": 3, "sec": "3.4 Experimentelle Methode", "stem": "Welche Aussagen zur Reaktivität und ihrer Kontrolle treffen zu?", "opts": [{"t": "Eine Coverstory über den Untersuchungszweck kann die Reaktivität verringern, wirft aber ethische Fragen auf.", "c": true, "fb": "Versuchspersonen müssen grundsätzlich vor der Teilnahme über das Experiment aufgeklärt werden — daher der Konflikt."}, {"t": "Reaktive Verhaltensweisen gefährden in erster Linie die externe Validität.", "c": false, "fb": "Gefährdet ist die interne Validität, weil die Erwartung der Versuchspersonen einen konfundierenden Einfluss hat."}, {"t": "Schwer verfälschbare Maße wie bildgebende Verfahren oder Hormonspiegelmessungen können die Reaktivität verringern.", "c": true, "fb": "Sie entziehen sich der bewussten Steuerung durch die Versuchsperson."}, {"t": "Implizite Messverfahren wie der Implizite Assoziationstest erhöhen die Reaktivität, weil die Versuchspersonen ihre Antworten dabei bewusst steuern können.", "c": false, "fb": "Genau umgekehrt: Implizite Verfahren werden als Option genannt, um die Reaktivität zu verringern."}], "concept": {"title": "Reaktivität (Hawthorne-Effekt) und ihre Kontrolle", "points": ["<b>Reaktivität</b>: Schon das bloße Wissen, an einem Experiment teilzunehmen und beobachtet zu werden, verändert das Verhalten — man will etwa einen guten Eindruck hinterlassen.", "<b>Hawthorne-Effekt</b>: benannt nach den Experimenten von Roethlisberger und Dickson (1939), bei denen sich die Arbeitsleistung trotz verschlechterter Arbeitsbedingungen verbesserte (Hussy et al., 2013).", "<b>Einschränkung</b>: Ob es den Effekt in der ursprünglich angenommenen Form gibt, ist fraglich — er konnte nicht repliziert werden (Jones, 1992), hat die Arbeitswelt aber maßgeblich verändert.", "<b>Das Problem</b>: Reaktive Verhaltensweisen gefährden die <b>interne Validität</b>, weil die Erwartung der Versuchspersonen einen konfundierenden Einfluss hat.", "<b>Gegenmaßnahme 1 — Coverstory</b>: Der wahre Untersuchungszweck bleibt verborgen; ethisch heikel, weil grundsätzlich vorab aufzuklären ist.", "<b>Gegenmaßnahme 2 und 3</b>: schwer verfälschbare Maße (bildgebende Verfahren, Hormonspiegel) sowie implizite Messverfahren wie der Implizite Assoziationstest (IAT)."]}}, {"id": "k3-3d4e3576c0", "kap": 3, "sec": "3.4 Experimentelle Methode", "stem": "Welche Aussage zum Placebo-Effekt trifft zu?", "opts": [{"t": "Als Placebo bezeichnet man ein Medikament mit stark reduzierter Wirkstoffmenge.", "c": false, "fb": "Ein Placebo sieht aus wie ein Medikament, enthält aber keinerlei relevanten Wirkstoff."}, {"t": "Der Placebo-Effekt beschreibt eine positive Veränderung des Gesundheitszustands, die auf den psychosozialen Kontext der Behandlung zurückzuführen ist.", "c": true, "fb": "Dazu zählt insbesondere die Erwartung der Versuchsperson, das Medikament werde im erwünschten Sinn wirken."}, {"t": "Placebo-Effekte treten ausschließlich in der Medikamentenforschung auf.", "c": false, "fb": "Sie können in allen Forschungsbereichen auftreten, sobald jemand glaubt, eine wirksame Behandlung zu erfahren."}, {"t": "Beim Placebo-Effekt spielt die Erwartung der Versuchsperson keine Rolle, weil die Wirkung rein körperlich vermittelt ist.", "c": false, "fb": "Die Erwartung ist der Kern des Effekts — er wirkt wie eine selbsterfüllende Prophezeiung."}], "concept": {"title": "Placebo-Effekt, Nocebo-Effekt und Blindversuch", "points": ["<b>Placebo</b>: ein vermeintliches Medikament, das aussieht wie ein Medikament, aber keinerlei relevanten Wirkstoff enthält.", "<b>Placebo-Effekt</b>: positive Veränderung des Gesundheitszustands nach der Einnahme, zurückzuführen auf den psychosozialen Kontext der Behandlung — insbesondere die Erwartung, das Medikament werde im erwünschten Sinn wirken.", "<b>Nocebo-Effekt</b>: das Gegenstück — unerwünschte Wirkungen nach einer nicht wirksamen Behandlung.", "<b>Blindversuch</b>: Die Versuchspersonen wissen nicht, ob sie der Experimentalgruppe (echtes Medikament) oder der Kontrollgruppe (Placebo) angehören; über die Möglichkeit einer unwirksamen Behandlung muss aus ethischen Gründen vorab aufgeklärt werden.", "<b>Reichweite</b>: Placebo-Effekte sind nicht auf die Medikamentenforschung beschränkt — sie treten immer dann auf, wenn jemand eine wirksame Behandlung zu erfahren glaubt.", "<b>Selbsterfüllende Prophezeiung (Infobox 3.6)</b>: Die Erwartung lenkt die Aufmerksamkeit auf passende Veränderungen, die dann auch wahrgenommen werden (Merton, 1948; Gerrig et al., 2018)."]}}, {"id": "k3-3838c93f79", "kap": 3, "sec": "3.4 Experimentelle Methode", "stem": "Welche Aussagen zu Konfundierung und Störvariablenkontrolle treffen zu?", "opts": [{"t": "Eine Störvariable kommt als Alternativerklärung infrage, wenn zwischen ihr und der abhängigen Variable eine Kovariation besteht; man spricht dann von einer Konfundierung.", "c": true, "fb": "Beispiel: Ist eine Gruppe im Schnitt motivierter, kovariiert die Motivation sowohl mit der UV-Zuordnung als auch mit der Reaktionszeit."}, {"t": "Personengebundene Störvariablen wie Alter oder Motivation lassen sich besonders gut konstant halten.", "c": false, "fb": "Gerade bei Personenmerkmalen ist Konstanthaltung kaum möglich — deshalb versucht man sie zu balancieren."}, {"t": "Eine Variable gilt als balanciert, wenn sie in den verschiedenen Bedingungen des Experiments im Schnitt die gleiche Ausprägung aufweist.", "c": true, "fb": "Dann übt sie in allen Bedingungen einen ähnlichen Einfluss auf die AV aus und scheidet als konfundierende Variable aus."}, {"t": "In der Praxis lassen sich alle Merkmale der Untersuchungssituation durch Konstanthaltung kontrollieren.", "c": false, "fb": "Das ist kaum möglich. Man beschränkt sich auf Variablen, bei denen ein konfundierender Einfluss vermutet wird — etwa Tageszeit oder Anzahl der Personen im Raum."}], "concept": {"title": "Störvariablen, Konfundierung und ihre Kontrolle", "points": ["<b>Konfundierung</b>: Eine Störvariable kommt als Alternativerklärung infrage, wenn zwischen ihr und der abhängigen Variable eine Kovariation besteht — etwa eine im Schnitt motiviertere oder ältere Gruppe bei der Reaktionszeitaufgabe.", "<b>Konstanthaltung</b>: identischer Versuchsablauf, gleiche Instruktionen, gleicher Raum, gleiche Tageszeit. In der Praxis nicht für alle Merkmale möglich — man beschränkt sich auf Variablen mit vermutetem konfundierendem Einfluss.", "<b>Balancierung</b>: Eine Variable ist balanciert, wenn sie in den Bedingungen im Schnitt die gleiche Ausprägung aufweist und deshalb als konfundierende Variable ausscheidet — nötig vor allem bei personengebundenen Störvariablen wie Alter, Geschlecht, Intelligenz, Motivation.", "<b>Randomisierung</b>: die zufällige Zuweisung zu den Bedingungen — die wichtigste Methode der Balancierung; sie kontrolliert bei ausreichend großer Stichprobe alle personengebundenen Störvariablen, bekannte wie unbekannte.", "<b>Quasi-Experiment</b>: Untersuchungen, die alle Kriterien außer der Randomisierung erfüllen — etwa wenn die UV nicht manipulierbar ist (Vorliegen einer Erkrankung). Das geht mit Einbußen bei der internen Validität einher.", "<b>Parallelisieren</b>: gezielte Aufteilung nach vorab gemessenen Ausprägungen; sinnvoll bei kleinen Stichproben und bekanntem konfundierendem Einfluss, kontrolliert aber nur eine Störvariable. Ein Within-Subjects-Design entspricht einer perfekten Parallelisierung."]}}, {"id": "k3-4d240f4ecb", "kap": 3, "sec": "3.5 Deskriptive Statistik", "stem": "Welche Aussagen zu Histogrammen und zur Gruppierung von Messwerten treffen zu?", "opts": [{"t": "Bei Histogrammen sind auf der x-Achse die Ausprägungen der Variable und auf der y-Achse die jeweiligen Häufigkeiten aufgetragen.", "c": true, "fb": "So entsteht die grafische Veranschaulichung einer Häufigkeitsverteilung."}, {"t": "In Histogrammen dürfen ausschließlich absolute Häufigkeiten dargestellt werden.", "c": false, "fb": "Es können ebenso die relativen Anteile der Ausprägungen angegeben werden."}, {"t": "Die Breite der Intervalle wird unabhängig von der Stichprobengröße und der Variationsbreite der Messwerte festgelegt.", "c": false, "fb": "Beides fließt ausdrücklich ein: Enge bzw. Breite der Intervalle und damit die Anzahl der Kategorien werden davon abhängig gemacht."}, {"t": "Bei der Gruppierung kontinuierlicher Variablen sollten die Intervalle — mit Ausnahme der Randkategorien — möglichst gleich groß sein.", "c": true, "fb": "Die Gruppierung ist im Grunde willkürlich, folgt aber solchen Kriterien; typisch ist das bei der Variable Alter."}], "concept": {"title": "Häufigkeiten, Gruppierung und Histogramme", "points": ["<b>Absolute Häufigkeit</b>: Anzahl der Werte pro Variablenausprägung (10 Personen aus Österreich, 8 aus Deutschland, 2 aus der Schweiz).", "<b>Relative Häufigkeit</b>: Anteil an allen Werten — absolute Häufigkeit dividiert durch die Gesamtanzahl (10/20 = 0,50); die Summe der relativen Anteile beträgt immer 1. Mit 100 multipliziert ergeben sich die <b>prozentualen Häufigkeiten</b>.", "<b>Wichtig beim Berichten</b>: explizit angeben, ob absolute oder relative Häufigkeiten gemeint sind — Fehlinterpretationen beruhen oft auf dieser Vermischung.", "<b>Gruppierung</b>: Bei kontinuierlichen Variablen mit theoretisch unendlich vielen Ausprägungen werden Intervalle gebildet; typisch bei der Variable „Alter“.", "<b>Kriterien der Gruppierung</b>: im Grunde willkürlich, aber die Intervalle sollen — außer den Randkategorien — möglichst gleich groß sein, und Enge bzw. Breite werden von Stichprobengröße und Variationsbreite der Messwerte abhängig gemacht (Hussy et al., 2013).", "<b>Histogramm</b>: x-Achse die Ausprägungen, y-Achse die Häufigkeiten; darstellbar sind absolute Häufigkeiten ebenso wie relative Anteile."]}}, {"id": "k3-4477d45d18", "kap": 3, "sec": "3.5 Deskriptive Statistik", "stem": "In einer Studie wurden folgende Reaktionszeiten aufgezeichnet: 200, 200, 230, 280, 290 Millisekunden. Welche Aussagen treffen zu?", "opts": [{"t": "Der Modalwert beträgt 200 ms.", "c": true, "fb": "Nur dieser Wert tritt mehr als einmal auf — er hat damit die größte absolute Häufigkeit."}, {"t": "Das arithmetische Mittel beträgt 240 ms.", "c": true, "fb": "(200 + 200 + 230 + 280 + 290) / 5 = 240."}, {"t": "Der Median beträgt 240 ms.", "c": false, "fb": "240 ist das arithmetische Mittel. Bei fünf sortierten Werten ist der Median der dritte Wert, also 230 ms."}, {"t": "Bei einer geraden Anzahl von Werten wird als Median stets der größere der beiden mittleren Werte herangezogen.", "c": false, "fb": "In der Regel wird das arithmetische Mittel der beiden mittleren Werte gebildet und als Median verwendet."}], "concept": {"title": "Maße der zentralen Tendenz (Rechenbeispiel 3.1)", "points": ["<b>Modalwert</b>: der Wert mit der größten absoluten Häufigkeit — in [200, 200, 230, 280, 290] also 200 ms. Vor allem bei nominalskalierten Variablen aussagekräftig.", "<b>Median</b>: der Wert, der die aufsteigend sortierte Verteilung halbiert — hier der dritte von fünf Werten, also 230 ms. Bestimmbar ab Ordinalskalenniveau.", "<b>Median bei gerader Anzahl</b>: In der Regel wird das arithmetische Mittel der beiden mittleren Werte gebildet und als Median verwendet.", "<b>Arithmetisches Mittel</b>: alle Werte aufsummiert und durch die Gesamtanzahl dividiert — (200+200+230+280+290)/5 = 240 ms. Setzt mindestens Intervallskalenniveau voraus.", "<b>Ausreißer</b>: Werte, die weit von den übrigen entfernt liegen. Der Median ist robust gegen sie, das arithmetische Mittel nicht.", "<b>Beispiel dazu</b>: Gruppe 1 = [1, 2, 2, 5, 5] und Gruppe 2 = [1, 2, 2, 5, 20] haben beide den Median 2, aber M₁ = 3 gegenüber M₂ = 6 — die Verdopplung geht auf eine einzige Person zurück."]}}, {"id": "k3-ff99186e81", "kap": 3, "sec": "3.5 Deskriptive Statistik", "stem": "Welche Aussagen zu Varianz, Standardabweichung und Quartilen treffen zu?", "opts": [{"t": "Die Varianz ist die Summe der quadrierten Abweichungen aller Werte vom arithmetischen Mittel, dividiert durch die Gesamtanzahl der Werte.", "c": true, "fb": "Im Skript wird durchgehend die unkorrigierte Formel verwendet, also die Division durch N und nicht durch N − 1."}, {"t": "Für die Reaktionszeiten mit einer Varianz von 1480 beträgt die Standardabweichung etwa 384,7 ms.", "c": false, "fb": "Die Zahl ist um den Faktor 10 zu groß: √1480 ≈ 38,47 ms."}, {"t": "Das untere Quartil Q1 ist vereinfacht gesagt der Median jener Werte, die unter dem Median liegen.", "c": true, "fb": "Analog ist Q3 der Median der Werte oberhalb des Medians; der Interquartilsabstand ist die Differenz Q3 − Q1."}, {"t": "Varianz und Standardabweichung setzen mindestens Intervallskalenniveau voraus.", "c": true, "fb": "Für ordinalskalierte Daten bleibt als Streuungsmaß nur der Interquartilsabstand, für nominalskalierte gar keines."}], "concept": {"title": "Maße der Streuung (Rechenbeispiel 3.2)", "points": ["<b>Zweck</b>: Streuungsmaße geben an, wie stark die Werte voneinander abweichen — je größer die Streuung, desto weniger repräsentiert der Mittelwert die Verteilung. Ähnliche Mittelwerte bedeuten noch keine ähnlichen Stichproben.", "<b>Skalenniveau</b>: Für nominalskalierte Daten gibt es kein Streuungsmaß; ab Ordinalskalenniveau der Interquartilsabstand, ab Intervallskalenniveau Varianz und Standardabweichung.", "<b>Interquartilsabstand (IQA)</b>: Q3 − Q1 — die Breite des Bereichs, in dem die mittleren 50 % der Verteilung liegen. Q1 ist vereinfacht der Median der Werte unter dem Median, Q3 der Median der Werte darüber; bei ungerader Anzahl zählt der Median zu beiden Hälften.", "<b>Varianz</b>: Summe der quadrierten Abweichungen aller Werte vom arithmetischen Mittel, dividiert durch die Gesamtanzahl der Werte. Für [200, 200, 230, 280, 290] ergibt das 1480.", "<b>Standardabweichung</b>: die Wurzel der Varianz — hier √1480 ≈ 38,47 ms.", "<b>Fußnote zur Formel</b>: Das Skript verwendet ausschließlich die <i>unkorrigierte</i> Formel (Division durch N), weil nur die Varianz der Stichprobe berechnet und keine Populationsvarianz geschätzt wird."]}}, {"id": "k3-709fee783a", "kap": 3, "sec": "3.5 Deskriptive Statistik", "stem": "Welche Aussagen zu Streudiagramm und Kovarianz treffen zu?", "opts": [{"t": "Im Streudiagramm werden auf der einen Achse die Ausprägungen der einen und auf der anderen Achse die der anderen Variable aufgetragen.", "c": true, "fb": "Es vermittelt einen ersten Eindruck vom Zusammenhang zweier Variablen, etwa von Lerndauer und Testpunkten."}, {"t": "Jeder Punkt eines Streudiagramms repräsentiert eine Versuchseinheit — in der Psychologie in der Regel eine Person.", "c": true, "fb": "Bei zehn Versuchspersonen enthält das Diagramm entsprechend zehn Punkte."}, {"t": "Zur Berechnung der Kovarianz werden für jede Versuchseinheit die Abstände zu den beiden Variablenmittelwerten multipliziert, über alle Einheiten aufsummiert und durch deren Anzahl dividiert.", "c": true, "fb": "Im Rechenbeispiel ergibt das 128,5 / 10 = 12,85."}, {"t": "Werden positive Abstände häufig mit negativen Abständen multipliziert, ergibt sich eine negative Kovarianz.", "c": true, "fb": "Bei einer Mischung aus positiven und negativen Produkten heben sich die Werte dagegen weitgehend auf und die Kovarianz liegt nahe null."}], "concept": {"title": "Streudiagramm und Kovarianz", "points": ["<b>Streudiagramm</b>: Auf einer Achse stehen die Ausprägungen der einen, auf der anderen die der anderen Variable — im Beispiel Lerndauer in Stunden und Punkte im Geografietest.", "<b>Ein Punkt = eine Versuchseinheit</b>, in der Psychologie in der Regel eine Person; zehn Versuchspersonen ergeben zehn Punkte.", "<b>Leistung</b>: Das Streudiagramm vermittelt einen ersten Eindruck vom Zusammenhang zweier Variablen.", "<b>Kovarianz</b>: Für jede Versuchseinheit wird der Abstand zum Mittelwert der einen Variable mit dem Abstand zum Mittelwert der anderen multipliziert, über alle Einheiten aufsummiert und durch deren Anzahl dividiert — im Rechenbeispiel 128,5 / 10 = 12,85.", "<b>Vorzeichen</b>: Positive mal positive und negative mal negative Abstände ergeben eine positive Kovarianz; positive mal negative Abstände eine negative. Bei einer Mischung heben sich die Werte weitgehend auf und die Kovarianz liegt nahe null.", "<b>Nachteil der Kovarianz</b>: Sie hängt von den Einheiten der Variablen ab (Gramm gegenüber Kilogramm) — deshalb wird sie durch das Produkt der beiden Standardabweichungen dividiert; das Ergebnis ist der Korrelationskoeffizient r."]}}, {"id": "k3-b092d6fdfe", "kap": 3, "sec": "3.5 Deskriptive Statistik", "stem": "Welche Aussage zur Höhe und Interpretation einer Korrelation trifft zu?", "opts": [{"t": "Je näher r bei 0 liegt, desto genauere Vorhersagen lassen sich auf Basis der einen Variable über die andere treffen.", "c": false, "fb": "Umgekehrt: Je höher die Korrelation, desto genauer die Vorhersagen."}, {"t": "Ähnelt die eingekreiste Punktwolke eines Streudiagramms eher einem Kreis als einer schmalen Ellipse, spricht das für eine hohe Korrelation.", "c": false, "fb": "Die Kreisform steht für eine geringe Korrelation; je schmaler die Ellipse, desto höher der Zusammenhang."}, {"t": "Ein r von −0,9 zeigt einen schwächeren Zusammenhang an als ein r von 0,3.", "c": false, "fb": "Das Vorzeichen gibt nur die Richtung an. Maßgeblich ist der Abstand von 0 — −0,9 steht für einen deutlich stärkeren Zusammenhang."}, {"t": "Bei einer perfekten Korrelation liegen die Datenpunkte auf einer Linie.", "c": true, "fb": "Das entspricht r = 1 bzw. r = −1, den beiden Extremwerten des Korrelationskoeffizienten."}], "concept": {"title": "Der Korrelationskoeffizient r", "points": ["<b>Definition</b>: auch Produkt-Moment-Korrelation; quantifiziert den Grad des <i>linearen</i> Zusammenhangs und setzt mindestens intervallskalierte Daten voraus.", "<b>Nicht geeignet</b> ist er für nichtlineare, etwa quadratische Zusammenhänge, die im Streudiagramm U-förmig verlaufen.", "<b>Wertebereich</b>: −1 bis 1. Bei 0 liegt kein linearer Zusammenhang vor; zwischen −1 und 0 eine negative, zwischen 0 und 1 eine positive Korrelation.", "<b>Richtung vs. Stärke</b>: Das Vorzeichen gibt die Richtung an; für die Stärke zählt der Abstand von 0 — je weiter r von 0 entfernt liegt, desto höher die Korrelation.", "<b>Optische Einschätzung</b>: Kreist man die Datenpunkte ein, steht eine Kreisform für eine geringe, eine schmale Ellipse für eine hohe Korrelation; bei perfekter Korrelation liegen die Punkte auf einer Linie.", "<b>Nutzen</b>: Je höher die Korrelation, desto genauere Vorhersagen lassen sich auf Basis der einen Variable über die andere treffen (Bortz & Schuster, 2010)."]}}, {"id": "k4-97f8f056ee", "kap": 4, "sec": "4.2.2 Ruhe- und Aktionspotenzial", "stem": "Welche Aussagen zu den Flüssigkeiten und Ladungen an der Zellmembran treffen zu?", "opts": [{"t": "Die Flüssigkeit im Inneren eines Neurons wird auch Cytosol oder intrazelluläre Flüssigkeit genannt; ihr Hauptbestandteil ist Wasser.", "c": true, "fb": "Das gilt ebenso für die extrazelluläre Flüssigkeit rund um das Neuron. In beiden sind Ionen gelöst."}, {"t": "Ionen sind ungeladene Atome, die sich frei durch die Lipid-Doppelschicht bewegen können.", "c": false, "fb": "Ionen sind gerade elektrisch geladene Atome – deshalb erzeugen sie überhaupt eine Spannung. Und frei passieren können sie die Membran nicht, sie brauchen Ionenkanäle."}, {"t": "Ein Neuron im Ruhezustand gilt als elektrisch neutral, weil sich die Ladungen innen und außen ausgleichen.", "c": false, "fb": "Im Ruhezustand liegt gerade kein Ausgleich vor: Das Zellinnere ist mit etwa −70 mV negativ gegenüber außen – das Neuron ist polarisiert."}, {"t": "Als Membranpotenzial bezeichnet man den Spannungsunterschied an der Membran, der aus den unterschiedlichen Ionenkonzentrationen innen und außen entsteht.", "c": true, "fb": "Die Definition ist präzise an die Ursache gekoppelt: unterschiedliche Konzentration geladener Atome → unterschiedliche Ladung → Spannungsunterschied."}], "concept": {"title": "Das Membranpotenzial – Grundprinzip", "points": ["Innen (Cytosol) und außen (extrazelluläre Flüssigkeit) ist überwiegend Wasser, darin gelöst: <b>Ionen</b> = elektrisch geladene Atome.", "Unterschiedliche Ionenkonzentration innen/außen → unterschiedliche Ladung → <b>Spannungsunterschied an der Membran = Membranpotenzial</b>.", "Im Ruhezustand ≈ <b>−70 mV</b>, innen negativ: die Zelle ist <b>polarisiert</b>.", "Ionen kommen nicht frei durch die Lipid-Doppelschicht, sondern nur durch <b>Ionenkanäle</b>, die meist nur einen Ionentyp durchlassen."]}}, {"id": "k4-be082ce9ee", "kap": 4, "sec": "4.3.3 Das Gehirn", "stem": "Welche Aussagen zu den Lappen des cerebralen Cortex treffen zu?", "opts": [{"t": "Die Parietallappen sind an der Integration sensumotorischer Informationen sowie an Aufmerksamkeit und räumlicher Orientierung beteiligt.", "c": true, "fb": "Der Tastsinn wird dabei kontralateral verarbeitet: rechte Körperseite im linken Parietallappen und umgekehrt."}, {"t": "In den Temporallappen liegen Regionen für das Hören sowie spezialisierte visuelle Areale, etwa für das Erkennen von Gesichtern.", "c": true, "fb": "Zusätzlich sind dort Hippocampus (Gedächtnis) und Amygdala (emotionale Verarbeitung) eingebettet."}, {"t": "Im Okzipitallappen befindet sich der primäre visuelle Cortex, das erste Hauptziel visueller Informationen.", "c": true, "fb": "Daher auch der zweite Name Hinterhauptlappen – er liegt im Hinterhaupt."}, {"t": "Die vier Lappen stellen keine funktionalen Einheiten dar, sondern kommen durch die Furchung des Gehirns zustande.", "c": true, "fb": "Das ist ein häufig unterschätzter Punkt: Die Einteilung ist anatomisch, nicht funktional begründet."}], "concept": {"title": "Die vier Lappen des cerebralen Cortex", "points": ["<b>Frontallappen</b> (Stirnlappen): Planung, Sprache, Sozialverhalten, Emotionsregulation, Bewegung. Der <b>präfrontale Cortex</b> gilt als Sitz von Persönlichkeit und Sozialverhalten.", "<b>Parietallappen</b> (Scheitellappen): sensumotorische Integration (Tastsinn, kontralateral), Aufmerksamkeit, räumliche Orientierung.", "<b>Temporallappen</b> (Schläfenlappen): Hören, Gesichtererkennung; enthält Hippocampus und Amygdala.", "<b>Okzipitallappen</b> (Hinterhauptlappen): primärer visueller Cortex.", "Rahmen: Cortex = Großhirnrinde, nur 2–5 <b>Millimeter</b> dick, vorwiegend graue Substanz, stark gefurcht zur Oberflächenvergrößerung. Die Hemisphären sind über das <b>Corpus callosum</b> verbunden."]}}, {"id": "k4-d3574ffbf7", "kap": 4, "sec": "4.4 Das visuelle System", "stem": "Welche Aussage zum Schichtaufbau der Retina ist korrekt?", "opts": [{"t": "Die an die Aderhaut angrenzende Schicht der Retina besteht aus Ganglienzellen.", "c": false, "fb": "Dort liegen die Pigmentepithelzellen. Die Ganglienzellen sitzen am anderen Ende der Verschaltung, ihre Axone bilden den Sehnerv."}, {"t": "Die Photorezeptorzellen liegen in der äußeren Schicht der Retina, sodass eintreffendes Licht erst mehrere Zellschichten durchqueren muss.", "c": true, "fb": "Ein zunächst widersinnig wirkender Aufbau: Die lichtaufnehmenden Zellen liegen ganz hinten, das Licht muss an ihnen vorbei durch die Signalschichten."}, {"t": "Die Bildverzerrung durch die vorgelagerten Zellschichten ist erheblich, weil diese kaum lichtdurchlässig sind.", "c": false, "fb": "Genau umgekehrt: Diese Zellen sind relativ transparent, die Verzerrung ist minimal."}, {"t": "Die Müller-Zellen sind ein Photorezeptortyp, der vor allem bei dämmriger Beleuchtung aktiv ist.", "c": false, "fb": "Müller-Zellen sind eine spezielle Art von Gliazellen in der Retina; sie leiten gestreutes Licht durch die Retina. Bei Dämmerung dominieren die Stäbchen."}], "concept": {"title": "Der Weg des Lichts durch die Retina", "points": ["Von der Aderhaut nach innen: <b>Pigmentepithelzellen</b> → <b>Photorezeptorzellen</b> (Stäbchen, Zapfen) → Bipolarzellen → Ganglienzellen.", "Das Licht läuft in <b>umgekehrter</b> Richtung: erst durch die transparenten Signalschichten, dann auf die außen liegenden Rezeptoren. Verzerrung: minimal.", "<b>Transduktion</b> = Umwandlung von Lichtenergie in neuronale Signale, findet in den Photorezeptorzellen statt.", "<b>Müller-Zellen</b> = Gliazellen der Retina, leiten gestreutes Licht."]}}, {"id": "k4-c5e4fa2f50", "kap": 4, "sec": "4.1 Was ist Biologische Psychologie", "stem": "Welche Zuordnungen zu den Teilbereichen der Biologischen Psychologie treffen zu?", "opts": [{"t": "Die Vergleichende Psychologie manipuliert die neuronale Aktivität durch Medikamente und Drogen, um neue Wirkstoffe zu entwickeln.", "c": false, "fb": "Das ist die Psychopharmakologie. Die Vergleichende Psychologie vergleicht das Verhalten verschiedener Spezies."}, {"t": "Die Physiologische Psychologie arbeitet häufig mit Tierversuchen, um Theorien über menschliches Verhalten zu entwickeln und experimentell zu prüfen.", "c": true, "fb": "Ihr Zugang ist möglichst direkt: elektrische Stimulation oder chirurgische Eingriffe an den interessierenden Strukturen."}, {"t": "Die Kognitive Neurowissenschaft ist ein vergleichsweise junger Bereich und stützt sich stark auf funktionelle und strukturelle Bildgebung wie die MRT.", "c": true, "fb": "Ihr Gegenstand sind die neuronalen Grundlagen der Kognition."}, {"t": "Die Hauptbereiche der Biologischen Psychologie überschneiden sich inhaltlich häufig und sind keine völlig abgegrenzten Gebiete.", "c": true, "fb": "Sie unterscheiden sich in ihren Schwerpunkten, nicht in scharfen Grenzen. Eine allgemeingültige Unterteilung gibt es ohnehin nicht."}], "concept": {"title": "Die sechs Teilbereiche nach Pinel, Barnes und Pauli", "points": ["<b>Physiologische Psychologie</b>: direkte Erklärung neuronaler Mechanismen, invasiv (Stimulation, Eingriffe), oft Tierversuch.", "<b>Neuropsychologie</b>: psychologische Folgen von Hirnschädigungen beim Menschen; stark anwendungsorientiert (Diagnostik, Rehabilitation).", "<b>Psychophysiologie</b>: physiologische ↔ psychologische Prozesse beim Menschen, nicht-invasiv (EEG, Herzrate, Muskelspannung); Themen: Stress, Emotion, biologische Rhythmen.", "<b>Kognitive Neurowissenschaft</b>: neuronale Grundlagen der Kognition, Bildgebung (MRT); junger Bereich.", "<b>Psychopharmakologie</b>: Manipulation durch Medikamente und Drogen; interdisziplinär mit Medizin und Pharmakologie.", "<b>Vergleichende Psychologie</b>: Verhaltensvergleich zwischen Spezies → Evolution, Genetik, adaptives Verhalten.", "Die Bereiche sind Schwerpunkte, keine abgeschlossenen Gebiete."]}}, {"id": "k4-0436185240", "kap": 4, "sec": "4.3.1 Anatomische Bezugspunkte", "stem": "Welche Aussagen zu den anatomischen Lage- und Orientierungsbezeichnungen treffen zu?", "opts": [{"t": "Anterior bezeichnet beim Gehirn die Richtung zum Hinterhaupt.", "c": false, "fb": "Anterior heißt vorne, beim Gehirn also Richtung Nase. Zum Hinterhaupt zeigt posterior."}, {"t": "Beim Rumpf des Menschen bedeutet ventral „in Richtung des Rückens“.", "c": false, "fb": "Ventral heißt beim Rumpf Richtung Brustkorb. Zum Rücken zeigt dorsal."}, {"t": "Superior bezeichnet etwas, das sich in Richtung des Kopfes befindet, inferior etwas in Richtung der Füße und Zehen.", "c": true, "fb": "Diese beiden Begriffe wurden nötig, weil sich durch den aufrechten Gang die Bedeutung von dorsal/ventral am Rumpf verschoben hat."}, {"t": "In Bezug auf das Gehirn gibt es keine Unterschiede in den Richtungsbezeichnungen zwischen Hund und Mensch.", "c": true, "fb": "Verschoben haben sich nur die Bezeichnungen am übrigen Körper – deshalb der Umweg über den Vierbeiner zum Verständnis."}], "concept": {"title": "Lage- und Orientierungsbezeichnungen (Tabelle 4.1)", "points": ["<b>dorsal</b> = oben: Gehirn → Kopfoberseite, Rumpf → Rücken.", "<b>ventral</b> = unten: Gehirn → Kopfunterseite, Rumpf → Brustkorb.", "<b>anterior</b> = vorne: Gehirn → Nase, Rumpf → Brustkorb.", "<b>posterior</b> = hinten: Gehirn → Hinterhaupt, Rumpf → Rücken.", "<b>superior</b> = Richtung Kopf, <b>inferior</b> = Richtung Füße (nötig, weil am Rumpf dorsal/posterior bzw. ventral/anterior zusammenfallen).", "<b>medial</b> = nahe der Mittellinie, <b>lateral</b> = seitlich davon entfernt.", "<b>ipsilateral</b> = gleiche Körperseite, <b>kontralateral</b> = gegenüberliegende Seite.", "Beim Gehirn identisch für Hund und Mensch – nur der Rumpf hat sich durch den aufrechten Gang verschoben."]}}, {"id": "k4-ade11b2774", "kap": 4, "sec": "4.2.3 Synaptische Übertragung", "stem": "Welche Aussagen zur chemischen Synapse sind korrekt?", "opts": [{"t": "Die kleinen Bläschen in der Axonterminale heißen synaptische Vesikel und enthalten die Neurotransmitter.", "c": true, "fb": "Sie besitzen eine eigene, sie umgebende Membran, die bei der Exocytose mit der präsynaptischen Membran fusioniert."}, {"t": "Nach der Exocytose geht die Vesikelmembran verloren und muss vollständig neu gebildet werden.", "c": false, "fb": "Die Vesikelmembran wird später wieder zurückgewonnen und füllt sich erneut mit Neurotransmittern."}, {"t": "Die Zellmembran der informationssendenden Zelle heißt präsynaptische Membran, die der empfangenden Zelle postsynaptische Membran.", "c": true, "fb": "Zwischen beiden liegt der synaptische Spalt, der von den Neurotransmittern überbrückt werden muss."}, {"t": "In einer einzigen präsynaptischen Endigung können unterschiedliche Vesikeltypen mit jeweils spezifischen Neurotransmittern vorkommen.", "c": true, "fb": "Eine Endigung ist also nicht auf einen einzigen Botenstoff festgelegt."}], "concept": {"title": "Ablauf der chemischen synaptischen Übertragung", "points": ["Aktionspotenzial erreicht die <b>Axonterminale</b> → Depolarisation → <b>spannungsgesteuerte Calciumkanäle</b> öffnen.", "Calciumeinstrom → synaptische <b>Vesikel</b> verschmelzen mit der präsynaptischen Membran → <b>Exocytose</b>: Neurotransmitter in den <b>synaptischen Spalt</b>.", "Bindung an Rezeptoren der <b>postsynaptischen Membran</b> nach dem <b>Schlüssel-Schloss-Prinzip</b> → Ionenkanäle öffnen.", "Entfernung aus dem Spalt: überwiegend <b>Wiederaufnahme</b> in die Endknöpfchen, Rest Abbau durch <b>Enzyme</b> oder Aufnahme durch <b>Astrozyten</b>.", "Die Vesikelmembran wird zurückgewonnen und neu befüllt."]}}, {"id": "k4-818757fbb2", "kap": 4, "sec": "4.3.3 Das Gehirn", "stem": "Welche Aussage zum Mesencephalon ist korrekt?", "opts": [{"t": "Im Tegmentum liegende Strukturen sind am visuellen und auditorischen System beteiligt und steuern Reflexbewegungen von Augen und Kopf.", "c": false, "fb": "Das leistet das Tectum. Im Tegmentum liegen Strukturen für psychische und psychomotorische Funktionen."}, {"t": "Das periaquäduktale Grau ist vor allem für die Regulation von Hunger und Durst zuständig.", "c": false, "fb": "Es spielt eine wichtige Rolle bei der Schmerzwahrnehmung. Motivationale Verhaltensweisen wie Essen reguliert der Hypothalamus."}, {"t": "Strukturell lassen sich das dorsal liegende Tectum und das ventral liegende Tegmentum unterscheiden.", "c": true, "fb": "Merkhilfe über die Lage: Tectum oben (lat. Dach), Tegmentum unten."}, {"t": "Die Substantia nigra liegt im Tectum und besteht aus serotoninproduzierenden Neuronen.", "c": false, "fb": "Sie liegt im Tegmentum und besteht aus dopaminproduzierenden Neuronen mit Aufgaben in der Bewegungssteuerung."}], "concept": {"title": "Mesencephalon (Mittelhirn)", "points": ["Bildet zusammen mit <b>Pons</b> und <b>Medulla oblongata</b> den <b>Hirnstamm</b>; liegt über dem Pons.", "Wird wie der übrige Hirnstamm von afferenten und efferenten Nervenfasern durchzogen.", "<b>Tectum</b> (dorsal): visuelles und auditorisches System, Reflexbewegungen von Augen und Kopf.", "<b>Tegmentum</b> (ventral): psychische und psychomotorische Funktionen – u. a. <b>periaquäduktales Grau</b> (Schmerzwahrnehmung) und <b>Substantia nigra</b> (dopaminproduzierend, Bewegungssteuerung)."]}}, {"id": "k4-f0762d89af", "kap": 4, "sec": "4.4 Das visuelle System", "stem": "Welche Aussagen zu den Zapfen und zum Farbsehen treffen zu?", "opts": [{"t": "Das Außenglied der Zapfen ist lang und zylindrisch und enthält besonders viele Photopigmente.", "c": false, "fb": "Das beschreibt die Stäbchen. Das Außenglied der Zapfen ist deutlich kürzer und läuft spitz zu."}, {"t": "Es gibt drei Zapfentypen, die sich durch ihre Photopigmente unterscheiden und unterschiedlich stark auf verschieden lange Wellenlängen reagieren.", "c": true, "fb": "Ein Typ reagiert besonders gut auf blaues, einer auf grünes, einer auf rotes Licht."}, {"t": "Die tatsächliche Farbwahrnehmung hängt von der relativen Beteiligung der drei Zapfentypen ab.", "c": true, "fb": "Nicht ein einzelner Zapfentyp bestimmt die Farbe, sondern das Verhältnis ihrer Aktivierung zueinander."}, {"t": "Die Empfindlichkeitsbereiche der drei Zapfentypen sind scharf voneinander getrennt und überlappen nicht.", "c": false, "fb": "Die Wellenlängenbereiche überlappen sich – genau deshalb funktioniert das Prinzip der relativen Beteiligung überhaupt."}], "concept": {"title": "Stäbchen, Zapfen und Farbsehen", "points": ["Beide besitzen ein <b>Außen- und ein Innenglied</b>.", "<b>Stäbchen</b>: langes zylindrisches Außenglied, viele Photopigmente → sehr lichtempfindlich → Dämmerungssehen. Etwa <b>20-mal so viele</b> wie Zapfen.", "<b>Zapfen</b>: kurzes, spitz zulaufendes Außenglied → dominieren bei guter Beleuchtung, liefern scharfe farbige Wahrnehmung. In der <b>Fovea</b> ausschließlich Zapfen → Ort des schärfsten Sehens.", "<b>Drei Zapfentypen</b> (blau / grün / rot), Wellenlängenbereiche <b>überlappen</b>; die Farbwahrnehmung ergibt sich aus ihrer <b>relativen Beteiligung</b>.", "Fehlen oder Fehlfunktion eines Typs → <b>Farbfehlsichtigkeit</b>, am häufigsten die Rot-Grün-Schwäche."]}}, {"id": "k4-845364eba5", "kap": 4, "sec": "4.3.3 Das Gehirn", "stem": "Welche Aussagen zu Lateralisation und Split-Brain treffen zu?", "opts": [{"t": "Bei Split-Brain-Patient:innen sind die Hemisphären getrennt, meist infolge einer Operation zur Eindämmung epileptischer Anfälle.", "c": true, "fb": "Damit ist der Informationsaustausch über das Corpus callosum unterbrochen."}, {"t": "Die linke Hemisphäre ist in der Regel sprachdominant, während die rechte bei der räumlichen Verarbeitung dominant ist.", "c": true, "fb": "Genau diese Lateralisation erklärt das Untersuchungsergebnis: Der rechten Hemisphäre fehlen die Worte."}, {"t": "Die Untersuchungen von Gazzaniga, Bogen und Sperry (1962) zeigten, dass Reize der linken Gesichtsfeldhälfte nicht benannt werden konnten.", "c": true, "fb": "Reize in der rechten Gesichtsfeldhälfte stellten dagegen kein Problem dar."}, {"t": "Split-Brain-Patient:innen zeigen im Alltag schwere Ausfälle beim Gehen, Sprechen und in sozialen Interaktionen.", "c": false, "fb": "Sie verhalten sich auffällig normal – die Ausfälle zeigen sich erst in gezielten Untersuchungsanordnungen."}], "concept": {"title": "Lateralisation und Split-Brain (Infobox 4.3)", "points": ["Normalfall: Beide Hemisphären arbeiten über das <b>Corpus callosum</b> zusammen.", "Bei <b>Split-Brain</b> ist diese Verbindung durchtrennt (meist zur Eindämmung epileptischer Anfälle). Im Alltag: auffällig normales Verhalten.", "Befund von <b>Gazzaniga, Bogen und Sperry (1962)</b>: Reize in der <b>linken</b> Gesichtsfeldhälfte können nicht benannt werden, Reize rechts schon.", "Zwei Erklärungsbausteine: (1) <b>kontralaterale</b> Verarbeitung visueller Reize – linkes Gesichtsfeld → rechte Hemisphäre; (2) <b>Lateralisation</b> – links sprachdominant, rechts dominant für räumliche Verarbeitung."]}}, {"id": "k4-e5bfafd91e", "kap": 4, "sec": "4.2.1 Bausteine des Nervensystems", "stem": "Welche Aussage zur Blut-Hirn-Schranke und zur Rolle der Gliazellen ist korrekt?", "opts": [{"t": "Die Blut-Hirn-Schranke hält vor allem fettlösliche Substanzen zurück.", "c": false, "fb": "Umgekehrt: Weil die Blutgefäße mit Fett umgeben werden, können gerade viele nicht fettlösliche Giftstoffe die Barriere nicht überwinden."}, {"t": "Astrozyten umgeben die Blutgefäße im Gehirn mit Fett und sind so an der Blut-Hirn-Schranke beteiligt.", "c": true, "fb": "Astrozyten sind eine Art von Gliazellen; die Barriere schützt vor Giftstoffen und Krankheitserregern im Blut."}, {"t": "Oligodendrozyten bilden die Blut-Hirn-Schranke im peripheren Nervensystem.", "c": false, "fb": "Oligodendrozyten bilden das Myelin im zentralen Nervensystem. An der Blut-Hirn-Schranke sind Astrozyten beteiligt."}, {"t": "An der neuronalen Kommunikation sind Gliazellen nicht beteiligt, da sie keine Ionenkonzentrationen beeinflussen.", "c": false, "fb": "Man geht davon aus, dass sie eine aktive Rolle spielen, indem sie möglicherweise die Konzentration von Ionen beeinflussen."}], "concept": {"title": "Aufgaben der Gliazellen", "points": ["Unterstützen während der <b>embryonalen Entwicklung</b> neu gebildete Neuronen bei der Ortsfindung.", "<b>Gehirnstoffwechsel</b>: bereiten Nährstoffe auf, entsorgen zelluläres Abfallmaterial.", "Nehmen überschüssige <b>Neurotransmitter</b> aus dem synaptischen Spalt auf.", "<b>Blut-Hirn-Schranke</b>: Astrozyten umgeben Blutgefäße mit Fett → nicht fettlösliche Giftstoffe kommen nicht durch.", "Vermutlich aktive Rolle in der <b>neuronalen Kommunikation</b> über die Ionenkonzentration.", "Bilden <b>Myelin</b>: Oligodendrozyten im ZNS, Schwann-Zellen im PNS.", "Früher als reine Stützzellen gesehen – daher „die vergessenen Zellen“."]}}, {"id": "k4-c02a26a3d9", "kap": 4, "sec": "4.2.3 Synaptische Übertragung", "stem": "Welche Aussagen zu den Vorgängen an der postsynaptischen Membran treffen zu?", "opts": [{"t": "Werden Natriumkanäle geöffnet, entsteht durch die Depolarisation ein exzitatorisches postsynaptisches Potenzial.", "c": true, "fb": "Natrium strömt ein, das Zellinnere wird weniger negativ – die Feuerwahrscheinlichkeit steigt."}, {"t": "Werden Kalium- oder Chloridkanäle geöffnet, kommt es zu einer Depolarisation und damit zu einem exzitatorischen Signal.", "c": false, "fb": "Dabei wird die Membran hyperpolarisiert, es entsteht ein inhibitorisches postsynaptisches Signal."}, {"t": "Neurotransmitter, die nicht wiederaufgenommen werden, werden ausschließlich von Enzymen abgebaut.", "c": false, "fb": "Ein Teil wird auch von Astrozyten aufgenommen, die sie abbauen und die Abbauprodukte an die Neurone zurückgeben."}, {"t": "Ob in der Nähe des Axonhügels ein Aktionspotenzial ausgelöst wird, entscheidet die Summe der exzitatorischen und inhibitorischen postsynaptischen Signale.", "c": true, "fb": "Depolarisationen und Hyperpolarisationen laufen gleichzeitig an vielen Stellen der Dendriten und am Soma ab und werden verrechnet."}], "concept": {"title": "Vom Transmitter zum Aktionspotenzial", "points": ["Rezeptoren der postsynaptischen Membran veranlassen das <b>Öffnen von Ionenkanälen</b>.", "<b>Natriumkanäle offen</b> → Depolarisation → <b>exzitatorisches</b> postsynaptisches Potenzial (EPSP).", "<b>Kalium- oder Chloridkanäle offen</b> → Hyperpolarisation → <b>inhibitorisches</b> postsynaptisches Signal (IPSP).", "Viele solcher Signale laufen gleichzeitig an Dendriten und Soma ab. Ihre <b>Summe</b> entscheidet, ob am Axonhügel der Schwellenwert (≈ −55 mV) überschritten wird.", "Danach müssen die Transmitter aus dem Spalt entfernt werden: <b>Wiederaufnahme</b> (Mehrheit), <b>Enzyme</b>, <b>Astrozyten</b>."]}}, {"id": "k4-44f8b87b5c", "kap": 4, "sec": "4.4 Das visuelle System", "stem": "Welche Aussagen zum Auge und zur Linse treffen zu?", "opts": [{"t": "Die Augen werden in den Augenhöhlen von sechs Muskeln gestützt, die Bewegungen in horizontaler und vertikaler Achse erlauben.", "c": true, "fb": "Diese Muskeln setzen an der äußeren Augenhaut an."}, {"t": "Der Sehnerv ist Teil des peripheren Nervensystems und tritt an der Vorderseite des Auges aus.", "c": false, "fb": "Er ist Teil des zentralen Nervensystems und tritt an der Augenrückseite aus – diese Stelle ist der Blinde Fleck."}, {"t": "Die Augenlinse ist bikonvex; ihre Vorderseite ist etwas schwächer gekrümmt als die Hinterseite.", "c": true, "fb": "Bikonvex heißt beidseitig nach außen gewölbt."}, {"t": "Bei der Akkommodation wird die Brechkraft erhöht, um Objekte wahrzunehmen, die sich nahe am Auge befinden.", "c": true, "fb": "Die Wölbung der Linse wird dabei durch den Ziliarmuskel verändert."}], "concept": {"title": "Aufbau des Auges – die drei Augenhäute", "points": ["<b>Äußere Augenhaut</b>: hinten und seitlich die <b>Lederhaut</b>, vorne die <b>Cornea</b> (Hornhaut). Ohne Blutgefäße → lichtdurchlässig. Ansatzpunkt der sechs Augenmuskeln.", "<b>Mittlere Augenhaut</b>: <b>Aderhaut</b> (reich an Blutgefäßen), <b>Ziliarkörper</b> (Ziliarmuskel verformt die Linse) und <b>Iris</b> (Blende; in ihrer Mitte die <b>Pupille</b>).", "<b>Innere Augenhaut</b>: <b>Retina</b> mit den Photorezeptorzellen.", "Weiter: bikonvexe <b>Linse</b> (Vorderseite schwächer gekrümmt), <b>Akkommodation</b> = Veränderung der Linsenform für Nahsehen, <b>Glaskörper</b> als gallertige Masse, <b>Blinder Fleck</b> am Austritt des Sehnervs (Teil des ZNS).", "Pupillenweite: viel Licht → kleiner, wenig Licht → größer."]}}, {"id": "k4-a8cb194b67", "kap": 4, "sec": "4.3 Aufbau des Nervensystems", "stem": "Welche Aussage zur Gliederung des Nervensystems ist korrekt?", "opts": [{"t": "Zum zentralen Nervensystem gehören die Nerven und Nervenbahnen des Gehirns und des Rückenmarks.", "c": true, "fb": "Das periphere Nervensystem ist entsprechend alles, was außerhalb von Schädel und Wirbelsäule liegt."}, {"t": "Das periphere Nervensystem umfasst alle Strukturen innerhalb von Schädel und Wirbelsäule.", "c": false, "fb": "Die Richtung ist umgedreht: Das periphere Nervensystem liegt gerade außerhalb von Schädel und Wirbelsäule."}, {"t": "Das zentrale Nervensystem lässt sich in das somatische und das autonome Nervensystem unterteilen.", "c": false, "fb": "Diese Unterteilung betrifft das periphere Nervensystem. Das ZNS gliedert sich in Gehirn und Rückenmark."}, {"t": "Die Integration und Koordination aller körperlichen Funktionen ist die Aufgabe des peripheren Nervensystems.", "c": false, "fb": "Das ist die Aufgabe des ZNS: Verarbeitung eintreffender Informationen, deren Integration und das Senden von Signalen."}], "concept": {"title": "Gliederung des Nervensystems", "points": ["<b>Zentrales Nervensystem (ZNS)</b> = Gehirn + Rückenmark. Aufgabe: Integration und Koordination aller körperlichen Funktionen.", "<b>Peripheres Nervensystem (PNS)</b> = alles außerhalb von Schädel und Wirbelsäule.", "<b>Somatisches Nervensystem</b> (Teil des PNS): sensorische Information von Haut, Muskeln, Gelenken zum ZNS und motorische Signale zurück.", "<b>Autonomes (vegetatives) Nervensystem</b> (Teil des PNS): Steuerung innerer Organe, unbewusst. Untergliedert in <b>Sympathikus</b> (Aktivierung) und <b>Parasympathikus</b> (Normalbetrieb)."]}}, {"id": "k4-cefc41bbe2", "kap": 4, "sec": "4.2.1 Bausteine des Nervensystems", "stem": "Welche Aussagen zu den drei Neuronenarten auf Ebene des Rückenmarks treffen zu?", "opts": [{"t": "Interneuronen geben Signale an benachbarte Neuronen weiter und sind an der Ausbreitung des Signals beteiligt.", "c": true, "fb": "Sie kommunizieren innerhalb des Nervensystems und integrieren Informationen."}, {"t": "Rezeptoren in Haut und Muskeln senden über Motoneuronen Signale zurück an das Gehirn.", "c": false, "fb": "Diesen Rückweg übernehmen sensorische Neuronen. Motoneuronen laufen in die Gegenrichtung, zu den Muskeln."}, {"t": "Sensorische Neuronen reagieren auf spezifischen Input und nehmen Information aus der Umwelt oder aus dem Körperinneren auf.", "c": true, "fb": "Beide Quellen zählen – die Außenwelt ebenso wie Zustände im eigenen Körper."}, {"t": "Interneuronen verbinden ausschließlich das Rückenmark mit den Muskeln.", "c": false, "fb": "Diese Verbindung stellen Motoneuronen her. Interneuronen arbeiten innerhalb des Nervensystems."}], "concept": {"title": "Drei Neuronenarten im Zusammenspiel", "points": ["<b>Sensorische Neuronen</b>: nehmen Information aus Umwelt und Körperinnerem auf (Reaktion auf spezifischen Input).", "<b>Interneuronen</b>: kommunizieren innerhalb des Nervensystems, integrieren Informationen, geben sie an benachbarte Neuronen weiter.", "<b>Motoneuronen</b>: rufen Bewegungen hervor, indem sie Muskeln zur Kontraktion oder Entspannung veranlassen.", "Beispiel Stift halten: Gehirn → <b>Motoneuronen</b> → Fingermuskeln bewegen den Stift; Hautrezeptoren → <b>sensorische Neuronen</b> → Rückmeldung über den nötigen Druck; <b>Interneuronen</b> verteilen die Signale."]}}, {"id": "k4-93fa1925e8", "kap": 4, "sec": "4.3.3 Das Gehirn", "stem": "Welche Aussagen zum Metencephalon treffen zu?", "opts": [{"t": "Das Metencephalon lässt sich in Cerebellum und Pons unterteilen; der Pons liegt direkt über der Medulla oblongata.", "c": true, "fb": "Das Metencephalon ist das Hinterhirn und entwickelt sich aus dem Rautenhirnbläschen."}, {"t": "Der Pons enthält im Gegensatz zur Medulla oblongata keine afferenten und efferenten Nervenfasern.", "c": false, "fb": "Er beinhaltet wie die Medulla oblongata viele solcher Fasern."}, {"t": "Das Kleinhirn integriert unter anderem Informationen aus dem Gleichgewichtsorgan, das im Mittelohr liegt.", "c": false, "fb": "Die Aussage über die Integration stimmt, der Ort nicht: Das Gleichgewichtsorgan liegt im Innenohr."}, {"t": "Das Cerebellum besteht wie das Großhirn aus zwei Hälften, den Kleinhirnhemisphären, und liegt hinter dem Pons.", "c": true, "fb": "Seine wichtigsten Funktionen liegen im Bereich der Motorik."}], "concept": {"title": "Metencephalon (Hinterhirn)", "points": ["Entsteht gemeinsam mit dem Myelencephalon aus dem <b>Rautenhirnbläschen</b>. Zwei Teile: <b>Pons</b> und <b>Cerebellum</b>.", "<b>Pons</b> (Brücke): liegt direkt über der Medulla oblongata, beinhaltet viele afferente und efferente Nervenfasern. Gehört zum Hirnstamm.", "<b>Cerebellum</b> (Kleinhirn): große gewundene Struktur hinter dem Pons, zwei <b>Kleinhirnhemisphären</b>.", "Funktion des Cerebellums: <b>Motorik</b>. Es integriert Informationen aus Rückenmark, <b>Gleichgewichtsorgan (Innenohr)</b> und anderen Hirnteilen, um Bewegungsabläufe glatt abzustimmen."]}}, {"id": "k4-40492c5223", "kap": 4, "sec": "4.2.2 Ruhe- und Aktionspotenzial", "stem": "Welche Aussage über die im Kapitel genannten Prozesse, die zum Ruhepotenzial führen, ist korrekt?", "opts": [{"t": "Zu ihnen zählen die selektive Permeabilität, der Osmosegradient und die Calcium-Natrium-Pumpe.", "c": false, "fb": "Osmosegradient und Calcium-Natrium-Pumpe kommen im Kapitel nicht vor. Gemeint sind Potenzialgradient und Natrium-Kalium-Pumpe."}, {"t": "Zu ihnen zählen neben Diffusion und Potenzialgradient auch die saltatorische Erregungsleitung und die Exocytose.", "c": false, "fb": "Saltatorische Erregungsleitung und Exocytose gehören zu ganz anderen Kapiteln – zur Fortleitung entlang des Axons bzw. zur synaptischen Übertragung."}, {"t": "Zu ihnen zählen ausschließlich der Konzentrationsgradient und der Potenzialgradient; aktive Transportprozesse spielen keine Rolle.", "c": false, "fb": "Ohne die energieaufwendige Natrium-Kalium-Pumpe würde das Membranpotenzial über die Zeit verloren gehen."}, {"t": "Zu ihnen zählen die selektive Permeabilität, der Konzentrationsgradient, der Potenzialgradient und die Natrium-Kalium-Pumpe.", "c": true, "fb": "Genau diese vier Prozesse führt das Skript nummeriert auf."}], "concept": {"title": "Die vier Prozesse hinter dem Ruhepotenzial", "points": ["<b>1. Selektive Permeabilität</b>: Membran im Ruhezustand hoch durchlässig für Chlorid und Kalium, kaum für Natrium.", "<b>2. Konzentrationsgradient</b>: Teilchen streben gleichmäßige Verteilung an → Bewegung von hoher zu niedriger Konzentration = <b>Diffusion</b>.", "<b>3. Potenzialgradient</b>: Die Ionen wollen den Spannungsunterschied von ≈ −70 mV ausgleichen. Betrifft die positiven Natriumionen außen; Kalium innen und Chlorid außen sind bereits im Einklang.", "<b>4. Natrium-Kalium-Pumpe</b>: befördert unter Energieaufwand <b>3 Na⁺ hinaus</b> und <b>2 K⁺ hinein</b> und gleicht so den geringen Natriumeinstrom aus.", "Ergebnis: stabiles Ruhepotenzial von etwa −70 mV."]}}, {"id": "k4-0bfd659748", "kap": 4, "sec": "4.4 Das visuelle System", "stem": "Welche Aussagen zur Verschaltung innerhalb der Retina treffen zu?", "opts": [{"t": "Die direkteste Bahn verläuft von den Photorezeptorzellen über die Bipolarzellen zu den Ganglienzellen.", "c": true, "fb": "Bipolarzellen kombinieren die Signale mehrerer Photorezeptorzellen, Ganglienzellen die Signale einer oder mehrerer Bipolarzellen."}, {"t": "Horizontalzellen verbinden Photorezeptorzellen untereinander, sodass benachbarte Rezeptoren sich gegenseitig beeinflussen.", "c": true, "fb": "Sie greifen also früh in den Signalfluss ein, noch auf Rezeptorebene."}, {"t": "Die Axone der Ganglienzellen bilden den Sehnerv, der die visuelle Information aus dem Auge zum Gehirn transportiert.", "c": true, "fb": "Damit sind die Ganglienzellen die letzte Station innerhalb der Retina."}, {"t": "Als rezeptives Feld bezeichnet man diejenige Retinafläche, von der aus eine einzelne Nervenzelle beeinflusst werden kann.", "c": true, "fb": "Gleichbedeutend: die Gesamtheit der Photorezeptorzellen, die Einfluss auf diese eine Nervenzelle haben."}], "concept": {"title": "Signalfluss und rezeptives Feld", "points": ["Hauptbahn: <b>Photorezeptorzellen → Bipolarzellen → Ganglienzellen</b>. Dabei wird schrittweise zusammengefasst (mehrere Rezeptoren auf eine Bipolarzelle, mehrere Bipolarzellen auf eine Ganglienzelle).", "<b>Horizontalzellen</b>: verbinden Photorezeptorzellen untereinander (frühe Beeinflussung).", "<b>Amakrinzellen</b>: interagieren etwas später mit Bipolar- und Ganglienzellen und beeinflussen den Signalfluss zu den Ganglienzellen.", "Die <b>Axone der Ganglienzellen</b> bilden den <b>Sehnerv</b>.", "<b>Rezeptives Feld</b> = Retinafläche, von der aus eine einzelne Nervenzelle beeinflusst werden kann."]}}, {"id": "k4-4ef65bf409", "kap": 4, "sec": "4.3.2 Das Rückenmark", "stem": "Welche Aussagen zum Rückenmark sind korrekt?", "opts": [{"t": "Die Spinalnerven treten auf nur einer Körperseite aus dem Rückenmark aus und verlaufen von dort zu entfernteren Gebieten.", "c": false, "fb": "Sie treten auf beiden Seiten durch die Zwischenräume zwischen den Wirbelkörpern aus."}, {"t": "Im Seitenstrang verläuft unter anderem die Pyramidenbahn, ein paariges Faserbündel mit zentraler Rolle bei der motorischen Steuerung.", "c": true, "fb": "Der Seitenstrang gehört wie Hinter- und Vorderstrang zur weißen Substanz."}, {"t": "Sensorische Nervenfasern dringen über die Hinterwurzel in das Rückenmark ein, motorische treten über die Vorderwurzel aus.", "c": true, "fb": "Das passt zur Verteilung der grauen Substanz: sensorisch hinten, motorisch vorne."}, {"t": "Der Zentralkanal durchzieht das Rückenmark von oben nach unten und ist mit Liquor gefüllt.", "c": true, "fb": "Er liegt als kleine, annähernd kreisförmige Öffnung im Zentrum der grauen Substanz."}], "concept": {"title": "Querschnitt des Rückenmarks", "points": ["<b>Graue Substanz</b> (H-förmiger innerer Kern, überwiegend Zellkörper): <b>Hinterhörner</b> dorsal = sensorisch, <b>Vorderhörner</b> ventral = motorisch.", "<b>Weiße Substanz</b> (außen, überwiegend Axone): <b>Hinterstrang</b> = aufsteigende Bahnen zum Gehirn, <b>Vorderstrang</b> = absteigende Bahnen vom Gehirn, <b>Seitenstrang</b> = u. a. <b>Pyramidenbahn</b> (motorische Steuerung).", "<b>Zentralkanal</b>: kleine Öffnung im Zentrum der grauen Substanz, mit Liquor gefüllt.", "<b>Hinterwurzel</b> = Eintritt sensorischer Fasern (davor die Verdickung <b>Spinalganglion</b>), <b>Vorderwurzel</b> = Austritt motorischer Fasern.", "Rahmen: ca. 40–45 cm lang, zylindrisch, im Wirbelsäulenkanal; <b>Spinalnerven</b> treten beidseits aus, jedem ist ein <b>Dermatom</b> zugeordnet (mit Überlappung zu den Nachbarn)."]}}, {"id": "k4-f127827cbc", "kap": 4, "sec": "4.2.4 Neurotransmitter", "stem": "Welche Aussage über einzelne Neurotransmitter ist korrekt?", "opts": [{"t": "Noradrenalin ist chemisch eine Abbaustufe von Adrenalin und wirkt dämpfend auf die physiologische Erregung.", "c": false, "fb": "Es ist eine Vorstufe zu Adrenalin und wirkt aktivierend – beteiligt an physiologischer Erregung und Wachheit."}, {"t": "Acetylcholin ist neben der motorischen Kontrolle auch an komplexen mentalen Prozessen wie Lernen, Gedächtnis, Schlaf und Träumen beteiligt.", "c": true, "fb": "Für die motorische Kontrolle ist es am Übergang zwischen Nerven und Muskeln zuständig."}, {"t": "Adrenalin ist ein reines Stresshormon und wirkt im zentralen Nervensystem nicht als Neurotransmitter.", "c": false, "fb": "Laut Fußnote wirkt Adrenalin im zentralen Nervensystem sehr wohl auch als Neurotransmitter."}, {"t": "GABA ist vor allem im Rückenmark vertreten und wirkt dort als wichtigster exzitatorischer Transmitter.", "c": false, "fb": "GABA ist vor allem im Gehirn vertreten und ist der bedeutendste inhibitorisch wirkende Neurotransmitter."}], "concept": {"title": "Die wichtigsten Neurotransmitter im Überblick", "points": ["<b>Glutamat</b>: wichtigster <b>exzitatorischer</b> Transmitter im Gehirn; emotionale Reaktionen, Lernen, Gedächtnis; Transmitter der Sinneszellen.", "<b>GABA</b>: bedeutendster <b>inhibitorischer</b> Transmitter, vor allem im Gehirn; Benzodiazepine binden an GABA-Rezeptoren (angstlösend, schlaffördernd, muskelentspannend).", "<b>Dopamin</b>: Motivation und Belohnung; Mangel → Bewegungsprobleme, Morbus Parkinson durch Absterben dopaminproduzierender Neuronen.", "<b>Serotonin</b>: Regulation emotionaler Zustände; SSRI hemmen die Wiederaufnahme, häufig bei Depressionen.", "<b>Acetylcholin</b>: motorische Kontrolle am Übergang Nerv–Muskel; außerdem Lernen, Gedächtnis, Schlaf, Träumen.", "<b>Noradrenalin</b>: chemische <b>Vorstufe zu Adrenalin</b>, aktivierend – physiologische Erregung und Wachheit.", "Die Liste ist ausdrücklich eine <b>Auswahl</b>, nicht vollständig."]}}, {"id": "k4-592a385b7f", "kap": 4, "sec": "4.2.2 Ruhe- und Aktionspotenzial", "stem": "Welche Aussagen zur Fortleitung des Aktionspotenzials entlang des Axons treffen zu?", "opts": [{"t": "Ein Zurückwandern wird durch die Hyperpolarisation der bereits durchlaufenen Abschnitte verhindert, in denen die Kaliumkanäle inaktiviert sind.", "c": false, "fb": "Verantwortlich ist die Refraktärphase, und inaktiviert sind dort die Natriumkanäle – deshalb ist eine erneute Auslösung so kurz danach unmöglich."}, {"t": "Das Aktionspotenzial entsteht in der Nähe des Axonhügels und wandert von dort bis zu den Endknöpfchen.", "c": true, "fb": "Erst dort kann die Information an ein anderes Neuron weitergegeben werden."}, {"t": "Es breitet sich aus, indem benachbarte spannungsgesteuerte Natriumkanäle geöffnet werden und die Membran auch dort depolarisiert wird.", "c": true, "fb": "So entsteht Abschnitt für Abschnitt ein neues Aktionspotenzial – daher die Zündschnur-Analogie."}, {"t": "In myelinisierten Axonen wird die Potenzialveränderung im Bereich der Myelinscheiden aktiv durch Ionenströme weitergegeben.", "c": false, "fb": "Dort erfolgt die Ausbreitung passiv über die Abstoßungskräfte zwischen den geladenen Teilchen. Aktive Auslösung geschieht nur an den Ranvier-Schnürringen."}], "concept": {"title": "Fortleitung entlang des Axons", "points": ["Auslösung nahe dem <b>Axonhügel</b>, Wanderung bis zu den <b>Endknöpfchen</b>.", "<b>Unmyelinisiert</b>: benachbarte spannungsgesteuerte Natriumkanäle öffnen → dortige Depolarisation → neues Aktionspotenzial. Abschnitt für Abschnitt.", "<b>Myelinisiert – saltatorische Erregungsleitung</b>: Unter dem Myelin läuft die Potenzialveränderung <b>passiv</b> (sehr schnell, aber mit Abnahme über die Distanz). Nur an den <b>Ranvier-Schnürringen</b> hat die Membran Kontakt zur extrazellulären Flüssigkeit; dort liegen viele Natriumkanäle und es entstehen neue Aktionspotenziale.", "Daraus folgt: Der Abstand der Schnürringe darf nicht zu groß sein, sonst erreicht das abnehmende Signal den nächsten Ring nicht.", "<b>Nur eine Richtung</b>: Die durchlaufenen Abschnitte sind refraktär, ihre <b>Natriumkanäle inaktiviert</b> – wie das Feuer einer Zündschnur."]}}, {"id": "k4-e3229fad12", "kap": 4, "sec": "4.2.4 Neurotransmitter", "stem": "Welche Aussagen über Neurotransmitter und ihre Bedeutung treffen zu?", "opts": [{"t": "Bei vielen psychischen Erkrankungen vermutet man ein Ungleichgewicht in bestimmten Neurotransmittersystemen; Psychopharmaka greifen häufig genau dort ein.", "c": true, "fb": "Das ist die Brücke von der Zellebene zur Klinischen Psychologie und zur Psychopharmakologie."}, {"t": "Neurotransmitter übertragen die Erregung an elektrischen Synapsen von einer Nervenzelle auf andere Zellen.", "c": false, "fb": "Sie wirken an chemischen Synapsen. An elektrischen Synapsen wandern Ionen und kleine Moleküle direkt durch eine Art Röhre."}, {"t": "Enzyme, die Neurotransmitter im synaptischen Spalt abbauen, sind meist Proteine und beschleunigen biochemische Abläufe im Organismus.", "c": true, "fb": "Diese Definition steht in einer mit Ziffer nummerierten Fußnote und gehört damit zum Lernstoff."}, {"t": "Die im Skript genannte Liste der Neurotransmitter ist vollständig und umfasst alle im Nervensystem vorkommenden Botenstoffe.", "c": false, "fb": "Das Skript weist ausdrücklich darauf hin, dass es sich nur um eine Auswahl handelt – ebenso bei den genannten Aufgabengebieten."}], "concept": {"title": "Was Neurotransmitter sind und leisten", "points": ["<b>Definition</b>: Stoffe, die an <b>chemischen</b> Synapsen die Erregung von einer Nervenzelle auf andere Zellen übertragen. Sie bestimmen, welche Reaktion in der empfangenden Zelle ausgelöst wird.", "Sie liegen in den <b>synaptischen Vesikeln</b> und binden nach dem Schlüssel-Schloss-Prinzip an Rezeptorproteine.", "<b>Klinischer Bezug</b>: Bei vielen psychischen Erkrankungen wird ein Ungleichgewicht in Neurotransmittersystemen vermutet; Psychopharmaka setzen dort an (z. B. SSRI bei Depression, Benzodiazepine an GABA-Rezeptoren).", "<b>Abbau</b>: Wiederaufnahme, <b>Enzyme</b> (meist Proteine, die biochemische Abläufe beschleunigen) oder Astrozyten.", "Die Aufzählung im Skript ist eine <b>Auswahl</b>, keine vollständige Liste."]}}, {"id": "k4-2cb088db18", "kap": 4, "sec": "4.1 Was ist Biologische Psychologie", "stem": "Welche Aussage zum heutigen Verständnis der Funktionsweise des Gehirns entspricht dem Kapitel?", "opts": [{"t": "Seit Brocas Arbeiten gilt als gesichert, dass für jede spezifische Aufgabe genau eine Gehirnregion zuständig ist.", "c": false, "fb": "Genau das hat sich als zu einfach erwiesen. Broca lieferte lediglich den ersten Hinweis auf spezialisierte Funktionen."}, {"t": "In der Regel ist nicht eine einzelne Gehirnregion für eine Aufgabe zuständig, sondern es handelt sich um ein komplexes Zusammenspiel vieler Regionen.", "c": true, "fb": "Einigen Regionen konnten zwar spezifische Funktionen zugeordnet werden, aber eben nicht im Sinne einer Eins-zu-eins-Zuordnung."}, {"t": "Fragen wie die nach der Entstehung des Bewusstseins gelten inzwischen als weitgehend geklärt.", "c": false, "fb": "Sie zählen ausdrücklich zu den trotz vorhandener Theorien noch ungeklärten Fragen."}, {"t": "Die Biologische Psychologie interessiert sich ausschließlich für physische Merkmale und klammert psychische Zustände bewusst aus.", "c": false, "fb": "Ihr Gegenstand ist gerade die Beziehung zwischen physischen Merkmalen, Zuständen und Prozessen einerseits und psychischen Zuständen andererseits."}], "concept": {"title": "Von der Lokalisation zum Netzwerk", "points": ["<b>Gegenstand der Biologischen Psychologie</b>: die Beziehung zwischen physischen Merkmalen, Zuständen und Prozessen und den psychischen Zuständen.", "<b>Historischer Anstoß</b>: Einzelfälle wie Phineas Gage (1848, linker vorderer Frontallappen) und Patient „Tan“ (Broca, Sprachproduktion, linke Hemisphäre) warfen neue Fragen auf.", "<b>Zwischenschritt</b>: Einigen Regionen konnten spezifische Funktionen zugeordnet werden, unterstützt durch Methoden zur Messung der Gehirnaktivität.", "<b>Heutiger Stand</b>: In der Regel ist nicht eine einzelne Region für eine Aufgabe zuständig, sondern ein komplexes Zusammenspiel vieler Regionen.", "Vieles bleibt offen – etwa, was Bewusstsein ist und wie es entsteht."]}}, {"id": "k4-4d19765436", "kap": 4, "sec": "4.2.2 Ruhe- und Aktionspotenzial", "stem": "Welche Aussagen zum Ablauf eines Aktionspotenzials sind korrekt?", "opts": [{"t": "Den durch den Natriumeinstrom bedingten Anstieg des Membranpotenzials bezeichnet man auch als Aufstrich.", "c": true, "fb": "Er beginnt, sobald der Schwellenwert überschritten ist und sich die spannungsgesteuerten Natriumkanäle öffnen."}, {"t": "Während des Aufstrichs und der frühen Repolarisationsphase bleibt eine zusätzliche Erregung ohne Wirkung.", "c": true, "fb": "Hier herrscht die absolute Refraktärphase; die Natriumkanäle sind noch im inaktivierten Zustand."}, {"t": "Spannungsgesteuerte Ionenkanäle sind im Ruhezustand normalerweise geöffnet und schließen sich erst bei Überschreiten des Schwellenwerts.", "c": false, "fb": "Umgekehrt: Im Ruhezustand sind sie normalerweise geschlossen und öffnen sich erst bei einer bestimmten Spannung."}, {"t": "Die relative Refraktärphase dauert bis ins Nachpotenzial an; dort kann nur eine erhöhte Erregungsstärke ein zweites Aktionspotenzial auslösen.", "c": true, "fb": "Sie schließt unmittelbar an die absolute Refraktärphase an."}], "concept": {"title": "Phasen eines Aktionspotenzials", "points": ["<b>Ruhepotenzial</b> ≈ −70 mV. Schwellenwert ≈ <b>−55 mV</b>.", "<b>Aufstrich / Depolarisation</b>: spannungsgesteuerte Natriumkanäle öffnen, massiver Na⁺-Einstrom.", "<b>Overshoot</b>: Potenzial steigt auf etwa <b>+50 mV</b>, Zellinneres jetzt positiv.", "Natriumkanäle schließen nach ca. <b>1 ms</b> und werden <b>inaktiviert</b>; verzögert öffnen die Kaliumkanäle.", "<b>Repolarisation</b>: K⁺-Ausstrom, Zellinneres wird wieder negativ.", "<b>Hyperpolarisation / Nachpotenzial</b>: Kaliumkanäle schließen erst nach Erreichen des Ruhepotenzials → Potenzial unterschreitet den Ruhewert. Die Natrium-Kalium-Pumpe stellt die Ausgangslage wieder her.", "<b>Absolute Refraktärphase</b> (Aufstrich + frühe Repolarisation): keine Erregung möglich. <b>Relative Refraktärphase</b> (bis ins Nachpotenzial): nur erhöhte Erregungsstärke wirkt.", "<b>Alles-oder-Nichts-Gesetz</b>: entweder gar kein Aktionspotenzial oder ein für die Zelle immer gleich starkes."]}}, {"id": "k4-0a17f609ea", "kap": 4, "sec": "4.3.4 Peripheres Nervensystem", "stem": "Welche Aussage zum somatischen Nervensystem ist korrekt?", "opts": [{"t": "Spezialisierte Rezeptoren an Haut, in Muskeln und Gelenken senden Informationen an das Rückenmark, von wo sie an das Gehirn weitergeleitet werden.", "c": true, "fb": "In analoger Weise laufen Signale vom Gehirn über das Rückenmark zurück an Muskeln, Gelenke und Haut."}, {"t": "Es leitet Signale ausschließlich zum Gehirn hin; absteigende Bahnen verlaufen über das autonome Nervensystem.", "c": false, "fb": "E
